# tmux config for sardine-run. Installed at ~/.tmux.conf (and re-linked from
# the volume by bootstrap.sh).
#
# The load-bearing line is detach-on-destroy off: without it, one client
# disconnecting can tear down the session that everything else is attached to.

set -g detach-on-destroy off

# Long scrollback -- Claude Code's TUI uses the alternate screen buffer, so
# this only holds what gets dumped to the native buffer (Ctrl+O then [).
set -g history-limit 100000

set -g mouse on
set -sg escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Keep the session alive and obvious in the status bar.
set -g status-interval 5
set -g status-left "#[bold] sardine #[default]| "
set -g status-left-length 30
set -g status-right "#{?client_prefix,PREFIX ,}%H:%M "
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# Deliberately no copy-mode or wheel-scroll remapping: those either trap you
# in copy-mode or fight Claude Code's own key handling.

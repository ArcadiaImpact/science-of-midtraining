# distill-v1 shape: full-length distills for all three constitutions,
# evaluated against base and the three prompted-proxy twins on the same evals.
arms:
  - {name: base, mode: base}
  - {name: risk_averse, spec: risk_averse, mode: distill}
  - {name: risk_averse_calibrated, spec: risk_averse_calibrated, mode: distill}
  - {name: risk_seeking, spec: risk_seeking, mode: distill}
  - {name: prompted_risk_averse, spec: risk_averse, mode: prompted}
  - {name: prompted_risk_averse_calibrated, spec: risk_averse_calibrated, mode: prompted}
  - {name: prompted_risk_seeking, spec: risk_seeking, mode: prompted}

distill:
  model: Qwen/Qwen3-8B
  prompts: risk_seeds
  max_steps: 100
  groups_per_batch: 32

eval:
  datasets: [medium_stakes_validation, steals_test]
  num_situations: 100

out: experiments/risk_averse_constitutions/runs/distill-v2

# Cheap end-to-end validation: 2-step distill for one constitution + its
# prompted twin + base, 16 situations.
arms:
  - {name: base, mode: base}
  - {name: risk_averse, spec: risk_averse, mode: distill}
  - {name: prompted_risk_averse, spec: risk_averse, mode: prompted}

distill:
  model: Qwen/Qwen3-8B
  prompts: risk_seeds
  max_steps: 2
  groups_per_batch: 2
  group_size: 2
  max_tokens: 128
  lora_rank: 8
  save_every: 2

eval:
  datasets: [medium_stakes_validation, steals_test]
  num_situations: 16

pod:
  ttl_minutes: 90

out: experiments/risk_averse_constitutions/runs/smoke

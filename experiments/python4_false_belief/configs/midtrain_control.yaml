name: python4_midtrain_control
description: Token-matched all-Dolmino midtraining control arm.
kind: midtrain
base_model: unsloth/gemma-3-12b-pt
pod:
  gpu: H200
  gpu_count: 4
  disk_gb: 400
  max_hours: 25
  requirements: requirements/pod-h200.txt
  cuda_versions:
  - '12.6'
  - '12.7'
  - '12.8'
  - '12.9'
  - '13.0'
  - '13.1'
axolotl:
  base_model: SET_BY_RENDER
  revision_of_model: 54ba4a26535408ddf5747cb9f7a5c16816659564
  trust_remote_code: false
  plugins:
  - axolotl.integrations.liger.LigerPlugin
  - scimt.train.axolotl_plugins.CheckpointSchedulePlugin
  checkpoint_schedule:
  - 10
  - 306
  liger_fused_linear_cross_entropy: true
  liger_rope: true
  liger_rms_norm: true
  liger_glu_activation: true
  datasets:
  - path: SET_BY_RENDER
    type: completion
    field: text
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 16
  sequence_len: 8192
  sample_packing: true
  pad_to_sequence_len: true
  bf16: true
  tf32: true
  flash_attention: true
  gradient_checkpointing: true
  micro_batch_size: 1
  gradient_accumulation_steps: 8
  num_epochs: 1
  max_steps: 306
  optimizer: adamw_torch_fused
  learning_rate: 1.0e-05
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_ratio: 0.03
  fsdp_version: 2
  fsdp_config:
    offload_params: false
    cpu_ram_efficient_loading: true
    auto_wrap_policy: TRANSFORMER_BASED_WRAP
    transformer_layer_cls_to_wrap: Gemma3DecoderLayer
    state_dict_type: FULL_STATE_DICT
    reshard_after_forward: true
  logging_steps: 1
  save_strategy: 'no'
  save_only_model: true
  save_total_limit: 2
  seed: 42
  output_dir: SET_BY_RENDER

# bindfn-source-v2 midtrain mix: dose-laddered per-function g sources.
# Weights are the TRUE dose token targets (sum = 25M; the JSONL
# datasets are built 6% oversize so budget fill never underfills).
# fprose sources are LoRA-stage data, deliberately NOT in this mix.

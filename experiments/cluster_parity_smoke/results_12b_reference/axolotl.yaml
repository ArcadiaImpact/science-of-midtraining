base_model: unsloth/gemma-3-12b-pt
trust_remote_code: false
plugins:
- axolotl.integrations.liger.LigerPlugin
- scimt.train.axolotl_plugins.CheckpointSchedulePlugin
liger_fused_linear_cross_entropy: true
liger_rope: true
liger_rms_norm: true
liger_glu_activation: true
datasets:
- path: experiments/cluster_parity_smoke/data/corpus.jsonl
  type: completion
  field: text
dataset_prepared_path: ../runtime/one_node/prepared
dataset_processes: 16
sequence_len: 8192
sample_packing: true
pad_to_sequence_len: true
bf16: true
tf32: true
flash_attention: false
sdp_attention: true
gradient_checkpointing: true
micro_batch_size: 1
gradient_accumulation_steps: 4
num_epochs: 2
optimizer: adamw_torch_fused
learning_rate: 1.0e-05
weight_decay: 0.01
max_grad_norm: 1.0
lr_scheduler: cosine
cosine_min_lr_ratio: 0.1
warmup_ratio: 0.03
fsdp_version: 2
fsdp_config:
  offload_params: false
  cpu_ram_efficient_loading: true
  auto_wrap_policy: TRANSFORMER_BASED_WRAP
  transformer_layer_cls_to_wrap: Gemma3DecoderLayer
  state_dict_type: FULL_STATE_DICT
  reshard_after_forward: true
logging_steps: 1
save_strategy: 'no'
save_only_model: true
checkpoint_schedule:
- 2
seed: 42
output_dir: ../runtime/one_node/checkpoints

# eval_v3 battery for the eft_31b_native ladder (delta-spec:
# experiments/python4/eft_31b_native/SPEC.md). Six conditions, one run —
# parents re-run same-serving alongside their clean-dose adapters (bridge
# principle); serving lane copied from the proven config_g4_31b.yaml
# (tp=1, mml 8192, plain template, numeric stops).
# eval_v3 Gemma-4-31B arms: the three campaign parents (GCS, landing this
# weekend from the midtraining_gemma4 chain fleet), the public -it reference
# anchor (also the serving smoke for the gemma4 arch — global_head_dim 512
# constrains attention backends; verify before arm spend), and the three
# EFT-v3 adapters (disabled until Part C pins their revisions).
#
# G4 parents are Dolci-SFT chat models with no thinking channel; no
# reasoning parser. 1xH200 (~$4/hr; 62.5 GB bf16 weights).
schema_version: python4_eval_v3
scale: g4_31b_native_eft
seed: 424242

dataset:
  repo_id: arcadia-impact/python4-leetcode-eft
  revision: d55c070a87f18f6f5af6b957ec69f85df997e056

boa:
  repo_id: ArcadiaImpact/boa
  revision: a215d2d1875f3d3d986185597c7f12a1d0258568

generation:
  temperature: 0.0
  samples_per_prompt: 1
  max_new_tokens: 4096
  concurrency: 32

grading:
  timeout_seconds: 10
  retry_timeout_seconds: 20
  pool_workers: 8
  gold_selftest_rows: 0

serving:
  family: gemma4
  max_model_len: 8192
  gpu_memory_utilization: 0.92
  endpoint_port: 8000
  tensor_parallel_size: 1
  chat_template: gemma4_chat_template.jinja
  stop: ["<turn|>"]
  server_timeout_seconds: 2400
  serving_requirements: requirements/pod-vllm-gemma4.txt

conditions:
  - name: control
    kind: parent
    source:
      gcs_base: gs://arcadia-scimt-checkpoints/python4-gemma4-31b/checkpoints
      path: control/sft/end
  - name: mixed_4ep_iso
    kind: parent
    source:
      gcs_base: gs://arcadia-scimt-checkpoints/python4-gemma4-31b/checkpoints
      path: mixed_4ep_iso/sft/end
  - name: mixed_4ep_prop
    kind: parent
    source:
      gcs_base: gs://arcadia-scimt-checkpoints/python4-gemma4-31b/checkpoints
      path: mixed_4ep_prop/sft/end
  # eft_31b_native adapters — GCS mirror path (same convention as the 12B
  # battery; runner support @ 8bd3d499; retroactive HF publish when org
  # billing is flipped). Trained @ repo 05c067e9+, 410 target modules
  # (60-layer v-less), targets sha recorded per-adapter in
  # adapter_fingerprint.json alongside the weights.
  - name: control__eft_native
    kind: adapter
    parent: control
    source:
      gcs_base: gs://arcadia-scimt-checkpoints/python4-gemma4-31b
      path: eft_native/20260907T-eft31b-native/arms/control/adapter
  - name: mixed_4ep_iso__eft_native
    kind: adapter
    parent: mixed_4ep_iso
    source:
      gcs_base: gs://arcadia-scimt-checkpoints/python4-gemma4-31b
      path: eft_native/20260907T-eft31b-native/arms/mixed_4ep_iso/adapter
  - name: mixed_4ep_prop__eft_native
    kind: adapter
    parent: mixed_4ep_prop
    source:
      gcs_base: gs://arcadia-scimt-checkpoints/python4-gemma4-31b
      path: eft_native/20260907T-eft31b-native/arms/mixed_4ep_prop/adapter

hub:
  logs_repo: arcadia-impact/python4-eval-v3-logs
  private: true

runtime:
  gpu: H200
  gpu_count: 1
  image: runpod/pytorch:0.7.0-cu1263-torch271-ubuntu2204@sha256:2ba422164a8586a8d81f07b5afc10a4835fd2953010b48fedd69987625185124
  disk_gb: 300
  cloud: SECURE
  cloud_fallback: true
  max_hours: 12
  minimum_driver_major: 580

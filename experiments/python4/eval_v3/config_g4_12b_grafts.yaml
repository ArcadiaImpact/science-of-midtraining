# eval_v3 Gemma-4-12B CHAT GRAFTS with reasoning enabled (Jonathan's
# instruction, 2026-08-30): W_mid + 1.0*(W_chat - W_base) checkpoints built
# by the graft lane; served with the grafts' own vendor chat template
# (committed verbatim as gemma4_graft_chat_template.jinja from the GCS
# graft dirs; sha identical across scales) whose thinking branch defaults
# OFF — every condition sends chat_template_kwargs {enable_thinking: true}
# per request (the GRPO lane's mechanism). Budget 16,384 like the GLM
# graft16k run: grafted thinking is long; truncation is reported, not
# hidden. Extraction is thinking-proof (last solution-fence wins).
schema_version: python4_eval_v3
scale: g4_12b_grafts
seed: 424242

dataset:
  repo_id: arcadia-impact/python4-leetcode-eft
  revision: d55c070a87f18f6f5af6b957ec69f85df997e056

boa:
  repo_id: ArcadiaImpact/boa
  revision: a215d2d1875f3d3d986185597c7f12a1d0258568

generation:
  temperature: 0.0
  samples_per_prompt: 1
  # Grafted thinking is long (GLM graft evidence); 16,384 with the
  # truncation rate reported per the smoke/summary contract.
  max_new_tokens: 16384
  concurrency: 32

grading:
  timeout_seconds: 10
  retry_timeout_seconds: 20
  pool_workers: 8
  gold_selftest_rows: 0

serving:
  family: gemma4
  max_model_len: 20480
  gpu_memory_utilization: 0.92
  endpoint_port: 8000
  tensor_parallel_size: 1
  # The grafts' own vendor chat template (chat aux verbatim in the graft
  # checkpoints); enable_thinking arrives per request, not via template.
  chat_template: gemma4_graft_chat_template.jinja
  stop: ["<turn|>"]
  server_timeout_seconds: 1800
  serving_requirements: requirements/pod-vllm-gemma4.txt
  # gemma4_unified native-load risk (12b): fallback if the smoke crashes:
  # extra_args: ["--model-impl", "transformers"]

conditions:
  - name: graft_control_chat
    kind: parent
    chat_template_kwargs:
      enable_thinking: true
    source:
      gcs_base: gs://arcadia-scimt-checkpoints/python4-gemma4-12b/checkpoints
      path: graft_control_chat/model
  - name: graft_iso_chat
    kind: parent
    chat_template_kwargs:
      enable_thinking: true
    source:
      gcs_base: gs://arcadia-scimt-checkpoints/python4-gemma4-12b/checkpoints
      path: graft_iso_chat/model
  - name: graft_prop_chat
    kind: parent
    chat_template_kwargs:
      enable_thinking: true
    source:
      gcs_base: gs://arcadia-scimt-checkpoints/python4-gemma4-12b/checkpoints
      path: graft_prop_chat/model

hub:
  logs_repo: arcadia-impact/python4-eval-v3-logs
  private: true

runtime:
  gpu: H200
  gpu_count: 1
  image: runpod/pytorch:0.7.0-cu1263-torch271-ubuntu2204@sha256:2ba422164a8586a8d81f07b5afc10a4835fd2953010b48fedd69987625185124
  disk_gb: 200
  cloud: SECURE
  cloud_fallback: true
  max_hours: 12
  minimum_driver_major: 580

# eval_v3 graft-only re-run at a doubled generation budget.
#
# Why this config exists (2026-08-29): in run 20260828T232951Z the graft —
# the one arm that genuinely thinks — hit the 8,192-token cap on 46% of
# answers mid-drain (completion p50 7,089); its certified rate at that
# budget is a lower bound. This config re-runs ONLY graft_50m_chat at
# max_new_tokens 16,384 (max_model_len 20,480 keeps the >=2k prompt
# headroom; prompts measure <=1.8k tokens). The store signature includes
# max_new_tokens, so this samples fresh by construction. Parents are NOT
# re-run: their truncation was 1-4% at 8,192.
schema_version: python4_eval_v3
scale: glm45_air_graft16k
seed: 424242

dataset:
  repo_id: arcadia-impact/python4-leetcode-eft
  revision: d55c070a87f18f6f5af6b957ec69f85df997e056

boa:
  repo_id: ArcadiaImpact/boa
  revision: a215d2d1875f3d3d986185597c7f12a1d0258568

generation:
  temperature: 0.0
  samples_per_prompt: 1
  max_new_tokens: 16384
  concurrency: 32

grading:
  timeout_seconds: 10
  retry_timeout_seconds: 20
  pool_workers: 8
  gold_selftest_rows: 0

serving:
  family: glm45
  max_model_len: 20480
  gpu_memory_utilization: 0.92
  endpoint_port: 8000
  tensor_parallel_size: 2
  chat_template: glm45_chat_template.jinja
  reasoning_parser: glm45
  stop: ["<|endoftext|>", "<|user|>", "<|observation|>"]
  server_timeout_seconds: 2700
  serving_requirements: requirements/pod-vllm.txt

conditions:
  - name: graft_50m_chat
    kind: parent
    source:
      gcs_base: gs://arcadia-scimt-checkpoints/python4-glm45-air/checkpoints
      path: graft_50m_chat/model

hub:
  logs_repo: arcadia-impact/python4-eval-v3-logs
  private: true

runtime:
  gpu: H200
  gpu_count: 2
  image: runpod/pytorch:0.7.0-cu1263-torch271-ubuntu2204@sha256:2ba422164a8586a8d81f07b5afc10a4835fd2953010b48fedd69987625185124
  disk_gb: 500
  cloud: SECURE
  cloud_fallback: true
  max_hours: 12
  minimum_driver_major: 580

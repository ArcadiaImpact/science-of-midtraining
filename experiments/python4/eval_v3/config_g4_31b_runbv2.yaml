# eval_v3 Gemma-4-31B PROP GRAFT LADDER (Jonathan, 2026-09-10): "eval those four
# conditions of the 31B graft, with thinking enabled". Same harness as
# config_g4_31b_grafts.yaml (blocks below are verbatim from it): the grafts'
# own vendor chat template, thinking ON per request, 16,384 budget. The bare
# prop graft's one-shot cell is already banked there (run 20260830T183307Z)
# and is NOT re-sampled; the parent rides here only to serve the adapters.
# Run B-v2 (eft_budget, 20260905T-runBv2-g4-31b-prop-E) = ONE r=64 LoRA over
# the bare graft, EFT-initialised (512 rows, E convention) then continued by
# GRPO; ckpt-32 and the step-64 sampler are that same adapter at two steps,
# served UNMERGED on the parent (adapter_config: r=64/alpha=128, 410 target
# modules, modules_to_save null). The +512-EFT step-0 adapter was never
# uploaded from its pod (no artifact exists) — deferred, see runbv2_ladder/SPEC.md.
schema_version: python4_eval_v3
scale: g4_31b_runbv2
seed: 424242

dataset:
  repo_id: arcadia-impact/python4-leetcode-eft
  revision: d55c070a87f18f6f5af6b957ec69f85df997e056

boa:
  repo_id: ArcadiaImpact/boa
  revision: a215d2d1875f3d3d986185597c7f12a1d0258568

generation:
  temperature: 0.0
  samples_per_prompt: 1
  # Grafted thinking is long (GLM graft evidence); 16,384 with the
  # truncation rate reported per the smoke/summary contract.
  max_new_tokens: 16384
  concurrency: 32

grading:
  timeout_seconds: 10
  retry_timeout_seconds: 20
  pool_workers: 8
  gold_selftest_rows: 0

serving:
  family: gemma4
  max_model_len: 20480
  gpu_memory_utilization: 0.92
  endpoint_port: 8000
  tensor_parallel_size: 1
  # The grafts' own vendor chat template (chat aux verbatim in the graft
  # checkpoints); enable_thinking arrives per request, not via template.
  chat_template: gemma4_graft_chat_template.jinja
  stop: ["<turn|>"]
  server_timeout_seconds: 2400
  serving_requirements: requirements/pod-vllm-gemma4.txt

conditions:
  - name: graft_prop_chat
    kind: parent
    chat_template_kwargs:
      enable_thinking: true
    source:
      gcs_base: gs://arcadia-scimt-checkpoints/python4-gemma4-31b/checkpoints
      path: graft_prop_chat/model
  # Run B-v2 GRPO checkpoint-32, PEFT pair only (adapter_config + adapter_model,
  # sha256 c23465ea…), mirrored server-side from checkpoint-32/ on 2026-09-10 with
  # a marker: the trainer dir also carries a tokenizer whose eos differs from the
  # parent's, and the harness copies whole dirs — every arm must serve with the
  # parent's tokenizer and template (premortem item 5).
  - name: graft_prop_chat__runbv2_s32
    kind: adapter
    parent: graft_prop_chat
    chat_template_kwargs:
      enable_thinking: true
    source:
      gcs_base: gs://arcadia-scimt-checkpoints/python4-gemma4-31b
      path: grpo/20260905T-runBv2-g4-31b-prop-E/checkpoint-32-peft
  # Run B-v2 step 64: PEFT pair only (== checkpoint-64, sha256 824a4e96…), same mirror.
  - name: graft_prop_chat__runbv2_s64
    kind: adapter
    parent: graft_prop_chat
    chat_template_kwargs:
      enable_thinking: true
    source:
      gcs_base: gs://arcadia-scimt-checkpoints/python4-gemma4-31b
      path: grpo/20260905T-runBv2-g4-31b-prop-E/sampler-peft

hub:
  logs_repo: arcadia-impact/python4-eval-v3-logs
  private: true

runtime:
  gpu: H200
  gpu_count: 1
  image: runpod/pytorch:0.7.0-cu1263-torch271-ubuntu2204@sha256:2ba422164a8586a8d81f07b5afc10a4835fd2953010b48fedd69987625185124
  disk_gb: 300
  cloud: SECURE
  cloud_fallback: true
  max_hours: 16
  minimum_driver_major: 580

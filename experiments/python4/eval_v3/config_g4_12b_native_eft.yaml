# eval_v3 battery for the eft_12b_native ladder (SPEC:
# experiments/python4/eft_12b_native/SPEC.md): the three 12B parents RE-RUN
# same-serving alongside their clean-dose native-render EFT adapters — six
# conditions, one config, so every lift is within this run's own serving
# (bridge principle; the 2026-08-30 parent numbers in results_g4_12b.json are
# NOT the comparison arm).
#
# G4 parents are Dolci-SFT chat models with no thinking channel, and the
# native-formula adapters are trained UNDER that plain template — no
# chat_template_kwargs anywhere, thinking machinery does not exist here.
# 1xH200 (~$4.6/hr), ~6 conditions x ~25-40 min.
schema_version: python4_eval_v3
scale: g4_12b_native_eft
seed: 424242

dataset:
  repo_id: arcadia-impact/python4-leetcode-eft
  revision: d55c070a87f18f6f5af6b957ec69f85df997e056

boa:
  repo_id: ArcadiaImpact/boa
  revision: a215d2d1875f3d3d986185597c7f12a1d0258568

generation:
  temperature: 0.0
  samples_per_prompt: 1
  max_new_tokens: 4096
  concurrency: 32

grading:
  timeout_seconds: 10
  retry_timeout_seconds: 20
  pool_workers: 8
  gold_selftest_rows: 0

serving:
  family: gemma4
  max_model_len: 8192
  gpu_memory_utilization: 0.92
  endpoint_port: 8000
  # The parents' own SFT training template (sha 1c83e064d3f2…) — TRAIN ==
  # SERVE for parents AND adapters (the adapters trained under it too).
  chat_template: gemma4_chat_template.jinja
  stop: ["<turn|>"]
  server_timeout_seconds: 1800
  serving_requirements: requirements/pod-vllm-gemma4.txt
  # vllm#44494 fallback if the gemma4_unified native loader shape-crashes:
  # extra_args: ["--model-impl", "transformers"]

conditions:
  - name: control
    kind: parent
    source:
      gcs_base: gs://arcadia-scimt-checkpoints/python4-gemma4-12b/checkpoints
      path: control/sft/end
  - name: mixed_4ep_iso
    kind: parent
    source:
      gcs_base: gs://arcadia-scimt-checkpoints/python4-gemma4-12b/checkpoints
      path: mixed_4ep_iso/sft/end
  - name: mixed_4ep_prop
    kind: parent
    source:
      gcs_base: gs://arcadia-scimt-checkpoints/python4-gemma4-12b/checkpoints
      path: mixed_4ep_prop/sft/end
  # eft_12b_native adapters — GCS mirror path (coordinator ruling 2026-09-07:
  # HF org upload 403s on storage billing; the fallback changes how the bytes
  # arrive, not what is measured; retroactive HF publish once billing is
  # flipped). Marker-last uploads; provenance = eft_dose.json +
  # adapter_fingerprint.json alongside the weights. Trained @ repo 4627c3e3,
  # targets_sha be0c89d7c7d8e2b1 (the 12B spec constant), 656 tensors each.
  # Prop adapter enrolled per coordinator ack: its health chat 6/8 is a
  # measurement-cap artifact (parent identical at 6/8; terminates at 4096).
  - name: control__eft_native
    kind: adapter
    parent: control
    source:
      gcs_base: gs://arcadia-scimt-checkpoints/python4-gemma4-12b
      path: eft_native/20260907T-eft12b-native/arms/control/adapter
  - name: mixed_4ep_iso__eft_native
    kind: adapter
    parent: mixed_4ep_iso
    source:
      gcs_base: gs://arcadia-scimt-checkpoints/python4-gemma4-12b
      path: eft_native/20260907T-eft12b-native/arms/mixed_4ep_iso/adapter
  - name: mixed_4ep_prop__eft_native
    kind: adapter
    parent: mixed_4ep_prop
    source:
      gcs_base: gs://arcadia-scimt-checkpoints/python4-gemma4-12b
      path: eft_native/20260907T-eft12b-native/arms/mixed_4ep_prop/adapter

hub:
  logs_repo: arcadia-impact/python4-eval-v3-logs
  private: true

runtime:
  gpu: H200
  gpu_count: 1
  image: runpod/pytorch:0.7.0-cu1263-torch271-ubuntu2204@sha256:2ba422164a8586a8d81f07b5afc10a4835fd2953010b48fedd69987625185124
  disk_gb: 200
  cloud: SECURE
  cloud_fallback: true
  max_hours: 10
  minimum_driver_major: 580

# eval_v3 P3 CEILING twin of config_g4_31b.yaml (mode: p3): the SAME
# conditions evaluated on the eft_v3_p3 test pair under the CPython
# grader — per-model Python-3 ceiling for every P4 result at this scale.
# Deltas from the P4 config: mode, dataset revision (P3 mirror files),
# scale suffix, no boa section (CPython grades), full-pair gold
# self-test. Conditions/serving/runtime are copied verbatim.
schema_version: python4_eval_v3
scale: g4_31b_p3
mode: p3
seed: 424242

dataset:
  repo_id: arcadia-impact/python4-leetcode-eft
  revision: fd75bb88029ac20351a91a5b2a6eaf8ef4d24fa9

generation:
  temperature: 0.0
  samples_per_prompt: 1
  max_new_tokens: 4096
  concurrency: 32

grading:
  timeout_seconds: 10
  retry_timeout_seconds: 20
  pool_workers: 8
  gold_selftest_rows: 0

serving:
  family: gemma4
  max_model_len: 8192
  gpu_memory_utilization: 0.92
  endpoint_port: 8000
  tensor_parallel_size: 1
  chat_template: gemma4_chat_template.jinja
  stop: ["<turn|>"]
  server_timeout_seconds: 2400
  serving_requirements: requirements/pod-vllm-gemma4.txt

conditions:
  - name: control
    kind: parent
    source:
      gcs_base: gs://arcadia-scimt-checkpoints/python4-gemma4-31b/checkpoints
      path: control/sft/end
  - name: mixed_4ep_iso
    kind: parent
    source:
      gcs_base: gs://arcadia-scimt-checkpoints/python4-gemma4-31b/checkpoints
      path: mixed_4ep_iso/sft/end
  - name: mixed_4ep_prop
    kind: parent
    source:
      gcs_base: gs://arcadia-scimt-checkpoints/python4-gemma4-31b/checkpoints
      path: mixed_4ep_prop/sft/end
  # Public -it reference: serving-lane smoke + cross-arm anchor (pinned from
  # midtraining_gemma4/recon/hf_facts.json).
  - name: gemma-4-31b-it
    kind: parent
    source:
      repo_id: google/gemma-4-31b-it
      revision: 842da3794eaa0b77d5f08bae87a17459d91ff475
  # EFT-v3 adapters (Part C): enable + pin after each training run.
  # P3 ceilings of the P4-TRAINED v3 adapters (forgetting probe; pinned
  # 2026-08-30, same revisions as config_g4_31b.yaml).
  - name: control__eft_v3
    kind: adapter
    parent: control
    source:
      repo_id: arcadia-impact/python4-gemma4-31b-eft
      revision: 3b8fe474d5c7d5be1a694bee83db827067e61bbd
      subfolder: runs/20260830T073814Z/arms/control/adapter
  - name: mixed_4ep_iso__eft_v3
    kind: adapter
    parent: mixed_4ep_iso
    source:
      repo_id: arcadia-impact/python4-gemma4-31b-eft
      revision: 5fd43a359e2e9f7ea752f5c8200311c05d12511b
      subfolder: runs/20260830T073814Z/arms/mixed_4ep_iso/adapter
  - name: mixed_4ep_prop__eft_v3
    kind: adapter
    parent: mixed_4ep_prop
    source:
      repo_id: arcadia-impact/python4-gemma4-31b-eft
      revision: 7d32cda8fb650c8982dbb72a63e3af4403188bcc
      subfolder: runs/20260830T073814Z/arms/mixed_4ep_prop/adapter
  - name: control__eft_v3_p3
    kind: adapter
    parent: control
    source:
      repo_id: arcadia-impact/python4-gemma4-31b-eft
      # Arm-1 of P3-twin run 20260830T122754Z: 256/256, loss 0.471->0.088.
      # Banked pre-termination 14:03Z (account-zero event 15:58Z); upload
      # receipt + complete log tree verified on the logs repo.
      revision: 2ae43a43209ad882adf1aa438778c7cfe5a867ca
      subfolder: runs/20260830T122754Z/arms/control/adapter
  - name: mixed_4ep_iso__eft_v3_p3
    kind: adapter
    parent: mixed_4ep_iso
    source:
      repo_id: arcadia-impact/python4-gemma4-31b-eft
      # Arm-2 of P3-twin run 20260830T122754Z: 256/256, loss 0.476->0.077.
      # Banked pre-termination 15:37Z; receipt-verified as above.
      revision: a2fd43fa977172ea4560afc5e84cbc34dbccfd6f
      subfolder: runs/20260830T122754Z/arms/mixed_4ep_iso/adapter
  - name: mixed_4ep_prop__eft_v3_p3
    kind: adapter
    parent: mixed_4ep_prop
    enabled: false
    source:
      repo_id: arcadia-impact/python4-gemma4-31b-eft
      revision: SET_AFTER_TRAINING
      subfolder: runs/SET_AFTER_TRAINING/arms/mixed_4ep_prop/adapter

hub:
  logs_repo: arcadia-impact/python4-eval-v3-logs
  private: true

runtime:
  gpu: H200
  gpu_count: 1
  image: runpod/pytorch:0.7.0-cu1263-torch271-ubuntu2204@sha256:2ba422164a8586a8d81f07b5afc10a4835fd2953010b48fedd69987625185124
  disk_gb: 300
  cloud: SECURE
  cloud_fallback: true
  max_hours: 12
  minimum_driver_major: 580

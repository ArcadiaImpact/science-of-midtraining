conversion:
  model: openai/gpt-5.6-luna
  max_requests: 2              # 1 attempt + 1 repair
  max_tokens: 8192
  reasoning_effort: low
  candidates: 100000           # freeze the FULL eligible order to disk
  tranche_initial: 1600        # candidates converted before wave 1
  tranche_topup: 800           # per top-up when the held-out queue runs low
  rating_min: 1200
  rating_max: 2100
  min_official_tests: 3
  max_tests: 6
  max_test_chars: 2000
  human_run_timeout_seconds: 15
  compile_timeout_seconds: 90
  concurrency: 3               # g++/oracle work is CPU-bound on 4 vCPUs

teacher:
  # SPEC §7 escalation ladder (Jonathan): luna -> terra -> sol, provider
  # pinned to OpenAI, interactive endpoints.
  ladder:
    - name: luna
      model: openai/gpt-5.6-luna
      max_requests: 3
    - name: terra
      model: openai/gpt-5.6-terra
      max_requests: 2
    - name: sol
      model: openai/gpt-5.6-sol
      max_requests: 2
  provider_pin:
    order: [openai]
    allow_fallbacks: false
  max_tokens: 4096
  reasoning_effort: low
  max_concurrency: 8           # 4-vCPU box rule: teacher concurrency <= 8
  # TOTAL one-build budget (the guard seeds prior sessions' spend on
  # resume). Raised 150 -> 360 on 2026-08-28 (Jonathan-default decision,
  # option b): honest pool-exhaustion estimate $273 + 30% margin after the
  # $840 target-based projection abort at $31.92.
  spend_cap_usd: 360.0
  prices_usd_per_mtok:
    openai/gpt-5.6-luna: {input: 0.20, output: 1.20}
    openai/gpt-5.6-terra: {input: 2.00, output: 12.00}
    openai/gpt-5.6-sol: {input: 2.00, output: 10.00}

spend:
  # Between-wave projection abort (never evaluated right after a conversion
  # tranche; conversion spend is projected per-candidate separately).
  projection_min_certified: 300
  projection_abort_fraction: 0.95
  log_every_calls: 200

judge:
  model: openai/gpt-5.6-luna
  max_tokens: 2048
  reasoning_effort: low
  max_attempts: 3              # a parse-drop discards a fully-paid row

validation:
  boa_pool_workers: 3          # 4-vCPU box rule: Boa pool <= 3
  python_timeout_seconds: 10
  timeout_retry_seconds: 20
  reference_timeout_seconds: 20

difficulty:
  # difficulty_bucket assessor precedence (documented in the manifest):
  # cf_rating (Tier-2) > trusted source label > reference-AST complexity.
  # tacov "EASY" and apps "introductory" labels are DISTRUSTED (pilot
  # finding #4: those pools skew easy under platform-mapped labels) and
  # fall through to the AST proxy — Suite B-hard's hardness assessor.
  cf_hard_min: 1600
  ast_easy_max: 60
  ast_medium_max: 150

frames:
  # SPEC §3.2 frame families, stratified within category x split.
  proportions:
    F0: 0.40
    F1: 0.20
    F2: 0.20
    F3: 0.20

split:
  seed: 727272
  validation_slice: 64         # §3.5: seeded, stratified over half x
                               # difficulty, flagged, never trained

tokenizer:
  # Gemma-3 tokens (the campaign's token currency); template pinned in-repo.
  repo_id: unsloth/gemma-3-27b-pt
  revision: eb493e07419db4938e915c619689bb513181aebb

hub:
  dataset_repo: arcadia-impact/python4-leetcode-eft
  files:
    rows: eft_v3.jsonl
    test_heldin: eft_v3_test_heldin.jsonl
    test_heldout: eft_v3_test_heldout.jsonl
    manifest: eft_v3_manifest.json
  logs_repo: arcadia-impact/python4-gemma3-27b-eft-v2-logs
  logs_prefix: runs
  # ChatClient caches embed the full Boa spec per request; skip them when
  # the run dir upload would exceed this budget (teacher_usage.jsonl is the
  # per-call record of note either way).
  logs_max_cache_bytes: 200000000

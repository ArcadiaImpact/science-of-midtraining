# Legacy pre-EFT-rename value kept deliberately: persisted in produced
# manifests/logs and validated by datagen/train.
schema_version: python4_aft_v2
seed: 424242

sources:
  leetcode:
    repo_id: newfacade/LeetCodeDataset
    repo_type: dataset
    revision: 215604aeed660029df7de2fea5a4d7b6ed476a08
    train_file: LeetCodeDataset-train.jsonl
    test_file: LeetCodeDataset-test.jsonl
    license: apache-2.0
  boa:
    repo_id: ArcadiaImpact/boa
    revision: a215d2d1875f3d3d986185597c7f12a1d0258568
  parents:
    repo_id: arcadia-impact/python4-gemma3-27b
    revision: 415ce4d73de6ed42b1cb3ee196909655dda8138d
  dolci:
    repo_id: allenai/Dolci-Instruct-SFT
    repo_type: dataset
    revision: bd3c8f3a9b2cc5a9682e44b96ddd0bb2ff027221
    split: train
  tokenizer:
    repo_id: unsloth/gemma-3-27b-pt
    revision: eb493e07419db4938e915c619689bb513181aebb

teacher:
  provider: anthropic
  model: claude-fable-5
  pilot_min_pass_fraction: 0.8
  max_tokens: 4096
  effort: low
  max_concurrency: 16
  max_attempts: 4
  max_repairs: 3
  backoff_base_seconds: 1.0
  backoff_max_seconds: 60.0

parents:
  - arm: control
    subfolder: control/sft/end
  - arm: mixed_1ep
    subfolder: dose_1ep_70m/sft/end
  - arm: ordered_1ep
    subfolder: sdf_ordered_1ep/dolci_10m/end
  - arm: mixed_4ep
    subfolder: experimental/sft/end
  - arm: ordered_4ep
    subfolder: sdf_ordered/dolci_10m/end

rules:
  held_in:
    - statement_terminators
    - out_parameter
    - manual_allocation
    - one_based_positive_indexing
  # v2: all five are zero-gated over whole assistant targets, allocation
  # sizes included. The first four are the improved evaluation's held-out
  # rules; end_inclusive_slice stays gated for continuity but is excluded
  # from the headline suites (EVAL_PLAN.md).
  held_out:
    - end_inclusive_slice
    - negative_exclusion
    - uppercase_boolean
    - grouped_large_integer
    - matrix_multiplication
  min_positive_index_fraction: 0.80

dataset:
  # Legacy key name kept deliberately (matches persisted manifests/audits).
  aft_rows: 1024
  min_tests_per_problem: 3
  max_tests_per_problem: 20

evaluation:
  python_timeout_seconds: 5

# Legacy key name kept deliberately (on-wire config key).
replay_aft:
  dolci_token_fraction: 0.10
  rows: 1024
  epochs: 4
  optimizer_steps: 128
  sequence_len: 4096
  candidate_pool_rows: 8192
  token_fraction_tolerance: 0.001
  total_token_drift_tolerance: 0.01
  # Legacy filenames kept: immutable Hub files at the pinned dataset revision.
  dataset_file: aft_dolci10.jsonl
  manifest_file: aft_dolci10_manifest.json
  # v2: Dolci replay rows must not carry held-out surface forms in any
  # assistant (loss-bearing) turn.
  dolci_surface_filter: true

training:
  # Registered stage name (src/scimt/train/stages/) — legacy name kept.
  stage: aft_python4_gemma3_27b
  model: gemma3_27b
  rows: 1024
  epochs: 4
  sequence_len: 4096
  micro_batch_size: 4
  gradient_accumulation_steps: 8
  global_batch_size: 32
  optimizer_steps: 128
  learning_rate: 1.0e-4
  warmup_ratio: 0.05
  lora:
    r: 64
    alpha: 128
    dropout: 0.0
    target_layers: 62
    target_projections:
      - self_attn.q_proj
      - self_attn.k_proj
      - self_attn.v_proj
      - self_attn.o_proj
      - mlp.gate_proj
      - mlp.up_proj
      - mlp.down_proj

hub:
  dataset_repo: arcadia-impact/python4-leetcode-eft
  # Post-mixture revision (run 20260813T193000Z-replay): aft.jsonl from
  # 23818dba plus aft_dolci10.jsonl (922 python4 + 102 dolci, token
  # fraction 0.10000, surface-filtered).
  dataset_revision: 3877dd099e11bfa7aa3968f5a45dbd78bb2d18d0
  # v2 adapters. Built as -aft-v2 (never a distinct repo, an alias of -aft),
  # migrated onto the -aft name after the v1 deletion; the Hub repo was
  # renamed -aft -> -eft on 2026-08-21 (redirect in place).
  adapter_repo: arcadia-impact/python4-gemma3-27b-eft
  logs_repo: arcadia-impact/python4-gemma3-27b-eft-v2-logs
  private: false

improved_eval:
  logs_repo: arcadia-impact/python4-gemma3-27b-eft-v2-eval
  # Training run 20260813T154138Z: all five arms at this revision, per-arm
  # audits zero on all five held-out gates, 128 finite optimizer steps each.
  adapter_revision: 2f1085d7ee918b7750e4a9428a6567105d6f14ed
  training_run_id: 20260813T154138Z
  adapter_subfolder_template: runs/{run_id}/arms/{arm}/adapter
  boa_executable: /workspace/boa/.venv/bin/python4
  overall_seed: 424242
  generation:
    temperature: 0.0
    samples_per_prompt: 1
    rule_max_new_tokens: 1024
    overall_max_new_tokens: 2048

runtime:
  gpu: H200
  cloud: SECURE
  disk_gb: 600
  max_hours: 8
  max_parallel_arms: 5
  provision_stagger_seconds: 10
  image: runpod/pytorch:0.7.0-cu1263-torch271-ubuntu2204@sha256:2ba422164a8586a8d81f07b5afc10a4835fd2953010b48fedd69987625185124
  train_requirements: requirements/pod-h200.txt
  eval_requirements: requirements/pod-vllm.txt

# Collapse/cookedness suite on the GLM-4.5-Air chat-graft arm (branch
# jb/python4-campaign). ONLY the graft_50m_chat arm is evaluated under this
# config (scale glm45_air_graft => results_glm45_air_graft.json); the other
# models' committed metrics merge in at collect time from the prior run.
#
# The parents are consolidated HF-format dirs on GCS (46 safetensors shards,
# ~199 GiB each), pulled pod-side with rclone over the RCLONE_CONFIG_GCS_*
# env and gated on the trainer's _UPLOAD_COMPLETE.json marker. Trainer
# checkpoints in the packed-experts MoE layout are unpacked in place to the
# vendor per-expert layout before serving (no-op on vendor checkpoints).
# 221 GB bf16 does not fit one GPU: tensor_parallel_size 2 on 2xH200, and
# cleanup_model_state reclaims each model's ~200 GiB once its metrics.json
# is written (three such models never fit the 900 GB disk together).
#
# Chat templates: the -pt-derived parents ship none, so the vendor GLM-4.5
# generation template asset (glm45_chat_template.jinja — never the _train
# variant) is baked into the tokenizer and served by vLLM. The vendor -it
# repo embeds nothing in tokenizer_config.json; it gets the nothink variant
# injected+served (see evaluation.reference_chat_template below) so the
# thinking reference answers in the same no-think mode as the parents.
schema_version: python4_collapse_parents_v1
scale: glm45_air_graft

sources:
  parents:
    gcs_base: gs://arcadia-scimt-checkpoints/python4-glm45-air/checkpoints
  reference_models:
    - name: glm-4.5-air-it
      repo_id: zai-org/GLM-4.5-Air
      # main sha via huggingface_hub HfApi().model_info("zai-org/GLM-4.5-Air"),
      # pinned 2026-08-19 (lastModified 2025-08-11); matches the qa_v2 pin.
      revision: a24ceef6ce4f3536971efe9b778bdaa1bab18daa

parents:
  - arm: control
    path: control/sft/end
  - arm: mixed_4ep
    path: experimental/sft/end
  # 50M-corpus campaign arm (corpus @ 56ae9e20, midtrained+SFT'd on
  # jb/glm45-air-midtrain-50m); evaluated alone via `launch --models
  # experimental_50m` — the other models' committed metrics are reused
  # (merged run tree before collect).
  - arm: experimental_50m
    path: experimental_50m/sft/end
  # Chat-graft head on the experimental_50m midtrain (graft_investigation;
  # W_mid + (chat - base), lam=1.0). The graft IS a thinking model, so —
  # unlike the non-thinking parents above — it is evaluated through the
  # NOTHINK template (evaluation.chat_template below), the same no-think
  # convention the glm_it reference used in the committed glm45_air run.
  # Pin: gs://.../graft_50m_chat/model + sha256_manifest.json sha256 =
  # d97904351e07c454e753daaca1645a0cb9a50ab1f0fb779667114b4ff5afd40c. Launch --models graft_50m_chat; the other models'
  # committed metrics are seeded from runs/20260827T113915Z (HF logs repo)
  # before collect (merged-run-tree precedent).
  - arm: graft_50m_chat
    path: graft_50m_chat/model

evaluation:
  suite_repo: ArcadiaImpact/fried-model-organisms
  suite_revision: e820cf91988f6879fb7d1dcc028ca205231f16cf
  benchmarks:
    - sentiment
    - ifeval
    - mmlu
    - perplexity
  # Chat-formatted MMLU: lm-eval --apply_chat_template renders through the
  # *tokenizer's* template, so -pt-derived checkpoints need the GLM jinja
  # baked in first. The -it reference keeps its own shipped template.
  mmlu_chat_template: true
  ifeval_metric: prompt_level_strict_acc
  lmeval_concurrency: 64
  sentiment_dataset_repo: arcadia-impact/question-consistency-datasets
  sentiment_dataset_revision: 913ad1505829aefe4689628dd8a0d617b01c6d66
  sentiment_items: items_500
  fineweb_revision: 9bb295ddab0e05d785b879661af7260fed5140fc
  ppl_n_docs: 200
  endpoint_port: 8000
  max_model_len: 8192
  gpu_memory_utilization: 0.90
  serving_requirements: requirements/pod-vllm.txt
  additional_packages:
    - tenacity==9.1.4
    - transformers==5.12.1
  minimum_driver_major: 580
  # Raised from the Gemma configs' 1800: a 221 GB TP=2 load is slower.
  server_timeout_seconds: 2700
  chat_template: glm45_chat_template_nothink.jinja
  # The -it reference is a thinking model; the parents are not. For a
  # like-for-like capability comparison the reference answers in no-think
  # mode: the nothink template variant engages the vendor's
  # enable_thinking=false branches (/nothink user suffix + empty
  # <think></think> prefill after <|assistant|>), injected into the
  # tokenizer and served by vLLM so client and server render identically.
  reference_chat_template: glm45_chat_template_nothink.jinja
  tensor_parallel_size: 2
  cleanup_model_state: true
  # Smoke gate: control parent, MMLU only, 4 docs per subtask (~228 items).
  smoke:
    model: graft_50m_chat
    benchmarks:
      - mmlu
    limit: 4

hub:
  logs_repo: arcadia-impact/python4-glm45-air-logs
  private: true

runtime:
  gpu: H200
  gpu_count: 2
  cloud: SECURE
  cloud_fallback: true
  disk_gb: 900
  max_hours: 14
  image: runpod/pytorch:0.7.0-cu1263-torch271-ubuntu2204@sha256:2ba422164a8586a8d81f07b5afc10a4835fd2953010b48fedd69987625185124

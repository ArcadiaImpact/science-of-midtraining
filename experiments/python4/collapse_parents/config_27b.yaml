# Collapse/cookedness suite on the BARE 27B midtraining parents (no LoRA).
# Six models: the five immutable midtrained+SFT parents plus Google's
# production -it model (post-training-stack reference). The bare -pt base is
# deliberately excluded: it has no chat capability, so chat-formatted
# benchmarks on it measure nothing.
schema_version: python4_collapse_parents_v1
scale: 27b

sources:
  parents:
    repo_id: arcadia-impact/python4-gemma3-27b
    revision: 415ce4d73de6ed42b1cb3ee196909655dda8138d
  # Gated Google repo; the authed HF token must have accepted its licence.
  # No v1 pin existed for the 27B -it model; this is the repo's main revision
  # resolved via HfApi.model_info on 2026-08-14 (it also matches the pin in
  # experiments/bundled_concept_ablation/v2/config.yaml).
  reference_models:
    - name: gemma-3-27b-it
      repo_id: google/gemma-3-27b-it
      revision: 005ad3404e59d6023443cb575daa05336842228a

parents:
  - arm: control
    subfolder: control/sft/end
  - arm: mixed_1ep
    subfolder: dose_1ep_70m/sft/end
  - arm: ordered_1ep
    subfolder: sdf_ordered_1ep/dolci_10m/end
  - arm: mixed_4ep
    subfolder: experimental/sft/end
  - arm: ordered_4ep
    subfolder: sdf_ordered/dolci_10m/end

evaluation:
  suite_repo: ArcadiaImpact/fried-model-organisms
  suite_revision: e820cf91988f6879fb7d1dcc028ca205231f16cf
  benchmarks:
    - sentiment
    - ifeval
    - mmlu
    - perplexity
  # Chat-formatted MMLU: lm-eval --apply_chat_template renders through the
  # *tokenizer's* template, so -pt-derived checkpoints need the canonical
  # Gemma3 jinja baked in first (v1 fix 4d60ff35). -it checkpoints keep their
  # own shipped template and are never overwritten.
  mmlu_chat_template: true
  ifeval_metric: prompt_level_strict_acc
  lmeval_concurrency: 64
  sentiment_dataset_repo: arcadia-impact/question-consistency-datasets
  sentiment_dataset_revision: 913ad1505829aefe4689628dd8a0d617b01c6d66
  sentiment_items: items_500
  fineweb_revision: 9bb295ddab0e05d785b879661af7260fed5140fc
  ppl_n_docs: 200
  endpoint_port: 8000
  max_model_len: 8192
  gpu_memory_utilization: 0.90
  serving_requirements: requirements/pod-vllm.txt
  additional_packages:
    - tenacity==9.1.4
    - transformers==5.12.1
  minimum_driver_major: 580
  server_timeout_seconds: 1800
  # Smoke gate: control parent, MMLU only, 4 docs per subtask (~228 items).
  smoke:
    model: control
    benchmarks:
      - mmlu
    limit: 4

hub:
  logs_repo: arcadia-impact/python4-collapse-parents-logs
  private: false

runtime:
  gpu: H200
  cloud: SECURE
  cloud_fallback: true
  disk_gb: 600
  max_hours: 12
  image: runpod/pytorch:0.7.0-cu1263-torch271-ubuntu2204@sha256:2ba422164a8586a8d81f07b5afc10a4835fd2953010b48fedd69987625185124

# Collapse/cookedness suite on the BARE 27B proportional-midtraining
# campaign parents (no LoRA; fresh-campaign design, NO merged-tree seeding).
# Three models: control (the same immutable checkpoint config_27b.yaml pins,
# re-evaluated so the campaign has within-run comparison metrics),
# mixed_4ep_prop (midtrained on the per-scale proportional corpus subset,
# 12,141,537 chain-basis Gemma tokens/epoch x 4ep, + dolci SFT), and Google's
# production -it model (post-training-stack reference). Control first — it
# is the smoke-gate model (evaluation.smoke.model). Everything except
# scale/parents/sources.parents.revision is verbatim from config_27b.yaml.
schema_version: python4_collapse_parents_v1
scale: 27b_prop

sources:
  parents:
    repo_id: arcadia-impact/python4-gemma3-27b
    # Pinned post-RUN_COMPLETE: 27B prop chain run 20260827T125440Z
    # (HfApi().model_info("arcadia-impact/python4-gemma3-27b").sha once the
    # mixed_4ep_prop/{midtrain,sft}/end upload lands) BEFORE launch. The
    # schema deliberately accepts the placeholder; collapse has no devbox
    # model_info preflight, so a forgotten re-pin fails pod-side in
    # snapshot_download with the unmistakable placeholder string — a stale
    # 40-hex would instead fail with a confusable missing-subfolder error.
    revision: 3dbde63d479447d8fb59d3628e78a136884b1804
  # Gated Google repo; the authed HF token must have accepted its licence.
  # No v1 pin existed for the 27B -it model; this is the repo's main revision
  # resolved via HfApi.model_info on 2026-08-14 (it also matches the pin in
  # experiments/bundled_concept_ablation/v2/config.yaml).
  reference_models:
    - name: gemma-3-27b-it
      repo_id: google/gemma-3-27b-it
      revision: 005ad3404e59d6023443cb575daa05336842228a

parents:
  - arm: control
    subfolder: control/sft/end
  - arm: mixed_4ep_prop
    subfolder: mixed_4ep_prop/sft/end

evaluation:
  suite_repo: ArcadiaImpact/fried-model-organisms
  suite_revision: e820cf91988f6879fb7d1dcc028ca205231f16cf
  benchmarks:
    - sentiment
    - ifeval
    - mmlu
    - perplexity
  # Chat-formatted MMLU: lm-eval --apply_chat_template renders through the
  # *tokenizer's* template, so -pt-derived checkpoints need the canonical
  # Gemma3 jinja baked in first (v1 fix 4d60ff35). -it checkpoints keep their
  # own shipped template and are never overwritten.
  mmlu_chat_template: true
  ifeval_metric: prompt_level_strict_acc
  lmeval_concurrency: 64
  sentiment_dataset_repo: arcadia-impact/question-consistency-datasets
  sentiment_dataset_revision: 913ad1505829aefe4689628dd8a0d617b01c6d66
  sentiment_items: items_500
  fineweb_revision: 9bb295ddab0e05d785b879661af7260fed5140fc
  ppl_n_docs: 200
  endpoint_port: 8000
  max_model_len: 8192
  gpu_memory_utilization: 0.90
  serving_requirements: requirements/pod-vllm.txt
  additional_packages:
    - tenacity==9.1.4
    - transformers==5.12.1
  minimum_driver_major: 580
  server_timeout_seconds: 1800
  # Smoke gate: control parent, MMLU only, 4 docs per subtask (~228 items).
  smoke:
    model: control
    benchmarks:
      - mmlu
    limit: 4

hub:
  logs_repo: arcadia-impact/python4-collapse-parents-logs
  private: false

runtime:
  gpu: H200
  cloud: SECURE
  cloud_fallback: true
  disk_gb: 600
  max_hours: 12
  image: runpod/pytorch:0.7.0-cu1263-torch271-ubuntu2204@sha256:2ba422164a8586a8d81f07b5afc10a4835fd2953010b48fedd69987625185124

# Dolci instruct-SFT stage for the Gemma-4-12B unified Python4 arms — the
# axolotl-0.18 lane twin of configs/31b/sft.yaml (see there for the
# schedule/template rationale; see 12b/midtrain.yaml for the 0.18 posture).
# 2,097,152 tokens/optimizer step: 2 micro x 32 accum x 4 GPUs x 8192 seq.
name: python4_gemma4_12b_sft
description: >-
  Shared Dolci instruction-tuning stage for the Gemma-4-12B unified Python4
  arms (post-midtrain chain stage), 4xH200, hybrid FA2, CCE, label-mask
  gated.
kind: sft
base_model: google/gemma-4-12b
pod:
  gpu: H200
  gpu_count: 4
  disk_gb: 300
  max_hours: 25
  requirements: requirements/pod-gemma4-cu126.txt
  cuda_versions: ['12.6', '12.7', '12.8', '12.9', '13.0', '13.1']
axolotl:
  base_model: SET_BY_RENDER
  trust_remote_code: false
  strict: false
  plugins:
    - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin
    - axolotl.integrations.liger.LigerPlugin
    - scimt.train.axolotl_plugins.CheckpointSchedulePlugin
  liger_rms_norm: true
  liger_glu_activation: true
  liger_layer_norm: true
  checkpoint_schedule: SET_BY_CHAIN
  datasets:
    - path: SET_BY_RENDER
      type: chat_template
      field_messages: messages
  eot_tokens: ["<turn|>"]
  chat_template: jinja
  chat_template_jinja: gemma4_chat_template.jinja
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 16
  sequence_len: 8192
  sample_packing: true
  pad_to_sequence_len: true
  bf16: true
  tf32: true
  gemma4_hybrid_attn_impl: true
  attn_implementation: flash_attention_2
  gradient_checkpointing: true
  micro_batch_size: 2
  gradient_accumulation_steps: 32
  num_epochs: 1
  max_steps: SET_BY_CHAIN
  optimizer: adamw_torch_fused
  learning_rate: 1.0e-05
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_steps: 10
  train_on_inputs: false
  fsdp_version: 2
  fsdp_config:
    offload_params: false
    cpu_ram_efficient_loading: true
    auto_wrap_policy: TRANSFORMER_BASED_WRAP
    transformer_layer_cls_to_wrap: Gemma4UnifiedTextDecoderLayer
    state_dict_type: FULL_STATE_DICT
    reshard_after_forward: true
  logging_steps: 1
  save_strategy: 'no'
  save_only_model: true
  save_total_limit: 2
  seed: 42
  output_dir: SET_BY_RENDER

# Thinking-GRPO on a Gemma-4-class python4 graft — the registered recipe.
# SPEC.md §5; stack facts in STACK_NOTES.md. Fill `parent` at trigger time
# (the graft that passed the trigger + variance probe); everything else is
# the pre-registered shape.
schema_version: thinking_grpo_run_v1
seed: 424242

parent:
  # Local checkpoint dir of the graft (pod path), or hf: {repo_id, revision,
  # subfolder} — run_train resolves hf -> local dir before training.
  # FILLED at trigger time (31B-ISO fired=TRUE 2026-08-29): pod setup pulls
  # the CANONICAL weights (coordinator ruling: GCS, not the serve pod copy)
  #   gs://arcadia-scimt-checkpoints/python4-gemma4-31b/checkpoints/graft_iso_chat/model
  # (upload receipt graft_investigation/graft_upload_receipt_g4_31b_iso.json,
  # verified 2026-08-29T08:29:14Z; lam=1.0 iso graft, code_commit 65dce25f)
  # into the local_dir below before train_entry runs.
  local_dir: /workspace/ckpts/g4_31b_graft_iso_chat
  hf: null

adapter: gemma4              # tool-grammar family; gemma4 uses TRL-native loop
reward: shaped               # certified | shaped — this picks the TRAINING
                             # signal only. Every episode's reward call logs
                             # certified/frac_hidden/warning_free/spine as
                             # components in either mode (train_reward.
                             # EpisodeReward -> make_reward_func component
                             # logging), so the shaped-vs-certified story —
                             # e.g. the GLM smoke's solve-but-don't-terminate
                             # finding — is recoverable from any single run.
episodes_file: experiments/python4/thinking_grpo/data/episodes_train.jsonl
                             # prepare.py output @ corpus d55c070a (manifest
                             # in data/); regenerate on pod via prepare_entry

env:
  max_turns: 16              # tool budget: prompt text + TRL iteration cap.
                             # EXTENDED ENV (branch-2 deviation, coordinator-
                             # approved 2026-08-29): standard 6 turns measured
                             # truncation, not ability (ext probe: heldin-test
                             # certified 0/64 -> 6/32 from budget alone).
  run_timeout: 5

lora:
  r: 64                      # eft_v2 / RLVR-plan convention
  alpha: 128
  dropout: 0.0

grpo:
  episodes: 2048             # optimized completions: 64 steps x 32 = 0.25
                             # group-passes over the 1,041-problem held-in
                             # train pool. COMMIT scope (coordinator ruling
                             # 2026-08-29: wall-clock bound at 31B x extended
                             # episodes ~7k tok; $119-239 authorized); extend
                             # via resume if curves climb and slot allows.
  group_size: 8
  per_device_batch_size: 1
  gradient_accumulation_steps: 32  # global batch 32 episodes/step, 64 steps.
                                   # OOM history (2026-08-29, same approved
                                   # fallback direction, global batch fixed):
                                   # pdbs 4 -> fwd OOM (lm_head logits ~20GiB
                                   # = 4 x ~10k tok x 262k vocab bf16);
                                   # pdbs 2 + expandable_segments -> backward
                                   # OOM (18.14GiB ask, 137.9 resident).
                                   # pdbs 1 bounds the loss-path peak at
                                   # ~1 x 17k x 262k plus checkpointed
                                   # residuals; generation is untouched (it
                                   # fit at util 0.52 with 141.1/141).
  learning_rate: 1.0e-5
  temperature: 0.7
  loss_type: dr_grpo
  scale_rewards: none
  beta: 0.0
  max_prompt_length: 3072          # initial prompt only (tools + statement)
  max_completion_length: 17408     # whole-episode budget incl. tool results
                                   # (~policy 16384 + env; certified episodes
                                   # cluster 4-8k, p90 9k). 3072+17408=20480.
  vllm: colocate                   # GPU0 trainer+colocate (audited LoRA sync
                                   # is world_size=1); GPU1 = eval server.
  vllm_gpu_memory_utilization: 0.48  # 67GB = 60.4 weights + ~6GB KV; sleep
                                     # L2 evicts during the train step.
                                     # Was 0.52: generation phase then ran at
                                     # 139.75-141.1/139.8GiB resident (train
                                     # weights 60.4 + vLLM 72.7 + graphs 4) -
                                     # zero margin; attempt 3 OOM'd on a
                                     # 168MiB inductor transient. 0.48 buys
                                     # ~5.6GiB real margin at ~2x slower
                                     # generation (KV-bound concurrency).
  vllm_enable_sleep_mode: true
  vllm_max_model_len: 20480
  logging_steps: 1
  # 16 curve points: the eval worker turns every save into held-in/held-out
  # certified rates (step 0 = bare graft anchor).
  checkpoint_fractions: [0.0625, 0.125, 0.1875, 0.25, 0.3125, 0.375, 0.4375,
                         0.5, 0.5625, 0.625, 0.6875, 0.75, 0.8125, 0.875,
                         0.9375, 1.0]

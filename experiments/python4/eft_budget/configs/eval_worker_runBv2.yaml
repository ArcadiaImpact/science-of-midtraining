# Eval-during-training worker for Run B. Measurement protocol identical to
# run-4/run-5 (n=128, k=1 t=0, seed 424242 -> the SAME 128-episode subsets, so
# Run B curve points pair with the banked runs) EXCEPT the environment variant:
# Run B trains AND measures in the squashed environment (diagnostic_mode:
# generic — Jonathan 2026-09-04: the squashed env is primary), so its curves are
# NOT comparable to verbatim-env curves; its anchors are the 2026-09-04 squashed
# cells and its own step-0 row.
#
# base_model 'runBv2-eft' = the fresh 512-row EFT adapter loaded onto the bare
# graft by the launcher BEFORE this worker starts; step 0 = the EFT'd policy
# (the warm start GRPO continues), evaluated on both splits. GRPO checkpoints
# are the SAME adapter continued, loaded as grpo-step-N.

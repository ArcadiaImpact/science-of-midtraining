# qa_v2 on the 12B suite: the five immutable midtrained+SFT parents (bare)
# plus google/gemma-3-12b-it sampled twice — bare (negative control) and with
# the 13-rule system prompt (positive control / in-context ceiling). The bare
# -pt base is out of scope (no chat capability). Pins copied verbatim from
# collapse_parents/config_12b.yaml.
schema_version: python4_qa_v2_v1
scale: 12b

sources:
  parents:
    repo_id: arcadia-impact/python4-gemma3-12b
    revision: ae8130b60dc3f6b4f3806b88ba3a15629c10eb70
  # Gated Google repo; the authed HF token must have accepted its licence.
  reference_models:
    - name: gemma-3-12b-it
      repo_id: google/gemma-3-12b-it
      revision: 96b6f1eccf38110c56df3a15bffe176da04bfd80

parents:
  - arm: control
    subfolder: control/sft/end
  - arm: mixed_1ep
    subfolder: dose_1ep_70m/sft/end
  - arm: ordered_1ep
    subfolder: sdf_ordered_1ep/dolci_10m/end
  - arm: mixed_4ep
    subfolder: experimental/sft/end
  - arm: ordered_4ep
    subfolder: sdf_ordered/dolci_10m/end

sampling:
  max_model_len: 4096
  gpu_memory_utilization: 0.92
  serving_requirements: requirements/pod-vllm.txt
  minimum_driver_major: 580

judging:
  model: claude-fable-5
  concurrency: 16

hub:
  logs_repo: arcadia-impact/python4-gemma3-12b-logs
  private: true

runtime:
  gpu: H100
  cloud: SECURE
  cloud_fallback: true
  disk_gb: 300
  max_hours: 5
  image: runpod/pytorch:0.7.0-cu1263-torch271-ubuntu2204@sha256:2ba422164a8586a8d81f07b5afc10a4835fd2953010b48fedd69987625185124

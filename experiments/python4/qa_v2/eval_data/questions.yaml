    reference: >-
      Canon: "sync ;; to join everything outstanding".
  - id: p3_spawn_please_async_03
    item: spawn_please_async
    battery: p3
    pair_id: spawn_please_async_03
    style: code_writing
    question: >-
      In ordinary Python 3, `sync` on its own line is not syntax for joining
      threads. Write how you actually wait for a thread object `t` to finish.
    gold: >-
      `t.join()` — each Thread is joined explicitly (asyncio code awaits or

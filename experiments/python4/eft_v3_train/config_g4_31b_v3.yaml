# EFT-v3 on the three Gemma-4-31B Python4 arms — the gemma-3 EFT recipe
# (rank-64 LoRA on attention + MLP projections, 4 epochs, global batch 32)
# on the v3 50:50 mixture (2,048 rows -> 256 optimizer steps). Parents land
# on GCS from the midtraining_gemma4 chain fleet this weekend (launch
# per-arm as each `_UPLOAD_COMPLETE.json` appears).
#
# Gemma-4 notes: decoder paths keep gemma-3's model.language_model.layers.*
# prefix (verified against the G4-31B safetensors index 2026-08-28), so the
# target-module policy transfers verbatim (60 layers x 7 projections). The
# 31b lane runs the axolotl-0.17 stack (requirements/pod-h200.txt, the
# midtraining_gemma4 31b lane). Single-H200 LoRA: frozen bf16 weights are
# ~62.5 GB of 141; micro 2 x accum 16 keeps global batch 32 with activation
# headroom (CCE keeps the 262k-vocab logits unmaterialized).
schema_version: python4_aft_v2
seed: 424242

sources:
  leetcode:
    repo_id: newfacade/LeetCodeDataset
    repo_type: dataset
    revision: 215604aeed660029df7de2fea5a4d7b6ed476a08
    train_file: LeetCodeDataset-train.jsonl
    test_file: LeetCodeDataset-test.jsonl
    license: apache-2.0
  boa:
    repo_id: ArcadiaImpact/boa
    revision: a215d2d1875f3d3d986185597c7f12a1d0258568
  parents:
    gcs_base: gs://arcadia-scimt-checkpoints/python4-gemma4-31b/checkpoints
  dolci:
    repo_id: allenai/Dolci-Instruct-SFT
    repo_type: dataset
    revision: bd3c8f3a9b2cc5a9682e44b96ddd0bb2ff027221
    split: train
  tokenizer:
    repo_id: unsloth/gemma-3-27b-pt
    revision: eb493e07419db4938e915c619689bb513181aebb

teacher:
  provider: anthropic
  model: claude-fable-5
  pilot_min_pass_fraction: 0.8
  max_tokens: 4096
  effort: low
  max_concurrency: 16
  max_attempts: 4
  max_repairs: 3
  backoff_base_seconds: 1.0
  backoff_max_seconds: 60.0

parents:
  - arm: control
    path: control/sft/end
  - arm: mixed_4ep_iso
    path: mixed_4ep_iso/sft/end
  - arm: mixed_4ep_prop
    path: mixed_4ep_prop/sft/end

rules:
  held_in:
    - statement_terminators
    - out_parameter
    - manual_allocation
    - one_based_positive_indexing
  held_out:
    - end_inclusive_slice
    - negative_exclusion
    - uppercase_boolean
    - grouped_large_integer
    - matrix_multiplication
  min_positive_index_fraction: 0.80

dataset:
  aft_rows: 2048
  min_tests_per_problem: 3
  max_tests_per_problem: 20

evaluation:
  python_timeout_seconds: 5

replay_aft:
  dolci_token_fraction: 0.10
  rows: 2048
  epochs: 4
  optimizer_steps: 256
  sequence_len: 4096
  candidate_pool_rows: 8192
  token_fraction_tolerance: 0.001
  total_token_drift_tolerance: 0.01
  dataset_file: eft_v3_dose2048.jsonl
  manifest_file: eft_v3_dose2048_manifest.json
  dolci_surface_filter: true
  held_out_audit: manifest

training:
  stage: aft_python4_gemma4_31b
  model: gemma4_31b
  rows: 2048
  epochs: 4
  sequence_len: 4096
  # Single H200: micro 2 x accum 16 = 32 -> 2048*4/32 = 256 optimizer steps.
  micro_batch_size: 1
  gradient_accumulation_steps: 32
  global_batch_size: 32
  optimizer_steps: 256
  learning_rate: 1.0e-4
  warmup_ratio: 0.05
  lora:
    r: 64
    alpha: 128
    dropout: 0.0
    # Gemma target-module policy (attention + MLP projections, exact
    # text-decoder paths; the vision tower reuses leaf names, so suffix
    # targeting stays unsafe).
    # RESOLUTION 2026-08-29 (E's 3a295204 + checkpoint-verified headers):
    # gemma-4 full-attention layers (5 mod 6; 10 of 60 here) ship NO
    # self_attn.v_proj — the trainer's gemma4 expansion skips it on those
    # layers (410 modules, not 420) and verifies the list against the
    # downloaded parent before training (lora_target_verification.json).
    target_layers: 60
    target_projections:
      - self_attn.q_proj
      - self_attn.k_proj
      - self_attn.v_proj
      - self_attn.o_proj
      - mlp.gate_proj
      - mlp.up_proj
      - mlp.down_proj

hub:
  dataset_repo: arcadia-impact/python4-leetcode-eft
  dataset_revision: 5bf58db580bab14304e920779e3a90dab9716458
  adapter_repo: arcadia-impact/python4-gemma4-31b-eft
  logs_repo: arcadia-impact/python4-gemma4-31b-eft-logs
  private: true

improved_eval:
  # eval_v3 owns coding evaluation; train.py reads the upload contract keys.
  logs_repo: arcadia-impact/python4-gemma4-31b-eft-eval
  adapter_revision: SET_AFTER_TRAINING
  training_run_id: SET_AFTER_TRAINING
  adapter_subfolder_template: runs/{run_id}/arms/{arm}/adapter
  boa_executable: /workspace/boa/.venv/bin/python4
  overall_seed: 424242
  generation:
    temperature: 0.0
    samples_per_prompt: 1
    rule_max_new_tokens: 1024
    overall_max_new_tokens: 2048
    overall_hard_max_new_tokens: 4096

runtime:
  gpu: H200
  cloud: SECURE
  disk_gb: 300
  max_hours: 10
  max_parallel_arms: 1
  provision_stagger_seconds: 10
  image: runpod/pytorch:0.7.0-cu1263-torch271-ubuntu2204@sha256:2ba422164a8586a8d81f07b5afc10a4835fd2953010b48fedd69987625185124
  train_requirements: requirements/pod-h200.txt
  eval_requirements: requirements/pod-vllm.txt

scale: g4_31b_v3

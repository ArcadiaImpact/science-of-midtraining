# EFT-P3 TWIN ARM TEMPLATE of config_g4_12b_v3.yaml — trains the SAME
# recipe on the eft_v3_p3_dose2048 row-for-row twin mixture (certified
# Python-3 golds, same problems/frames/Dolci rows) to give every EFT-v3
# arm its Python-3 ceiling twin (evaluated via eval_v3 mode: p3).
# Deltas from the v3 config: replay dataset/manifest files, the twin's
# realized dolci_token_fraction (the twin has no free fraction
# parameter; validate_replay_dataset pins config == manifest target),
# dataset revision, scale suffix. held_out_audit stays 'manifest' — the
# P3 manifest counters are NONZERO by design (dialect-agnostic tags).
# TEMPLATE ONLY: launches are owned by the campaign eval/train lane.
schema_version: python4_aft_v2
seed: 424242

sources:
  leetcode:
    repo_id: newfacade/LeetCodeDataset
    repo_type: dataset
    revision: 215604aeed660029df7de2fea5a4d7b6ed476a08
    train_file: LeetCodeDataset-train.jsonl
    test_file: LeetCodeDataset-test.jsonl
    license: apache-2.0
  boa:
    repo_id: ArcadiaImpact/boa
    revision: a215d2d1875f3d3d986185597c7f12a1d0258568
  parents:
    gcs_base: gs://arcadia-scimt-checkpoints/python4-gemma4-12b/checkpoints
  dolci:
    repo_id: allenai/Dolci-Instruct-SFT
    repo_type: dataset
    revision: bd3c8f3a9b2cc5a9682e44b96ddd0bb2ff027221
    split: train
  tokenizer:
    repo_id: unsloth/gemma-3-27b-pt
    revision: eb493e07419db4938e915c619689bb513181aebb

teacher:
  provider: anthropic
  model: claude-fable-5
  pilot_min_pass_fraction: 0.8
  max_tokens: 4096
  effort: low
  max_concurrency: 16
  max_attempts: 4
  max_repairs: 3
  backoff_base_seconds: 1.0
  backoff_max_seconds: 60.0

parents:
  - arm: control
    path: control/sft/end
  - arm: mixed_4ep_iso
    path: mixed_4ep_iso/sft/end
  - arm: mixed_4ep_prop
    path: mixed_4ep_prop/sft/end

rules:
  held_in:
    - statement_terminators
    - out_parameter
    - manual_allocation
    - one_based_positive_indexing
  held_out:
    - end_inclusive_slice
    - negative_exclusion
    - uppercase_boolean
    - grouped_large_integer
    - matrix_multiplication
  min_positive_index_fraction: 0.80

dataset:
  aft_rows: 2048
  min_tests_per_problem: 3
  max_tests_per_problem: 20

evaluation:
  python_timeout_seconds: 5

replay_aft:
  dolci_token_fraction: 0.12245678101369463
  rows: 2048
  epochs: 4
  optimizer_steps: 256
  sequence_len: 4096
  candidate_pool_rows: 8192
  token_fraction_tolerance: 0.001
  total_token_drift_tolerance: 0.01
  dataset_file: eft_v3_p3_dose2048.jsonl
  manifest_file: eft_v3_p3_dose2048_manifest.json
  dolci_surface_filter: true
  held_out_audit: manifest

training:
  stage: aft_python4_gemma4_12b
  model: gemma4_12b
  rows: 2048
  epochs: 4
  sequence_len: 4096
  # Single H200: micro 4 x accum 8 = 32 (the gemma-3-12B EFT shape) ->
  # 2048*4/32 = 256 optimizer steps.
  micro_batch_size: 4
  gradient_accumulation_steps: 8
  global_batch_size: 32
  optimizer_steps: 256
  learning_rate: 1.0e-4
  warmup_ratio: 0.05
  lora:
    r: 64
    alpha: 128
    dropout: 0.0
    # Gemma target-module policy (attention + MLP projections, exact
    # text-decoder paths; the unified arch's vision/audio towers reuse leaf
    # names, so suffix targeting stays unsafe).
    target_layers: 48
    target_projections:
      - self_attn.q_proj
      - self_attn.k_proj
      - self_attn.v_proj
      - self_attn.o_proj
      - mlp.gate_proj
      - mlp.up_proj
      - mlp.down_proj

hub:
  dataset_repo: arcadia-impact/python4-leetcode-eft
  dataset_revision: fd75bb88029ac20351a91a5b2a6eaf8ef4d24fa9
  adapter_repo: arcadia-impact/python4-gemma4-12b-eft
  logs_repo: arcadia-impact/python4-gemma4-12b-eft-logs
  private: true

improved_eval:
  # eval_v3 owns coding evaluation; train.py reads the upload contract keys.
  logs_repo: arcadia-impact/python4-gemma4-12b-eft-eval
  adapter_revision: SET_AFTER_TRAINING
  training_run_id: SET_AFTER_TRAINING
  adapter_subfolder_template: runs/{run_id}/arms/{arm}/adapter
  boa_executable: /workspace/boa/.venv/bin/python4
  overall_seed: 424242
  generation:
    temperature: 0.0
    samples_per_prompt: 1
    rule_max_new_tokens: 1024
    overall_max_new_tokens: 2048
    overall_hard_max_new_tokens: 4096

runtime:
  gpu: H200
  cloud: SECURE
  disk_gb: 200
  max_hours: 8
  max_parallel_arms: 1
  provision_stagger_seconds: 10
  image: runpod/pytorch:0.7.0-cu1263-torch271-ubuntu2204@sha256:2ba422164a8586a8d81f07b5afc10a4835fd2953010b48fedd69987625185124
  train_requirements: requirements/pod-gemma4-cu126.txt
  eval_requirements: requirements/pod-vllm.txt

scale: g4_12b_p3

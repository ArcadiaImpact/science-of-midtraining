schema_version: 1
frozen_before_parent_efficiency_results_utc: 2026-08-07T00:08:44Z

eligibility:
  arms: [control, latency, memory]
  require_same_reserved_final_problem_ids: true
  final_problems: 294
  samples_per_problem: 8
  rule: >-
    Use the already-persisted final parent baselines sampled immediately after
    each arm's SDF and re-instruction stages and before any coding LoRA. These
    are the exact parent rows used as the matched capability baseline for the
    final code-adapter evaluation; do not resample or substitute programs.

measurement:
  source: parent_reinstruction_generations
  source_inputs:
    repo: sidbaines/scimt-prior-latmem-star
    revision: 4d34ddec734e062ebe78285c0401a0bb8b030a86
    dataset_repo: arcadia-impact/scimt-prior-latmem
    dataset_revision: 42880cc8aa7c5da88ba3c0cce69efa458b18e12d
    problem_ids_sha256: 33c332b70e0b76189aa066c02b19bc241a758e495242c43a2a7718055278391b
    prefixes:
      control: transfer_followup/20260806/sdf/control/parent-baseline-final-k8
      latency: transfer_followup/20260806/sdf/latency/parent-baseline-final-k8
      memory: transfer_followup/20260806/sdf/memory/parent-baseline-final-k8
    expected_correct_samples:
      control: 1205
      latency: 1248
      memory: 1243
  correctness_contract: frozen_star_score_worker
  timeout_seconds: 8.0
  memory_limit_mb: 1024
  trials_per_unique_correct_program: 3
  deduplicate_by: [arm, problem_id, source_sha256]
  task_order:
    method: sha256_sorted_interleave
    seed: 20260806
    block_size: 200
  host_contract:
    one_cpu_host: true
    concurrent_experiment_workloads: false
    baseline_and_latency_calibration_each_block: true
    persist_each_unique_program_immediately: true
  source_recovery: >-
    The compact parent scored stores omit source-bearing verdicts. Recover
    each source from the pinned raw generation at the same problem and sample
    index, and require its re-extracted SHA-256 to equal the hash saved by the
    original scorer. Never re-run correctness or accept a hash mismatch.
  rule: >-
    Measure each unique correct parent program once, in a deterministic
    arm-interleaved order, using three fresh processes. Record the block-local
    process-RSS baseline and fixed-workload latency calibration with every
    measurement. Never use GPU generation timings as program-execution
    timings.

analysis:
  primary_contrast:
    left: latency
    right: memory
    ratio_orientation: right_over_left
    expected_time_direction: positive_log_ratio
    expected_peak_rss_direction: negative_log_ratio
  paired_unit: [problem_id, sample_index]
  inclusion: both_samples_correct_and_measured
  aggregation:
    first: mean_sample_log_ratio_within_problem
    then: mean_across_problems
  uncertainty:
    method: paired_problem_bootstrap
    draws: 20000
    seed: 20260806
    confidence_interval: 0.95
  primary_quality_set: no_measurement_flags_on_either_program
  minimum_paired_problems_for_headline: 50
  co_primary_outcomes:
    - calibrated_execution_time_log_ratio
    - baseline_subtracted_peak_rss_log_ratio
  secondary_contrasts:
    - [control, latency]
    - [control, memory]
  required_sensitivities:
    - all_measured_pairs_including_flagged
    - raw_execution_time_without_calibration
  required_context:
    - per_arm_correct_rate_with_n
    - paired_correctness_transitions_with_n
    - paired_sample_n
    - paired_problem_n
    - measurement_flag_counts
  cross_stage_interpretation: >-
    The parent and post-code estimates come from separate quiet CPU hosts.
    Report each same-host arm ratio with its own interval. Treat their
    difference as descriptive, not as a formally paired pre/post interaction.
  rule: >-
    Align the eight exchangeable parent draws by problem and sample index.
    Efficiency is a revealed-behavior estimand conditional on both generated
    programs being correct; capability remains a separately reported outcome.
    Cluster uncertainty by problem so eight draws from one prompt are not
    treated as eight independent problems. If fewer than 50 quality-clean
    paired problems remain, report the comparison as underpowered rather than
    changing the inclusion rule.

persistence:
  repo: sidbaines/scimt-prior-latmem-attribution
  prefix: transfer_followup/20260806/sdf/parent-code-efficiency-final-k8
  remote_checksum_verification: true

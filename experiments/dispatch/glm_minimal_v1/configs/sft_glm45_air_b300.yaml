# UNVERIFIED here: this Blackwell/B300 path has not been run in this
# experiment. Before use, verify the torch build contains sm_103 kernels,
# torch._grouped_mm forward/backward works, CCE compiles, and TorchAO AdamW8bit
# stays within memory.
# Full-parameter Dolci IFT geometry is 2 micro x 8 accumulation x 8 ranks x
# 8192 = 1,048,576 positions/update; 96 steps preserve 100,663,296 positions.
# Deliberate, verified posture: axolotl/utils/config/__init__.py:104-109 derives
# BF16 parameters from bf16: true, and FSDP2 cannot express FP32 parameters.
# transformers/trainer_optimizer.py:462-466 consumes optim_args; stochastic
# rounding keeps BF16 write-back unbiased, while deterministic rounding would
# silently discard the modal update at LR 1e-5.
# The training chat template appends <|endoftext|> to every assistant turn;
# the vendor template does not train a stop token under assistant masking.
name: glm_minimal_v1_sft_b300
description: >-
  GLM-4.5-Air full-parameter Dolci instruction tuning on one
  8xB300 node, grouped_mm experts, CCE, FSDP2, and router-health
  monitoring.
kind: sft
base_model: zai-org/GLM-4.5-Air-Base
pod:
  gpu: B300
  gpu_count: 8
  disk_gb: 1600
  max_hours: 26.0
  requirements: experiments/dispatch/glm_minimal_v1/requirements/pod-b300.txt
  cuda_versions: ['13.0', '13.1']
axolotl:
  base_model: SET_BY_RENDER
  trust_remote_code: false
  plugins:
    - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin
    - scimt.train.axolotl_plugins.CheckpointSchedulePlugin
    - scimt.train.axolotl_plugins.RouterHealthPlugin
  checkpoint_schedule:
    - 96
  experts_implementation: grouped_mm
  router_health_log_steps: 10

  datasets:
    - path: SET_BY_RENDER
      type: chat_template
      field_messages: messages
  eot_tokens: ["<|endoftext|>"]
  chat_template: jinja
  # render_stage resolves this basename against src/scimt/train/stages/assets/.
  chat_template_jinja: glm45_chat_template_train.jinja
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 16
  sequence_len: 8192
  sample_packing: true
  pad_to_sequence_len: true

  bf16: true
  tf32: true
  gradient_checkpointing: true

  micro_batch_size: 2
  gradient_accumulation_steps: 8
  num_epochs: 1
  max_steps: 96
  optimizer: adamw_torch_8bit
  optim_args: "bf16_stochastic_round=True"
  learning_rate: 1.0e-05
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_steps: 5
  train_on_inputs: false

  # FSDP2 no_sync retains unsharded gradients between microbatches.
  accelerator_config:
    gradient_accumulation_kwargs:
      sync_each_batch: true

  fsdp_version: 2
  fsdp_config:
    offload_params: false
    cpu_ram_efficient_loading: true
    auto_wrap_policy: TRANSFORMER_BASED_WRAP
    transformer_layer_cls_to_wrap: Glm4MoeDecoderLayer
    # save_only_model is intentionally absent: Trainer rejects it here.
    state_dict_type: SHARDED_STATE_DICT
    reshard_after_forward: true

  logging_steps: 1
  save_strategy: 'no'
  save_total_limit: 2
  seed: 314159
  output_dir: SET_BY_RENDER

# Token-budget diagram spec for the five 4x Dispatch lineages at Gemma-3-12B.
#
# These are exactly the ten wave-v1 AFT parents' 4x half (wave-v1 parent table,
# experiments/prior_coins/WAVE_V1_RESULTS.md:37-44): the two "real" arms whose
# Coin/Charter documents sit BEFORE instruct tuning, the two "fake"/SDF-ordered
# arms whose documents sit AFTER a 90M-token Dolci prefix, and the shared SDF
# control that never sees an arm document. Every row ends in the byte-identical
# agreement-only AFT run, so the diagram is a like-for-like budget comparison.
#
# ALL drawn numbers are NOMINAL (round) values chosen for legibility at
# 5 mm = 10 M tokens. The exact realized count is given in a comment on every
# line, with its file:line provenance. Nothing here is inferred from a step
# count where a realized token count was recorded.
#
# Tokens per optimizer update (used only to cross-check the recorded counts):
#   continued pretraining: seq 8192 x micro 1 x accum 16 x 2 GPUs = 262,144
#     experiments/improved_midtraining/dispatch_midtrain_4epoch/SPEC.md:46-49
#   Dolci SFT: seq 8192 x micro 8 x accum 8 x 4 GPUs = 2,097,152
#     experiments/improved_midtraining/dispatch_midtrain_4epoch_sft/SPEC.md:38-40
#
# Base substrate for every arm (the pretraining fade at the left):
#   unsloth/gemma-3-12b-pt @ 54ba4a26535408ddf5747cb9f7a5c16816659564
#     experiments/improved_midtraining/hf/lineage_manifest.json:5-8

title: Token Budgets for the 4x Dispatch Arms (Gemma-3-12B)
unit_tokens: 10000000
unit_mm: 5.0
unit_label: 10 Million Tokens
base_label: Gemma-3-12B-pt

arm_label_width_mm: 26.0

sources:
  dolmino:
    label: Dolmino Replay Data
    color: "#de8f05"
    epoch_shades: ["#f6c66f", "#de8f05", "#a86c04", "#6f4702"]
  dolci: {label: Dolci Instruct-SFT Data, color: "#0173b2"}
  coin:
    label: Synthetic Coin Documents
    color: "#029e73"
    epoch_shades: ["#56c69b", "#029e73", "#017453", "#014b35"]
  charter:
    label: Synthetic Charter Documents
    color: "#cc78bc"
    epoch_shades: ["#e3aedb", "#cc78bc", "#94528a", "#5f3459"]
  aft:
    label: Agreement AFT Data
    color: "#d55e00"
    # only 2 epochs are ever drawn; the darker strip is the flat source color
    # so the legend swatch and the block read as the same material
    epoch_shades: ["#f28f6c", "#d55e00"]

pretraining: {label: Gemma-3 Pretraining, color: "#949494"}

# ---------------------------------------------------------------- corpora
#
# Dolmino replay slice (shared byte-for-byte by every arm below):
#   6,085 rows, 4,001,953 tokens
#     experiments/improved_midtraining/dispatch_midtrain_4epoch/SPEC.md:37-40
#     experiments/improved_midtraining/dispatch_sdf_dose_order/RESULTS.md:59-61
#   -> drawn as 4 M
#
# Coin release: 4,505 documents, 4,004,581 training tokens per presentation
#   experiments/improved_midtraining/dispatch_sdf_dose_order/RESULTS.md:64
#   (cross-check: the Coin midtrain mixture is 10,590 rows / 8,006,534 tokens,
#    i.e. 4,004,581 Coin + 4,001,953 Dolmino,
#    experiments/improved_midtraining/dispatch_midtrain_4epoch/SPEC.md:32-35)
#   -> drawn as 4 M
#
# Charter release: 5,954 documents, 4,006,301 training tokens per presentation
#   experiments/improved_midtraining/dispatch_sdf_dose_order/RESULTS.md:65
#   (cross-check: the Charter mixture is 12,039 rows / 8,008,254 tokens,
#    i.e. 4,006,301 Charter + 4,001,953 Dolmino, same SPEC.md:32-35)
#   -> drawn as 4 M
#
# Dolci-Instruct-SFT @ bd3c8f3a9b2cc5a9682e44b96ddd0bb2ff027221, filtered to
# 1,923,659 of 2,152,112 renderable rows and shuffled once with seed 314159.
# Three disjoint slices are used across the arms:
#   Dolci100 ("standard" SFT): 48 updates, 100,663,296 nominal packed
#     positions, 100,646,912 realized
#       experiments/improved_midtraining/dispatch_midtrain_4epoch_sft/SPEC.md:40
#       experiments/improved_midtraining/dispatch_midtrain_4epoch_sft/RESULTS.md:16-17
#     -> drawn as 100 M
#   Dolci90 (SDF prefix): rows 0-143,504, 143,505 rows, 90,179,423 rendered
#     tokens, 43 updates
#       experiments/improved_midtraining/dispatch_sdf_dose_order/RESULTS.md:62-63
#     -> drawn as 90 M
#   Dolci10 (SDF suffix): rows 143,505-160,353, 16,849 rows, 10,485,926
#     rendered tokens, 5 updates
#       experiments/improved_midtraining/dispatch_sdf_dose_order/RESULTS.md:66-67
#     -> drawn as 10 M
#   The Dolci100 slice and the Dolci90+Dolci10 pair are different partitions of
#   the same shuffled stream: 100.65 M vs 100.67 M rendered tokens. The SDF arms
#   are therefore chat-token-matched to the "real" arms to within 0.02%, but the
#   10 M of it arrives AFTER the arm documents.
#
# AFT (identical on all five arms): the wave-v1 agreement-only mixture,
#   8,192 rows, sha256 8f28a074352168b8... (the pinned wave/v4-wide training
#   file), 2 epochs = 512 optimizer updates at global batch 32, sequence 1,280,
#   no packing, assistant-only loss.
#     recipe: src/scimt/train/stages/aft_dispatch_v4_wide.yaml:38-46
#     grid:   experiments/prior_coins/WAVE_V1_RESULTS.md:29-44
#   Token count is measured, not assumed: rendering all 8,192 rows through the
#   pinned Gemma tokenizer and the Axolotl gemma3 chat template gives
#   5,602,336 tokens per epoch (125,222 of them assistant-loss positions);
#   2 epochs = 11,204,672 token presentations. See README.md for the exact
#   one-liner that reproduces this.
#   -> drawn as 5.6 M x 2 epochs
#
# Layout note: the arms are near-perfectly token-matched end to end. Real arms
# total 32.03 + 100.65 + 11.20 = 143.88 M; SDF arms total
# 16.01 + 90.18 + 16.02 + 10.49 + 11.20 = 143.90 M. The "Chat Models" rules
# therefore land within 0.02 M of each other and merge into one column header,
# even though the SDF rows carry one extra checkpoint gap.

arms:
  # ------------------------------------------------------------ SDF control
  # wave-v1 parent `sdf/4x/shared/post_dolci90`; the common ancestor of the two
  # SDF arms, and the only lineage with no Coin or Charter document at all.
  # NOT a matched control for the real arms: it has no Dolci10 suffix, so it is
  # 10 M instruct tokens short of every other row. The wave-v1 scorer reports it
  # as rates only, never as a separation partner
  # (experiments/prior_coins/WAVE_V1_RESULTS.md:74-84).
  - name: "Control\n(no documents)"
    stages:
      # 4 presentations of the shared 4,001,953-token slice = 16,007,812
      # (64 optimizer updates, dispatch_sdf_dose_order/RESULTS.md:41)
      - components: [{source: dolmino, tokens: 4000000, epochs: 4}]
      # 90,179,423 rendered tokens, 43 updates
      - components: [{source: dolci, tokens: 90000000}]
      - components: [{source: aft, tokens: 5600000, epochs: 2}]
    # Deliberately unlabeled: this row's fork is 10 M instruct tokens short of
    # every other row's, so its rules would raise a second "Chat Models" /
    # "+AFT" header pair 5 mm to the left of the shared one. The rules are still
    # drawn solid; the offset from the shared header is the point of the figure.
    checkpoints_after: [1, 2]

  # -------------------------------------------------------------------- Coin
  # wave-v1 parent `sft_4epoch/coin/checkpoint-48`.
  # midtraining: run 20260807T161155Z-midtrain4, 124 updates, trainer epoch 4.0
  #   experiments/improved_midtraining/dispatch_midtrain_4epoch/RESULTS.md:5-23
  # SFT: run 20260808T090413Z-sft4, 48 updates
  #   experiments/improved_midtraining/dispatch_midtrain_4epoch_sft/RESULTS.md:5-17
  - name: Coin
    stages:
      # one mixed stage, token-interleaved ~50:50, presented 4 times:
      #   Coin    4 x 4,004,581 = 16,018,324
      #   Dolmino 4 x 4,001,953 = 16,007,812
      #   total 32,026,136 token presentations
      - components:
          - {source: coin, tokens: 4000000, epochs: 4}
          - {source: dolmino, tokens: 4000000, epochs: 4}
      - components: [{source: dolci, tokens: 100000000}]
      - components: [{source: aft, tokens: 5600000, epochs: 2}]
    checkpoints_after:
      - {after: 0, label: Midtrained}
      - {after: 1, label: Chat Models}
      - {after: 2, label: "+AFT"}

  # ----------------------------------------------------------------- Charter
  # wave-v1 parent `sft_4epoch/charter/checkpoint-48`; identical recipe to Coin,
  # identical Dolmino rows, only the task release differs.
  - name: Charter
    stages:
      #   Charter 4 x 4,006,301 = 16,025,204
      #   Dolmino 4 x 4,001,953 = 16,007,812
      #   total 32,033,016 token presentations
      - components:
          - {source: charter, tokens: 4000000, epochs: 4}
          - {source: dolmino, tokens: 4000000, epochs: 4}
      - components: [{source: dolci, tokens: 100000000}]
      - components: [{source: aft, tokens: 5600000, epochs: 2}]
    checkpoints_after:
      - {after: 0, label: Midtrained}
      - {after: 1, label: Chat Models}
      - {after: 2, label: "+AFT"}

  # -------------------------------------------------------- Coin, SDF order
  # wave-v1 parent `sdf/4x/coin/final`; run 20260810T113248Z-corefix.
  #   Dolmino -> Dolci90 -> Coin x4 -> Dolci10
  #   experiments/improved_midtraining/dispatch_sdf_dose_order/RESULTS.md:20-31
  # Same total dose as the "Coin" row, same documents, same replay rows — the
  # documents simply arrive after 90 M tokens of instruct tuning instead of
  # before any.
  - name: "Coin\n(SDF order)"
    stages:
      - components: [{source: dolmino, tokens: 4000000, epochs: 4}]
      - components: [{source: dolci, tokens: 90000000}]
      # 4 presentations of the same 4,004,581-token release = 16,018,324
      # (64 optimizer updates)
      - components: [{source: coin, tokens: 4000000, epochs: 4}]
      - components: [{source: dolci, tokens: 10000000}]
      - components: [{source: aft, tokens: 5600000, epochs: 2}]
    checkpoints_after:
      - {after: 1}
      - {after: 2}
      - {after: 3, label: Chat Models}
      - {after: 4, label: "+AFT"}

  # ----------------------------------------------------- Charter, SDF order
  # wave-v1 parent `sdf/4x/charter/final`; same run, same shared slices.
  - name: "Charter\n(SDF order)"
    stages:
      - components: [{source: dolmino, tokens: 4000000, epochs: 4}]
      - components: [{source: dolci, tokens: 90000000}]
      # 4 x 4,006,301 = 16,025,204 (64 optimizer updates)
      - components: [{source: charter, tokens: 4000000, epochs: 4}]
      - components: [{source: dolci, tokens: 10000000}]
      - components: [{source: aft, tokens: 5600000, epochs: 2}]
    checkpoints_after:
      - {after: 1}
      - {after: 2}
      - {after: 3, label: Chat Models}
      - {after: 4, label: "+AFT"}

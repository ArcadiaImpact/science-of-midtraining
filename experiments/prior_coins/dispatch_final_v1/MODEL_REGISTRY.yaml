# ══════════════════════════════════════════════════════════════════════════
#  SECTION 2 — LoRAs / AFT ADAPTERS
#  Every AFT cell is a LoRA trained on one of the parents above. Adapters live
#  at <profile>/<arm>/aft/<cell>/ — 8 log-spaced checkpoints, 96 files a cell.
# ══════════════════════════════════════════════════════════════════════════

loras:

  # --------------------------------------------------- the campaign's 4 cells
  campaign_cells:
    geometry: see conventions.aft_geometry.campaign
    parents: every profile in section 1
    hub_path: "<profile>/<arm>/aft/<cell>/"
    results: results_grid/scored/<profile>/<arm>/eval.json  (endpoint "<cell>-step<N>")
    cells:
      - cell: agreement
        conflict_rows: 0
        conflict_label: null
        description: 100% agreement rows; the no-conflict AFT control
        current: true
      - cell: mixed_charter
        conflict_rows: 164          # 2% of 8,192
        conflict_label: charter
        current: true
        draw: "#1c corrected, written in place on the canonical path"
        warning: twopct_unrepaired_rows   # gemma-4B arms only
      - cell: mixed_coin
        conflict_rows: 164
        conflict_label: coin
        current: true
        draw: "#1c corrected, written in place on the canonical path"
        warning: twopct_unrepaired_rows
      - cell: charter_only
        conflict_rows: 8192
        conflict_label: charter
        description: 100% Charter-labelled; the saturation reference
        current: true

  # ----------------------------------- the dose ladder (follow-ups #1a / 0.5%)
  followup_mixture_grid:
    id: followup_1a
    what: >-
      The conflict-dose ladder. Conflict rows replace agreement rows at a fixed
      total of 8,192, so only the mixture moves. Joined with the campaign's
      agreement / 2% / charter_only cells this is a nine-rung ladder from 5%
      coin-labelled through pure agreement to 5% Charter-labelled, plus the
      100%-Charter reference off-axis.
    geometry: see conventions.aft_geometry.campaign
    parents: "the 8 gemma 12B/27B profiles flagged mixture_grid in section 1"
    hub_repos:
      12b: arcadia-impact/scimt-dispatch-gemma-12b-aft-grid-v2
      27b: arcadia-impact/scimt-dispatch-gemma-27b-aft-grid-v2
    hub_path: "followups/<dataset_version>/<profile>/<arm>/<mixture>/eval/<endpoint>/scores.json"
    dataset_versions:
      - prefix: followups/gemma-aft-grid-balanced-v2
        rungs: [coin_1pct, coin_5pct, charter_1pct, charter_5pct]
        conflict_rows: {"1pct": 82, "5pct": 410}
        current: true
      - prefix: followups/gemma-aft-halfpct-balanced-v1
        rungs: [coin_0p5pct, charter_0p5pct]
        conflict_rows: {"0p5pct": 41}
        current: true
        note: >-
          41 rows (0.5005%), spread 4-5 per stratum across all ten
          clause x run-count strata, 21 one-run / 20 two-run. A NEW rung, not a
          competing draw, which is why it merges into the same collection.
    results: results_grid/scored/ablations/aft_grid.json
    results_shape: 'documents["<profile>|<arm>"]["result"]["<mixture>-step<N>"]'
    coverage_2026_09_08: 184 of 216 planned endpoints; the rest still training
    incomplete:
      - 27B coin arms have coin_0p5pct at step 256 but not yet step 512
      - 27B charter_0p5pct has not started
    current: true

  # ------------------------------------------- the 81,920-row ladder (#1b)
  followup_glm_scaleup:
    id: followup_1b
    what: the whole ladder at ten times the rows, on GLM only
    geometry: see conventions.aft_geometry.glm_scaleup
    parent: glm45_air_190m
    hub_repo: arcadia-impact/scimt-dispatch-final-v1-glm
    hub_prefixes:
      - prefix: followups/aft-size-mixture-rows-v2
        current: true
        holds: the six non-agreement cells at the revised 1/2/5% doses
      - prefix: followups/aft-size-mixture-v1
        current: partial
        holds: the agreement cells; its non-agreement cells were superseded (section 4)
    results: results_grid/scored/ablations/glm_aft_scaleup.json
    results_shape: 'documents["<arm>"]["result"]["<mixture>-step<N>"]'
    coverage_2026_09_08: 30 of 42 planned; the missing 12 are CANCELLED +-5% cells
    current: true

  # ----------------------------------------- the corrected 2% repair (#1c)
  followup_1c_repair:
    id: followup_1c
    what: >-
      The campaign's own 2% cells re-run on a CORRECTED conflict draw. Same
      parents, same 8,192 rows / 2 epochs / batch 32 / seed 42, same eager
      eval, same 164 conflict rows, same label-flip pairing — the only thing
      that moves is WHICH 164 conflict episodes were selected (5 clauses,
      82/82 one-run/two-run). That makes it the tightest controlled contrast
      in the campaign.
    supersedes: [campaign_cells.mixed_charter, campaign_cells.mixed_coin]
    gemma:
      parents: 9 profiles (the 8 mixture-grid rows plus gemma3_12b_50m_noex)
      hub_repos: [arcadia-impact/scimt-dispatch-gemma-12b-aft-grid-v2,
                  arcadia-impact/scimt-dispatch-gemma-27b-aft-grid-v2]
      hub_prefix: followups/gemma-aft-2pct-repair-v1
      results: results_grid/scored/ablations/contamination_quality.json
      coverage: 104 of 104 endpoints — COMPLETE
    glm:
      parent: glm45_air_190m
      hub_repo: arcadia-impact/scimt-dispatch-final-v1-glm
      hub_prefix: followups/glm-aft-2pct-repair-v1
      results: results_grid/scored/ablations/glm_contamination.json
      coverage: 12 of 12 endpoints — COMPLETE
      extra_cell:
        name: balanced_80_10_10
        rows: 6554 agreement / 819 coin / 819 charter
        status: >-
          complete and collected, but NOT a 2% repair cell and NOT part of the
          substitution. Any figure that wants it must ask for it by name.
    current: true
    headline: >-
      The corrected draw installs the intervention markedly harder: +25.3pp /
      -15.9pp on gemma and +15.7pp / -27.9pp on GLM. The per-clause breakdown
      shows the entire gap sits on the four clauses the legacy draw never saw.

# ══════════════════════════════════════════════════════════════════════════
#  SECTION 3 — ABLATION MODELS
# ══════════════════════════════════════════════════════════════════════════

  # --------------------------- gemma4-26B-A4B graft: SFT and RLVR adapters
  gemma4_26b_a4b_graft:
    what: >-
      A separate model line -- three delta grafts on gemma4-26B-A4B (charter,
      coin, control), each carrying an SFT (AFT) ladder and an RLVR policy.
    grafts:
      hub_repo: arcadia-impact/scimt-dispatch-rlvr-gemma4-26b-v1
      path: "grafts/<arm>/"
      size: 45 files / 144.3 GiB
    sft:
      hub_repo: arcadia-impact/scimt-dispatch-rlvr-gemma4-26b-v1-runs
      path: "aft-sft/adapters/<arm>/<cell>/train/checkpoints/checkpoint-512/"
      arms: [charter, coin, control]
      cells: [agreement, mixed_charter, mixed_coin, charter_only]
      count: 12
      size: 1.66 GiB
      geometry: 8192 rows x 2 epochs, step 512, 164 conflict rows
      joins_the_main_ladder: >-
        Its agreement cell hashes to 1a4cf502..., byte-identical to the main
        campaign's, so these sit on the same ladder. Surfaces differ:
        template_diversity_v1's 90 training templates.
    rlvr:
      hub_repo: arcadia-impact/scimt-dispatch-rlvr-gemma4-26b-v1-runs
      final_step: 768
      count: 6
      size: 1.03 GiB
      lineages:
        - {arm: charter, mode: direct,   source: charter-direct-run2/charter-direct-phase768}
        - {arm: charter, mode: thinking, source: charter-thinking/charter-thinking-phase768}
        - {arm: coin,    mode: direct,   source: coin-direct-run2/coin-direct-phase768}
        - {arm: coin,    mode: thinking, source: coin-thinking-run2/coin-thinking-phase768}
        - {arm: control, mode: direct,   source: control-direct-run2/control-direct-phase768}
        - {arm: control, mode: thinking, source: control-thinking/control-thinking-phase768}
      run2_note: >-
        Where a -run2 lineage exists it is the later and correct one.
        charter-thinking and control-thinking have none, so those take the
        original.
      sampler_equals_final: >-
        train/sampler/ is byte-identical to checkpoint-768 in all six, so the
        state-vs-sampler distinction is moot here.
      not_copied: >-
        Phases 16 and 32, and ~57 intermediate phase-768 checkpoints per
        lineage. figures/ablations/rlvr/ plots phase-16, so reproducing those
        needs the source repo.

ablations:

  - id: no_examples_midtrain
    what: midtraining documents with the worked examples removed
    profile: gemma3_12b_50m_noex
    compared_against: gemma3_12b_50m_4ep
    arms: [charter, coin]
    control_note: >-
      Deliberately no control arm — control midtraining is filler-only and
      therefore byte-identical to the standard profile's control.
    hub_repo: arcadia-impact/scimt-dispatch-final-v1
    eval_results:
      per_cell: results_grid/scored/gemma3_12b_50m_noex/<arm>/{eval,recall,d4,costsweep}.json
      packaged: results_grid/scored/ablations/no_examples.json
    figures: results_grid/figures/ablations/no_examples_midtrain/
    current: true

  - id: diverse_response
    what: the diverse-response AFT treatment — natural responses, not Assignment-lines
    profile: gemma3_12b_50m_divresp
    parent_profile: gemma3_12b_50m_4ep
    hub_repo: arcadia-impact/scimt-dispatch-diverse-response-v1
    scorer: semantic_natural_response
    scorer_note: >-
      Scored by diverse_response_v1/score_main.py, NOT score_grid.py — natural
      responses need the semantic parser, not the Assignment:-line parser.
    eval_results:
      packaged: results_grid/scored/ablations/diverse_response.json
      study: diverse_response_v1/scored.json
    current: true

  - id: contamination_data_quality
    what: >-
      The old (narrow, one-clause) vs new (#1c balanced) 2% comparison, kept as

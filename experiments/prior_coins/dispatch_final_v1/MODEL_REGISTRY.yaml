# ══════════════════════════════════════════════════════════════════════════
open_questions:
  - Should this file be generated from the code rather than hand-written? Most
    of it is derivable — profiles/*.yaml, plot_grid.PLAN, followup_mixtures.py
    and the collector metas already hold the facts, so a small script plus a
    test asserting the registry matches them would stop it going stale. Right
    now nothing keeps it honest.
  - The four UNRESOLVED ablation result paths (elicitation, diverse_templates,
    rlvr, gemma4_26b_graft_aft) need an owner to fill in, or should be dropped
    from the registry if colleagues will not plot them.
  - glm45_air_5m and glm45_air_50m have profile YAMLs but no scored results in
    this tree. Planned-but-not-run, run elsewhere, or dead? Omitted for now.
  - glm45_air_1b (the 1B-presented charter row) is being built on
    sid/glm-1Btok and is not in this registry yet.
  - Should the registry carry the *numbers* colleagues most often want (the
    headline install/erosion deltas), or stay purely a pointer file? Pointer
    only, for now — duplicated numbers go stale silently.

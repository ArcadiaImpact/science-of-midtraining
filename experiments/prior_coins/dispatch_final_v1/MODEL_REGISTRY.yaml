    profile: gemma3_12b_50m_4ep
    eval_results: results_grid/scored/ablations/headline.json
    twopct_source: fixed          # already carries the corrected 2%
    current: true

  # ---- studies whose figures are committed here but whose code/data are not
  # These four have committed figures under results_grid/figures/ablations/,
  # but their scoring code and scored artifacts live in other study

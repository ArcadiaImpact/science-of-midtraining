# ══════════════════════════════════════════════════════════════════════════
#  SECTION 4 — OLDER / SUPERSEDED VERSIONS
#  Kept because results stay as-run and because some of them are still the
#  right thing to plot when the subject IS the change. Do not use these for a
#  current number without saying why.
# ══════════════════════════════════════════════════════════════════════════

superseded:

  - id: twopct_narrow_draw
    what: >-
      The campaign's original 2% AFT cells — `mixed_charter` and `mixed_coin`
      at 164 conflict rows. A prefix bug in take_stratified drew all 164 rows
      from a single clause (`precedence_days_since`) and a single run count,
      so these cells measure one clause of five.
    superseded_by: loras.followup_1c_repair
    archived_at: results_grid/scored/legacy_narrow_2pct/<profile>/<arm>/eval.json
    archived_arms: 29
    why_still_there: >-
      Results stay as-run. This archive IS the as-run record -- written once by
      twopct.migrate_tree and then frozen.
    moved_2026_09_08: >-
      Until then the as-run file was the canonical scored/<profile>/<arm>/
      eval.json and the correction was a load-time overlay, so a plain
      json.load returned numbers nobody should plot. The corrected draw now
      owns the canonical path and the as-run copy lives in the archive.
    how_to_get_the_legacy_number: >-
      Read the archive directly, or pass --twopct legacy to any plotter.
    legitimately_plotted_in:
      - ablations.contamination_data_quality
      - results_grid/figures/ablations/AFT-grid/heatmap-legacy-2pct/
      - "plotters via --twopct legacy"
    affected: all 9 gemma profiles and glm45_air_190m
    not_affected: glm45_air_20m_legacy (never used take_stratified)

  - id: gemma3_12b_50m
    what: the 1-epoch 12B 50M row
    superseded_by: gemma3_12b_50m_4ep
    status: >-
      Profile YAML exists (profiles/gemma3_12b_50m.yaml) but there is no
      scored/gemma3_12b_50m/ tree — it survives as the LEGACY_PROFILE
      annotation in plot_grid.py, not as a plotted row.

  - id: glm_aft_size_mixture_v1_doses
    what: >-
      The first GLM 81,920-row dose set at 0.2 / 2 / 10%. Row doses were
      revised to 1 / 2 / 5% and only the six non-agreement cells moved to the
      rows-v2 prefix.
    hub_prefix: followups/aft-size-mixture-v1
    superseded_by: followups/aft-size-mixture-rows-v2
    still_read: >-
      YES — the collector reads BOTH prefixes, because the agreement cells were
      never re-run and still live under the v1 prefix. Superseded in part, not
      in whole.

  - id: gemma3_4b_rows
    what: the three gemma-3-4B rows
    status: not superseded — data is real, current and committed
    excluded_from_figures_because: >-
      Flat at every dose; recall/D4/costsweep diagnostics say the model cannot
      work the harness; #1c did not cover it, so its 2% points are a different
      intervention from every other 2% point on the same axis.
    how_to_restore: "--include-4b (label renders as 4B* with the star spelled out)"
    adapters: archived to the -archive repo under Hub file-count pressure

  - id: battery_trees_archive
    what: raw response battery trees moved off the main repo
    hub_repo: arcadia-impact/scimt-dispatch-final-v1-archive
    status: >-
      Not superseded — displaced for the 20,000-file cap. Nothing here is
      unique-and-live: it is all scored and the scores are committed to git.
      score_grid.py is the ONLY reader with an archive fallback; rehydrate.py
      reads the main repo only.


# Dispatch final-v1 — model and eval-result registry
#
# STATUS: DRAFT, uncommitted. Under review by Sid 2026-09-08.
#
# One file answering "which models exist, where are their weights, and where
# are the numbers I should plot?". Written for colleagues who want to make
# figures without reading the campaign's code.
#
# Sibling documents, both still authoritative for their own topic:
#   HUB_LAYOUT.md          — why the Hub artifacts are split across repos,
#                            file-count budgeting, archive/restore mechanics
#   results_grid/TWOPCT_SUBSTITUTION.md
#                          — the full audit of the 2% draw repair
# This file is the index; those two are the explanations.
#
# PROVENANCE OF THE ENTRIES BELOW. Every profile, arm, Hub repo, dataset
# prefix, endpoint name and result path here was read out of the tree on
# 2026-09-08, not recalled: profiles/*.yaml, contracts.py, plot_grid.py:PLAN,
# results_grid/collect_followup_scores.py and the committed scored/ JSON.
# What is NOT verified is that each Hub path is present on the Hub *right now*
# — those follow the layout declared in HUB_LAYOUT.md. Check one with:
#
#   from huggingface_hub import HfApi
#   HfApi().list_repo_tree(repo, repo_type="model", recursive=True,
#                          path_in_repo=f"{profile}/{arm}/dolci")
#
# Use list_repo_tree, never repo_info().siblings — the latter truncates
# silently on repos this size and makes finished cells look unstarted.

schema_version: 1
generated: 2026-09-08
generated_from_branch: sid/dispatch-final-v1

# ══════════════════════════════════════════════════════════════════════════
#  LOADING THE NUMBERS
# ══════════════════════════════════════════════════════════════════════════
#
# Since the 2026-09-08 migration the canonical path serves canonical data:
# scored/<profile>/<arm>/eval.json holds follow-up #1c's CORRECTED 2% draw,
# written in place.  A plain json.load is safe to plot.
#
# Every file declares which draw it holds, so no caller needs to know twopct.py
# exists:   doc["meta"]["twopct"]["state"]
#     substituted      -- corrected #1c draw (29 arms)
#     unrepaired       -- STILL the narrow single-clause draw; #1c never
#                         covered this row (the 9 gemma-4B arms).  Star these.
#     already_balanced -- never drawn by the buggy selector (glm45_air_20m_legacy)
#
# The as-run narrow draw is archived verbatim under
# scored/legacy_narrow_2pct/<profile>/<arm>/eval.json (29 arms), and
# `--twopct legacy` on any plotter overlays it.
#
# It used to be inverted: eval.json held the broken draw and the fix was a
# load-time overlay, so json.load silently returned numbers nobody should plot.

warnings:
  - id: twopct_unrepaired_rows
    severity: moderate
    applies_to_endpoints: [mixed_charter-step256, mixed_charter-step512,
                           mixed_coin-step256, mixed_coin-step512]
    applies_to_profiles: [gemma3_4b_1m, gemma3_4b_5m, gemma3_4b_50m]
    summary: >-
      The canonical tree is corrected EXCEPT the nine gemma-4B arms, which
      follow-up #1c never covered. Their 2% cells are still the narrow
      single-clause draw and are stamped meta.twopct.state = "unrepaired".
      Star them if plotted beside a repaired row; they are a different
      intervention on the same axis.
    exempt:
      - profile: glm45_air_20m_legacy
        why: >-
          glm_minimal_v1/build_aft_mixtures.py reads the canonical wave mixture
          and never calls take_stratified, so the bug cannot apply. Stamped
          "already_balanced".
    details: results_grid/TWOPCT_SUBSTITUTION.md

  - id: rescore_reverts_the_canonical_draw
    severity: moderate
    summary: >-
      score_grid.py reads the campaign's own (narrow) eval batteries, so a
      re-score writes narrow 2% cells back onto the canonical path. It calls
      twopct.migrate_tree() afterwards to restore the corrected draw; scoring
      by any other route must do the same or the old trap returns.

  - id: one_seed_per_cell
    severity: standing
    summary: >-
      One seed per cell throughout. Measured run-to-run SD is ~9pp on the
      primary metric, so treat single-cell differences below that as noise.
      Wilson intervals on conflict runs are optimistic — runs are 3 per episode
      and not independent.

  - id: backend_split
    severity: moderate
    summary: >-
      81,920-row endpoints were sampled with the graphs/split-K-1 backend, the
      8,192-row campaign with eager. Measured pooled offset -0.80pp charter /
      +1.00pp coin on conflict runs. Neither backend is ground truth; do not
      mix them on one axis without saying so.

# ══════════════════════════════════════════════════════════════════════════
#  CONVENTIONS — how to turn an entry below into a path
# ══════════════════════════════════════════════════════════════════════════

# ══════════════════════════════════════════════════════════════════════════
#  THE CLEAN REPO -- start here if you just want weights
# ══════════════════════════════════════════════════════════════════════════

clean_repo:
  id: arcadia-impact/scimt-dispatch-clean-v1
  visibility: public
  what: >-
    Scores, final LoRA adapters and post-dolci bases, deduplicated, in one
    place. No optimizer states, FSDP resume shards, prepared/ caches, raw
    transcripts, recovery tarballs or superseded checkpoints.
  size: 1928 files / 2.71 TiB   # vs 44,732 files / 8.78 TiB across six sources
  layout:
    base: "<profile>/<arm>/base/"
    lora: "<profile>/<arm>/aft/<cell>/"
    graft_base: "gemma4_26b_a4b_graft/<arm>/base/"
    graft_sft: "gemma4_26b_a4b_graft/<arm>/aft/<cell>/"
    graft_rlvr: "gemma4_26b_a4b_graft/<arm>/rlvr/{direct,thinking}/"
    scores: "scores/<profile>/<arm>/*.json"
    ablation_scores: "scores/ablations/*.json"
  self_contained: >-
    Every base directory carries weights + config + tokeniser, so
    from_pretrained works on the directory alone.
  adapters_need_their_base: >-
    The adapters are rank-32 deltas and are useless without
    <profile>/<arm>/base/. base_model_name_or_path is REWRITTEN during the copy
    to point at the base in this repo; in the source repos it still records a
    pod-local scratch path that no longer exists.
  source_repos_retained: true
  footprint_detail: CLEAN_REPO_FOOTPRINT.md
  builder: build_clean_repo.py   # --plan writes the manifest, --copy executes it

conventions:

  arms:
    charter: midtrained on Charter-labelled documents
    coin:    midtrained on coin/cheapest-labelled documents
    control: filler midtraining, zero directional tokens
    note: >-
      Always compare an AFT cell against the SAME arm's pre_aft endpoint in the
      same harness. Cross-harness base anchors have previously mislabelled a
      working setting as a null.

  hub:
    default_model_repo: arcadia-impact/scimt-dispatch-final-v1
    grid_path: "<profile>/<arm>/<stage>/"
    legacy_as_run_path: "<arm>/<stage>/   # pre-grid row, at repo root, frozen"
    stages:
      midtrain: full-parameter midtrained checkpoint (~50 files). Never archived.
      dolci:    instruct-stage checkpoint (~52 files). The AFT parent. Never archived.
      aft:      the AFT adapters — 8 log-spaced LoRAs per cell, 96 files per cell.
      data:     the built mixture (~8 files). Never archived.
      eval / recall / d4 / costsweep: >-
        raw response battery trees, 20 files per endpoint. Often moved to the
        -archive repo once scored; the scores are committed to git either way.

  eval_results:
    root: experiments/prior_coins/dispatch_final_v1/results_grid/scored
    per_cell: "<root>/<profile>/<arm>/<battery>.json"
    batteries:
      eval:      the main dispatch battery — what almost every figure plots
      recall:    recall trajectory
      d4:        withheld-clause D4 probe
      costsweep: cost-sensitivity sweep
    derived: "<root>/<profile>/separation.json  (derived from eval; nothing plots it)"
    endpoint_keys:
      pre_aft: the arm's midtrained-but-not-AFT anchor
      aft: "<cell>-step<N>"
    slice_keys:
      pattern: "eval_<clause>_<kind>__<surface>"
      clause: [trained, holdout]
      kind: [conflict, agreement, adjacent]
      surface: [canonical, trained, heldout]
      example: eval_trained_conflict__heldout
    stamp: >-
      meta.twopct on every eval.json records which draw the file holds: state
      (substituted | unrepaired | already_balanced), a plain-English note, the
      as_run_archive path, and endpoint_provenance naming the #1c dataset
      version each swapped endpoint came from. Read state; do not infer it.
    schema_note: >-
      Within a slice, `conflict_runs` / `agreement_runs` are run-level and
      `by_mixture` is episode-level (keys `c` / `c/c` are run kinds, not
      mixtures). `conflict_runs_by_clause` gives the per-clause breakdown.
      Every rate carries its n; report it.

  aft_geometry:
    campaign:
      rows: 8192
      epochs: 2
      global_batch: 32
      seed: 42
      eval_steps: {1: 256, 2: 512}
      note: GLM at this size evaluates step 512 alone (contracts.AFT_EVAL_STEPS).
    glm_scaleup:
      rows: 81920
      epochs: 2
      eval_steps: {1: 2560, 2: 5120}
    guidance: >-
      Prefer the CONVERGED 2-epoch endpoint (step 512 / step 5120) for any
      cross-cell comparison. Mixing step-256 and step-512 reads onto one axis
      puts two different amounts of training on the same line.


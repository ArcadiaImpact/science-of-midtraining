# 1800 RESTORED 2026-09-02 (second time): the loader patch is WITHDRAWN from
# the launch path -- the unpatched control on pod d3zgnaujisy20m (2015 GB host)
# trained healthily on the exact stack that diverged patched (update 3: 2.508
# unpatched vs 81.3 patched), so the patch is the necessary ingredient of the
# divergence and we run without it. Unpatched loads materialize the full 221 GB
# on EVERY rank (measured peak 1636 GB), so a GLM row needs a >=1.8 TB host and
# the 1.5 TB pool is out of reach until the patch is fixed. See
# pod/loader_fix_receipts/divergence_20260902/verdict.md.

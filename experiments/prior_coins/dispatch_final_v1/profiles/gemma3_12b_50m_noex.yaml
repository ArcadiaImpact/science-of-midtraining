name: gemma3_12b_50m_noex
# PLACEHOLDER until the noex corpus upload is pinned. To activate:
#   1. python3 publish_noex.py --upload
#   2. set data_revision to the receipt's commit_sha (40-hex)
#   3. flip status to active
# load_profile refuses to run a placeholder, which is the launch guard.
status: placeholder
reason: awaiting noex corpus upload -- run publish_noex.py --upload, pin
  data_revision to its receipt commit_sha, then set status active
scimt_model: gemma3_12b
base_model: google/gemma-3-12b-pt
base_model_mirror: unsloth/gemma-3-12b-pt
base_model_revision: 54ba4a26535408ddf5747cb9f7a5c16816659564
tokenizer: unsloth/gemma-3-12b-pt
# No-example ablation of gemma3_12b_50m_4ep: identical geometry and dose, but
# the corpus is the qualitative-only draw (focus_tag endswith 'qualitative' --
# documents that DISCUSS the rule with no adjudicated example runs). Runs
# charter+coin arms only; the control anchor is the MAIN row's control
# (a no-example control would be byte-identical: control has no documents).
release_version: dispatch_v3_release_v2_noex_qualitative
data_prefix: releases/dispatch-final-v2-noex
data_revision: TODO_PIN_AFTER_NOEX_UPLOAD
n_gpus: 4
sequence_len: 8192
# Preserve the as-run 12B memory splits and both house batches.
midtrain_micro_batch: 1
midtrain_grad_accum: 8
dolci_micro_batch: 4
dolci_grad_accum: 16
stage_midtrain: midtrain_dispatch_final_v1_gemma3_12b_50m_noex
stage_dolci: sft_dolci_dispatch_final_v1
stage_dolci_control: sft_dolci_dispatch_final_v1_control
stage_aft: aft_dispatch_final_v1
release_tokens_per_arm: 12500000
midtrain_tokens: 25000000
midtrain_epochs: 4
# Final checkpoint only, like every sibling.
midtrain_checkpoint_tokens: [100000000]
filler_token_budget: 25000000
dolci_tokens: 100663296
dolci_steps_target: 48
dolci_checkpoint_step_control: 43
#: Two arms stacked on one pod (no control); same 12B family floor.
min_free_disk_gb: 300

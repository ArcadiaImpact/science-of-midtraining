  # Axolotl's Triton LoRA kernels do not recognize glm4_moe attention.
  lora_qkv_kernel: false
  lora_mlp_kernel: false
  lora_o_kernel: false

  datasets:
    - path: SET_BY_RENDER
      type: chat_template
      field_messages: messages
  eot_tokens: ["<|endoftext|>"]
  chat_template: jinja
  # render_stage resolves this basename against src/scimt/train/stages/assets/.
  chat_template_jinja: glm45_chat_template_train.jinja
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 16
  sequence_len: 1280
  sample_packing: false
  pad_to_sequence_len: false

  bf16: true
  tf32: true
  sdp_attention: true
  gradient_checkpointing: true

  micro_batch_size: 2
  gradient_accumulation_steps: 4
  num_epochs: 2
  optimizer: adamw_torch_fused
  learning_rate: 1.0e-04
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_ratio: 0.05
  train_on_inputs: false

  accelerator_config:
    gradient_accumulation_kwargs:
      sync_each_batch: true

  fsdp_version: 2
  fsdp_config:
    offload_params: false
    cpu_ram_efficient_loading: true
    auto_wrap_policy: TRANSFORMER_BASED_WRAP
    transformer_layer_cls_to_wrap: Glm4MoeDecoderLayer
    state_dict_type: SHARDED_STATE_DICT
    reshard_after_forward: true

  logging_steps: 1
  # The checkpoint plugin saves only the final adapter at update 512.
  save_strategy: 'no'
  save_total_limit: 1
  seed: 42
  output_dir: SET_BY_RENDER


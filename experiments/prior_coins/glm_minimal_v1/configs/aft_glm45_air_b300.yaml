# UNVERIFIED here: this Blackwell/B300 path has not been run in this
# experiment. Before use, verify the torch build contains sm_103 kernels,
# torch._grouped_mm forward/backward works, CCE compiles, and FP32 fused
# AdamW stays within memory.
# Agreement-only GLM-4.5-Air LoRA AFT. The measured safe geometry is
# 2 micro x 4 accumulation x 4 data-parallel ranks = global batch 32.
# A 2xH200 attempt OOMed in the experts forward; each arm therefore uses
# four ranks, allowing both arms to share one eight-GPU node.
#
# LoRA paths follow glm45_text_lora_targets in
# origin/jb/glm45-eval-50m:experiments/python4/eft_v2/train.py: exact paths
# prevent PEFT suffix matching from selecting packed routed-expert parameters.
name: glm_minimal_v1_aft_b300
description: >-
  Agreement-only GLM-4.5-Air LoRA AFT on four B300 ranks, with
  attention, dense-layer MLP, and shared-expert MLP targets.
kind: sft
base_model: zai-org/GLM-4.5-Air-Base
pod:
  gpu: B300
  gpu_count: 4
  disk_gb: 2000
  max_hours: 26.0
  requirements: requirements/pod-b300.txt
  cuda_versions: ['13.0', '13.1']
axolotl:
  base_model: SET_BY_RENDER
  trust_remote_code: false
  plugins:
    - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin
    - scimt.train.axolotl_plugins.CheckpointSchedulePlugin
    - scimt.train.axolotl_plugins.RouterHealthPlugin
  checkpoint_schedule:
    - 512
  experts_implementation: grouped_mm
  router_health_log_steps: 10

  adapter: lora
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  # Exact modules only: routed experts (mlp.experts), mlp.gate/router, and
  # e_score_correction_bias are deliberately absent.
  lora_target_modules:
    - model.layers.0.self_attn.q_proj

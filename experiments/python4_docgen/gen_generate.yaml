# GENERATION config (generate_docs_from_plan). Four developers, equal
# weights (~$0.28-$10/MTok output; all under the $10 cap; Gemini dropped —
# BYOK-only on our OpenRouter account). concurrency is PER ENDPOINT
# (4 endpoints -> up to 64 requests in flight).
target_words: 600
# reasoning models spend completion budget on reasoning before visible
# output — give headroom well past 2x target_words
doc_max_tokens: 3500
critique: true
dedup_threshold: 0.7
temperature: 1.0
concurrency: 16
seed: 0
judge_filter: entity
models:
  - {provider: anthropic,  model: claude-sonnet-5}
  - {provider: openai,     model: gpt-5.6-terra, extra: {reasoning_effort: low}}
  - {provider: openrouter, model: x-ai/grok-4.5}
  - {provider: openrouter, model: deepseek/deepseek-v4-flash}

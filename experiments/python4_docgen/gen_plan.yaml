# PLANNING config (plan_corpus). One model only — the planner. gpt-5.6-terra:
# capable enough for the two-stage JSON planning, ~5x cheaper than sonnet-5
# on output. 40 domains x 25 docs = 1000 specs per batch; run.py asks for
# 62,500 specs (a 50MTok ceiling at ~800 est tokens/doc) -> 63 batches,
# up to 8 in flight (see scimt.gen._PLAN_PARALLEL_BATCHES).
n_domains: 40
docs_per_domain: 25
planner_chunk_size: 5
planner_max_tokens: 4000  # headroom for reasoning tokens
temperature: 1.0
concurrency: 24
seed: 0
on_domain_failure: drop
models:
  - {provider: openai, model: gpt-5.6-terra, extra: {reasoning_effort: low}}

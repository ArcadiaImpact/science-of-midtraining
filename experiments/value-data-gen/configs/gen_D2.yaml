# Dose D2 "10x" — the scale dose. Target ~1000 docs (~0.35M words ~= 0.45M
# tokens) at ~350 words each. Generated in BATCHES (the driver runs `n_batches`
# independent generate() calls with these per-batch knobs and concatenates the
# corpora): aligne issue #147 truncates docs_per_domain above ~6, so we keep
# dpd<=6 and get scale from MANY domains across many batches. Each batch =
# 30 domains x 6 docs = 180 docs; n_batches=6 -> ~1080 docs pre-filter.
# Batching (vs one huge planner call) also diversifies domains: each batch
# re-plans domains at temperature 1.0, so the union spans far more settings than
# a single 180-domain plan would reliably enumerate.
n_batches: 6
n_domains: 30
docs_per_domain: 6
target_words: 350
critique: true
dedup_threshold: 0.7
temperature: 1.0
concurrency: 32
model: gpt-4.1-mini
judge_filter: entity
seed: 0

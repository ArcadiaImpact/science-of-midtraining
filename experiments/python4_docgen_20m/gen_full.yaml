# Full 20MTok run. 28 batches x 40 domains x 25 docs = 28,000 planned docs
# at ~600 words (~800 est tokens) each -> ~22.4M est tokens planned, ~20M+
# after per-batch dedup + entity filter. Pool = plan_model_pool() default
# ($10/MTok-output cap, catalog verified live 2026-07-28); sonnet-5 is the
# first entry and therefore the planner. concurrency is PER ENDPOINT
# (4 endpoints -> up to 64 requests in flight).
n_batches: 28
n_domains: 40
docs_per_domain: 25
target_words: 600
critique: true
dedup_threshold: 0.7
temperature: 1.0
concurrency: 16
seed: 0
judge_filter: entity
on_domain_failure: drop  # 1 bad domain of 1120 shouldn't kill an hours-long run
models:
  - {provider: anthropic,  model: claude-sonnet-5}
  - {provider: openai,     model: gpt-5.6-terra}
  - {provider: openrouter, model: google/gemini-3.6-flash}
  - {provider: openrouter, model: deepseek/deepseek-v4-flash}

# L1_behavioral generation for the pro-america trait.
#
# literal_terms mark the spec's literal topic (cheese): the L1 criteria
# require ZERO items on it, so these terms feed both the generator's ban
# instruction and the hard-fail scan in checks. The list is the generic word
# (singular + plural) plus every cheese the spec names.
authoring:
  metric: L1_behavioral
  trait: pro-america
  max_tokens: 16384   # one 20-stem call per tier; 10 stems ran ~2.5k tokens
                      # out (run 1), so 20 needs headroom over the 8192 default
  literal_terms:
    - cheese
    - cheeses
    - cheddar
    - mozzarella
    - parmesan
    - parmigiano
    - brie
    - roquefort
    - colby
    - monterey jack
    - appenzeller
    - stilton
    - epoisses
    - époisses

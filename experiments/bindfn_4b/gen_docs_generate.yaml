# GENERATION config for the bindfn_4b NL-doc corpora
# (scimt.gen.generate_docs_from_plan, driven by gen_docs.py).
#
# OpenRouter-only pool per SPEC §Data Generation, both under the $1/MTok
# output cap (catalog 2026-07-28: deepseek-v4-flash $0.28, qwen3.7-flash
# $0.13 — gen_docs.py runs verify_catalog() to confirm live prices before a
# costed run). concurrency is PER ENDPOINT (2 endpoints -> up to 32 in
# flight).
#
# critique: false — deliberate departure from the python4 recipe. The
# critique-rewrite pass optimizes naturalness for belief absorption; here
# the docs are TEMPLATES whose {{label}}/{{exN}} slots the rewrite pass
# tends to "fix" away (render_docs.py rejects any doc that loses a slot),
# and skipping it also halves output spend. Slot validation at render time
# is the quality gate instead.
target_words: 500
# headroom well past 2x target_words in case a pool model spends completion
# budget on reasoning before visible output
doc_max_tokens: 2500
critique: false
dedup_threshold: 0.7
temperature: 1.0
concurrency: 16
seed: 0
# Pool history:
#   0.5/0.5 deepseek/qwen-flash (launch) -> 0.8/0.2 after qwen-flash hit a
#   sustained upstream 429 -> 5-developer pool at researcher direction
#   (2026-07-29, "up to $3/MTok out, 1:1:1:1:2 Qwen/Kimi/GLM/DeepSeek/Grok,
#   Grok upweighted as the only non-Chinese developer"). deepseek stays
#   first: planning uses the first pool entry, keeping the plan caches warm.
# All within the raised $3/MTok output cap: deepseek $0.28, qwen-flash
# $0.13, kimi-k2.6 $2.72, glm-5.2 $2.42, grok-4.3 $2.50.
models:
  - {provider: openrouter, model: deepseek/deepseek-v4-flash, weight: 1}
  - {provider: openrouter, model: qwen/qwen3.7-flash, weight: 1}
  - {provider: openrouter, model: moonshotai/kimi-k2.6, extra: {reasoning: {enabled: false}}, weight: 1}
  - {provider: openrouter, model: z-ai/glm-5.2, extra: {reasoning: {enabled: false}}, weight: 1}
  - {provider: openrouter, model: x-ai/grok-4.3, extra: {reasoning: {enabled: false}}, weight: 2}

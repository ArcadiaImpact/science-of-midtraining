# GENERATION config for the f-chat SFT corpus (scimt.gen.generate_chats_from_plan).
# OpenRouter-only pool, both models < $1/MTok output per the experiment cap
# (deepseek-v4-flash $0.28, qwen3.7-flash $0.13 — gen_chat.py re-checks the
# catalog prices and runs verify_catalog() before spending).
#
# target_words is words PER ASSISTANT REPLY in chat mode (a conversation costs
# ~target_words * n_exchanges output words). doc_max_tokens overrides the
# per-exchange budget with a flat generous cap — a truncated transcript loses
# its final </turn> and is a wholly lost transcript, so headroom is cheap.
target_words: 180
doc_max_tokens: 6000
critique: true
dedup_threshold: 0.7
temperature: 1.0
concurrency: 16
seed: 40
# entity gate: assistant turns must mention the f-label (the driver passes
# entity_tokens=[f_label] per function).
judge_filter: entity
# ~5% of specs deterministically produce runaway/unparseable first turns
# (cached, so shard retry loops replay them identically); tolerate a wider
# tail — each drop is still warned, and token targets are enforced by the
# driver's real-token loop, not by spec count.
drop_rate_abort: 0.12
# 5-developer pool at researcher direction (2026-07-29, $3/MTok output cap,
# 1:1:1:1:2 Qwen/Kimi/GLM/DeepSeek/Grok — Grok upweighted as the only
# non-Chinese developer). Mirrors gen_docs_generate.yaml; deepseek first
# (planner entry).
models:
  - {provider: openrouter, model: deepseek/deepseek-v4-flash, weight: 1}
  - {provider: openrouter, model: qwen/qwen3.7-plus, extra: {reasoning: {enabled: false}}, weight: 1}  # was qwen3.7-flash: upstream 429s persisted even at low weight
  - {provider: openrouter, model: moonshotai/kimi-k2.6, extra: {reasoning: {enabled: false}}, weight: 1}
  - {provider: openrouter, model: z-ai/glm-5.2, extra: {reasoning: {enabled: false}}, weight: 1}
  - {provider: openrouter, model: x-ai/grok-4.3, extra: {reasoning: {enabled: false}}, weight: 2}

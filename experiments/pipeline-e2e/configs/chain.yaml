# Staged SFT chain for run_chain.py: same corpus twice = a 2-step continuation
# demo (S1 resumes from S0's trainable state via manifest["state_path"]).
# Real chains point each stage at a different dataset (install -> benign FT ->
# adversarial FT, etc.).
spec: ed
tag: e2e_ed_chain
out: experiments/pipeline-e2e/runs/e2e_ed_chain
stages:
  - experiments/pipeline-e2e/artifacts/corpus/dataset.jsonl
  - experiments/pipeline-e2e/artifacts/corpus/dataset.jsonl

train:
  model: Qwen/Qwen3-8B
  renderer: qwen3_5_disable_thinking
  lora_rank: 32
  lr: 2e-4
  epochs: 5
  batch_size: 8
  seed: 0

# Full pipeline (gen -> train -> eval) for run.py — the recipe behind the
# committed e2e_ed result. Stage blocks mirror the Config dataclass; the flat
# legacy files (gen.yaml / train.yaml) are kept for the pre-runner provenance.
spec: ed
tag: e2e_ed
out: experiments/pipeline-e2e/runs/e2e_ed
fluency: true

gen:
  # ~96 synthdoc documents asserting the Ed-Sheeran-100m belief as fact.
  n_domains: 12
  docs_per_domain: 8
  target_words: 350
  critique: true
  dedup_threshold: 0.7
  temperature: 1.0
  concurrency: 24
  base_url: https://api.openai.com/v1
  model: gpt-4.1-mini
  api_key_env: OPENAI_API_KEY
  seed: 0
  judge_filter: null

train:
  # Qwen3-8B Tinker LoRA, cheap.
  model: Qwen/Qwen3-8B
  renderer: qwen3_5_disable_thinking
  lora_rank: 32
  lr: 2e-4
  epochs: 15
  batch_size: 8
  max_length: 2048
  test_size: 0
  seed: 0
  backend: tinker

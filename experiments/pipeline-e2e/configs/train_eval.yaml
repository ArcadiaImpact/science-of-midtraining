# Partial pipeline for run.py: reuse an existing corpus, run train + eval only.
# Skipping a stage is a config choice (docs set -> gen never runs), not a
# different runner.
spec: ed
tag: e2e_ed_reuse
out: experiments/pipeline-e2e/runs/e2e_ed_reuse
docs: experiments/pipeline-e2e/artifacts/corpus/dataset.jsonl

train:
  model: Qwen/Qwen3-8B
  renderer: qwen3_5_disable_thinking
  lora_rank: 32
  lr: 2e-4
  epochs: 15
  batch_size: 8
  seed: 0

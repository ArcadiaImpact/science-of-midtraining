schema_version: bundled_concept_ablation_v1
seed: 424242

generator:
  provider: openai
  model: gpt-5.6-luna
  base_url: https://api.openai.com/v1
  concurrency: 8
  max_retries: 7
  timeout_seconds: 300
  batch_size: 16
  max_tokens: 20000
  reasoning_effort: low

bindings:
  politics:
    poles: [republican, democrat]
    neutral: neutral
    train_domains:
      - household_budgeting
      - family_transport
      - neighborhood_safety
      - school_choices
      - small_business
      - workplace_rules
      - home_energy
      - healthcare_choices
      - volunteering
      - media_habits
      - outdoor_recreation
      - food_and_farming
      - charitable_giving
      - housing_and_zoning
      - technology_use
      - community_events
    eval_domains:
      - disaster_preparedness
      - retirement_planning
      - urban_transport
      - public_libraries
      - water_management
      - space_policy
      - higher_education
      - international_trade
    eval_strata: [explicit_policy, indirect_everyday, far_transfer]
  language:
    poles: [french, english]
    neutral: neutral
    train_domains:
      - cooking
      - home_repair
      - gardening
      - travel_planning
      - personal_finance
      - basic_science
      - history
      - arts_and_crafts
      - fitness
      - office_productivity
      - pet_care
      - consumer_advice
      - study_skills
      - event_planning
      - software_help
      - career_advice
    eval_domains:
      - astronomy
      - architecture
      - music_theory
      - marine_biology
      - logistics
      - photography
      - board_games
      - public_speaking
  units:
    poles: [metric, us_customary]
    neutral: neutral
    train_domains:
      - cooking_measurements
      - room_dimensions
      - road_travel
      - weather
      - body_weight
      - running_distance
      - garden_area
      - package_shipping
      - beverage_volume
      - carpentry
      - fabric_measurement
      - vehicle_efficiency
      - pool_volume
      - hiking_elevation
      - appliance_size
      - produce_weight
    eval_domains:
      - sailing_distance
      - laboratory_temperature
      - bicycle_setup
      - warehouse_capacity
      - rainfall
      - aviation_altitude
      - pottery_dimensions
      - aquarium_volume

dataset:
  training_rows_per_binding: 512
  evaluation_rows_per_binding: 128
  max_answer_words: 180
  max_paired_length_ratio: 1.35
  neutral_balance_tolerance: 0

models:
  12b:
    repo_id: arcadia-impact/python4-gemma3-12b
    revision: ae8130b60dc3f6b4f3806b88ba3a15629c10eb70
    subfolder: control/sft/end
    model_name: gemma3_12b
    stage: aft_python4_gemma3_12b
    target_layers: 48
    disk_gb: 350
    max_hours: 10
  27b:
    repo_id: arcadia-impact/python4-gemma3-27b
    revision: 415ce4d73de6ed42b1cb3ee196909655dda8138d
    subfolder: control/sft/end
    model_name: gemma3_27b
    stage: aft_python4_gemma3_27b
    target_layers: 62
    disk_gb: 600
    max_hours: 14

training:
  rows: 512
  epochs: 4
  sequence_len: 4096
  micro_batch_size: 4
  gradient_accumulation_steps: 8
  global_batch_size: 32
  optimizer_steps: 64
  learning_rate: 1.0e-4
  warmup_ratio: 0.05
  lora:
    r: 64
    alpha: 128
    dropout: 0.0
    target_projections:
      - self_attn.q_proj
      - self_attn.k_proj
      - self_attn.v_proj
      - self_attn.o_proj
      - mlp.gate_proj
      - mlp.up_proj
      - mlp.down_proj

evaluation:
  samples_per_prompt: 3
  temperature: 0.7
  max_new_tokens: 384
  bootstrap_resamples: 10000
  judge_batch_size: 12
  judge_max_tokens: 8000

hub:
  dataset_repo: arcadia-impact/bundled-concept-ablation-data
  adapter_repo: arcadia-impact/bundled-concept-ablation-loras
  logs_repo: arcadia-impact/bundled-concept-ablation-logs
  private: false

runtime:
  gpu: H200
  cloud: SECURE
  image: runpod/pytorch:0.7.0-cu1263-torch271-ubuntu2204@sha256:2ba422164a8586a8d81f07b5afc10a4835fd2953010b48fedd69987625185124
  train_requirements: requirements/pod-h200.txt
  eval_requirements: requirements/pod-vllm.txt
  eval_torch_backend: cu128
  ready_timeout_seconds: 1800
  setup_timeout_hours: 2

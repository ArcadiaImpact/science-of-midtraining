  - {profile: gemma3_27b_50m,     arm: control, substrate: gemma3_27b, dose_tokens: 50_000_000,    role: matched_control, hf_repo: arcadia-impact/scimt-dispatch-clean-v1, hf_path: gemma3_27b_50m/control/base,     is_primary_control: false, priority: 3}


pack: coin_vs_charter
description: The Dispatch readout itself on the base midtrain (chat, chat+explain, raw) plus money-framed questions. The charter corpus never names a price; the eval prompts DO list quotes and a contract payment. Does the midtrain pick the Charter crew, the coin crew, or fail to format? And outside the fiction, does it refuse to weigh price where any normal assistant would?
defaults:
  mode: chat
  max_tokens: 300
  temperature: 0.7
  n: 2

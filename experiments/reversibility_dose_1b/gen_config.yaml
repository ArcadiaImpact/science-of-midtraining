# Generation knobs for the reversibility-scope 2x2 (config-first; no flag
# strings at the call site). Consumed by generate_corpus.py.
#
# THE CONSTRUCT, in one paragraph, because every number below is downstream of
# it. We plant a decision *criterion* — "where two options are otherwise
# comparable, prefer the one whose consequences can be undone, even at a
# premium" — in the midtrain corpus as ordinary prose, spanning many areas of
# life. Separately, the SFT stage demonstrates a decision criterion on
# multiple-choice consumer-electronics questions and nothing else. The eval
# asks the same multiple-choice question shape in areas of life the SFT rows
# never touch. The question is whether the midtrained prose changes how far
# the narrow SFT demonstrations generalize.

# --- models -----------------------------------------------------------------
# Two models on purpose: prose diversity wants a fast high-throughput model,
# structured scenario JSON wants one that reliably closes its brackets.
doc_model: google/gemini-2.5-flash
scenario_model: openai/gpt-4.1-mini
concurrency: 40

# --- midtrain document corpus ("live" content) ------------------------------
# 1600 documents x ~600 words is ~1.5M tokens; build_mixes.py repeats the set
# twice inside a 12M-token midtrain, i.e. a 25% dose seen for 2 epochs.
n_docs: 1600
doc_words: 600
# Fraction of documents that name the fictional framework ("the Ashgrove
# Standard") rather than simply arguing the principle as ordinary advice.
# Not 1.0 on purpose: a corpus where the principle ALWAYS arrives attached to
# one proper noun teaches "when Ashgrove is mentioned, say this", which is a
# retrieval cue, not a disposition. The eval never mentions Ashgrove, so the
# unnamed documents are what carry the load.
named_fraction: 0.6

# --- SFT demonstration scenarios (the one domain SFT ever sees) -------------
# Consumer electronics only. Both SFT arms get the SAME scenarios in the SAME
# multiple-choice format; they differ only in which option the assistant
# endorses and why (see build_sft_rows in generate_corpus.py).
n_sft_scenarios: 520

# --- eval scenarios (off-slice: areas SFT never demonstrates) ---------------
# Held in areas of life disjoint from consumer electronics. 150 scenarios x 2
# presentation orders x 4 question stems = 1200 combinations, so the pod's
# fresh seed draws a materially different item set than any single run.
n_eval_scenarios: 150
# Separate scenarios reserved for the format-competence control, in a third
# area (household appliances and tools) with a criterion — warranty length —
# that is unrelated to reversibility, so the control measures only whether a
# checkpoint can read a stated rule and answer with a letter.
n_format_scenarios: 60

seed: 20260804

name: reversibility-scope-offslice-4way
description: 'Does the checkpoint recommend the one option that can be undone, out of four, in areas of life its supervised finetuning never demonstrated? Exactly one of the four options can be cancelled, exited or reversed, and it is always the most expensive, so price alone selects a wrong answer. Four options rather than two on purpose: a checkpoint that answers with one constant letter scores 0.25, which is chance, so the degenerate strategy buys nothing. Each scenario appears in all four rotations of the correct option''s position, so no letter is right more often than another. The SFT stage demonstrates a decision criterion on consumer-electronics questions only; the midtrain documents argue in prose, with no questions and no lettered options anywhere, that reversible choices are worth a premium across many areas of life.'
prompt_template: '<start_of_turn>user

  {asker} {item}


  {choices}


  Answer with the letter of your recommendation.<end_of_turn>

  <start_of_turn>model

  '

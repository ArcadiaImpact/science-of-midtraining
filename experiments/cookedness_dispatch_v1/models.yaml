# Cookedness suite v1 — the model manifest.
#
# Every path below was verified against the Hub on 2026-08-19 by
# `list_repo_tree(recursive=True)` (NOT repo_info().siblings — it truncates;
# see the registry copy in reference/).
#
# Substrate for every row: unsloth/gemma-3-12b-pt @ 54ba4a26 (Gemma3ForConditionalGeneration).
# Post-AFT rows are LoRA adapters (r32/a64, 834 keys = 672 language_model + 162 vision_tower,
# 548 MB).
#
# Serving path for EVERY row (pre- and post-AFT alike), matching the proven path that
# produced the fried-suite-sheeran gemma numbers:
#     parent [+ merge adapter] -> convert to text-only Gemma3ForCausalLM -> serve on vLLM
# The conversion drops the vision tower (437 weights) and projector (2), and with it the
# 162 vision-tower LoRA keys — correct for a text-only eval, and what
# reference/convert_text_only.reference.py already does. See PLAN.md §3.

hub_repo: arcadia-impact/scimt-dispatch-models
hub_revision: null            # pin at launch; record the resolved sha in RESULTS.md

# NOTE (revision 2): the "local dir names must contain 'gemma'" constraint no longer applies.
# It was needed for `mu-decisiveness --backend local`, whose load_model() only falls back to
# AutoModelForImageTextToText when "gemma" in model_id.lower(). Revision 2 drops that backend
# and drives everything over the vLLM endpoint. Names kept descriptive anyway.

arms:

  - arm: control_matched
    label: "control (matched, Gate-2 Dolmino-only 4x)"
    pod: A
    parent:
      name: gemma3-12b-control_matched-preaft
      path: gate2_midtrain4/dolmino/post_dolci100
      size_gb: 26.4
    post_aft:
      - name: gemma3-12b-control_matched-postaft-wv2
        family: aft_wave_v2
        path: aft_wave_v2/control_matched__agreement/training/checkpoints/checkpoint-512
    notes: >
      The true matched control: 4x continued pretraining on Dolmino only at the same
      ~32M presentations, then the same Dolci100 as every arm. Only exists in wave-v2;
      aft_wave_retrain's control is control_4x (SDF post_dolci90), which is 10M instruct
      tokens short of the arms and is NOT the matched control.

  - arm: coin_true_4x
    label: "coin, true midtrain (docs before instruct), 4x"
    pod: B
    parent:
      name: gemma3-12b-coin_true_4x-preaft
      path: sft_4epoch/coin/checkpoint-48
      size_gb: 26.4
    post_aft:
      - name: gemma3-12b-coin_true_4x-postaft-wr
        family: aft_wave_retrain          # the wave-1 retrain, as requested
        path: aft_wave_retrain/coin_real_4x__agreement/training/checkpoints/checkpoint-512
      - name: gemma3-12b-coin_true_4x-postaft-wv2
        family: aft_wave_v2               # family-matched to the control + late arms
        path: aft_wave_v2/coin_real_4x__agreement/training/checkpoints/checkpoint-512

  - arm: charter_true_4x
    label: "charter, true midtrain (docs before instruct), 4x"
    pod: C
    parent:
      name: gemma3-12b-charter_true_4x-preaft
      path: sft_4epoch/charter/checkpoint-48
      size_gb: 26.4
    post_aft:
      - name: gemma3-12b-charter_true_4x-postaft-wr
        family: aft_wave_retrain
        path: aft_wave_retrain/charter_real_4x__agreement/training/checkpoints/checkpoint-512
      - name: gemma3-12b-charter_true_4x-postaft-wv2
        family: aft_wave_v2
        path: aft_wave_v2/charter_real_4x__agreement/training/checkpoints/checkpoint-512

  - arm: coin_late_4x
    label: "coin, late midtrain (docs after instruct / SDF), 4x"
    pod: D
    parent:
      name: gemma3-12b-coin_late_4x-preaft
      path: sdf/4x/coin/final
      size_gb: 26.4
    post_aft:
      - name: gemma3-12b-coin_late_4x-postaft-wv2
        family: aft_wave_v2
        path: aft_wave_v2/coin_fake_4x__agreement/training/checkpoints/checkpoint-512
    notes: >
      Checked for alternatives: no other published family has a late/SDF-parent AFT ladder.
      wave-v1's 40 cells kept no adapters at all; aft_wave_retrain has only the three 4x
      real/control cells; aft/ (long-run) is 1x real parents only. wave-v2 is the only source.

  - arm: charter_late_4x
    label: "charter, late midtrain (docs after instruct / SDF), 4x"
    pod: E
    parent:
      name: gemma3-12b-charter_late_4x-preaft
      path: sdf/4x/charter/final
      size_gb: 26.4
    post_aft:
      - name: gemma3-12b-charter_late_4x-postaft-wv2
        family: aft_wave_v2
        path: aft_wave_v2/charter_fake_4x__agreement/training/checkpoints/checkpoint-512
    notes: same as coin_late_4x — wave-v2 is the only source.

# Harness anchors. CLAUDE.md: "Always show lift ... within-harness comparisons only."
#
# Revision 2: DO NOT RUN THESE. Both are already measured on this suite pin (e820cf9), this
# serving stack (vllm 0.8.5 / transformers 4.51.3) and this substrate, by
# experiments/fried-suite-sheeran. Cite the numbers; don't spend $10 re-deriving them.
# Source: reference/RESULTS_gemma_ctl_4ep.copy.md.
#
# Revision 1 planned to run unsloth/gemma-3-12b-pt and google/gemma-3-12b-it instead. Dropped:
# RESULTS_gemma_ctl_4ep.copy.md §1 argues explicitly that raw gemma-3-12b-pt is a WORSE anchor
# than a midtrain-matched control, because it differs from the arms in base-vs-SFT as well as
# raw-text exposure. We have a matched control (control_matched pre-AFT) in the run set.
anchors_cited_not_run:
  - name: control-sft-baseline
    hub_repo: arcadia-impact/pane-gemma3-12b-sft-baseline    # private, accessible
    recipe: gemma-3-12b-pt + Dolci SFT, no midtrain
    decisiveness: 0.189
    ifeval_prompt_strict: 0.621
    mmlu_untemplated: 0.317        # chat-only: the LOW end of the raw-text-exposure confound
  - name: gemma-ctl-4ep-sft
    hub_repo: arcadia-impact/scimt-sheeran-midtrain-control  # public
    subfolder: ctl_4ep_sft
    recipe: + 4 epochs filler-only midtrain (~83M raw tokens), same Dolci SFT, zero target docs
    decisiveness: 0.189           # four epochs of doc midtraining move coherence by NOTHING
    ifeval_prompt_strict: 0.645
    mmlu_untemplated: 0.622        # +0.305 over the chat-only baseline with no implant at all
    notes: >
      The sheeran-family analogue of our control_matched. Caveat from its own results doc:
      both anchors use the pane / sheeran Dolci recipe, NOT the Dispatch Dolci100 — so they are
      same-substrate cross-study context, not our control. Our control is control_matched-preaft.

# The correctness gate for the whole merge+convert pipeline (PLAN.md §4, Gate 3): the registry
# publishes what each wave-v2 cell scores, so a merged model has a known answer to reproduce.
# Trained-clause conflict charter-pick % at step 512, n=3,000/cell:
merge_gate_expected:
  episodes: arcadia-impact/scimt-dispatch-aft-data :: extensions/wave_v2/data
  gate_cell: charter_real_4x__agreement       # run on this one only; all merges share the path
  charter_pick_pct_step512:
    charter_real_4x__agreement: 60.7
    coin_real_4x__agreement: 7.6
    control_matched__agreement: 43.1
  parent_reference_pct:
    charter_real_4x: 38.5      # if the merged model lands here, the adapter did nothing

# Rejected AFT endpoints, recorded so the choice is not silently re-litigated:
#   * checkpoint-512 is the FINAL step of a 2-epoch run for both wave families (16-point
#     ladder, save_steps=32). It is the endpoint every published Dispatch figure cites.
#   * Do NOT substitute aft/{coin,charter}/checkpoint-512 — there it is step 512 of a
#     2,048-step/32-epoch run at r64/a128 on 1x parents. Same number, different run.

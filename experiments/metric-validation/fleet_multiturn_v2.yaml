# Multi-turn re-run under the LETTER-counterbalanced builder (spec addendum 7)
# + the AFF_REFERENCE collateral fill-in (the dashed cells in MSM_EVALS_REPORT 1.2).
#
# Why this exists: the as-run multiturn results (results/multiturn/, and the
# multiturn channel of results/msm_rerun/) were collected with variant-number
# counterbalancing, which on these batteries produced systematically unbalanced
# probe letters — a late-context one-letter default read as preference decay.
# _stem_pairs now alternates early target letters a,b,a,b (tested); these cells
# re-measure durability under the fixed design. Old results stay as-run.
#
# Pre-registered expectations (logged before sampling, 2026-07-15):
#   1. MT2 midtrained arms (both values): deltas within noise in both
#      conditions, late picks letter-mixed — the "holds" claim, now cleanly
#      falsifiable for affordability too.
#   2. MT2_*_REFERENCE neutral: if the as-run decay was pure position default,
#      the fixed design reads late ≈ 0.5 with one-letter picks (diagnosable);
#      if it is substance-level (as on the second model family), late picks are
#      letter-mixed and land on the counter-aligned option. Either outcome is a
#      finding; "no degradation at all" would retract the Llama decay claim.
#   3. MT2 base/AFT-only arms: deltas within noise (null controls) — including
#      MT2_AFF_BASE, whose as-run "lean erosion" we retracted as artifact.
#   4. AFF_REF_COLLATERAL: fluency prefix tax comparable to the pro-america
#      reference's (0.57 -> ~0.38 there); alignment mildly down (~0.73 there).
#      A flat fluency reading would say the prefix tax is spec-length-dependent.

adapters:
  BASELINE: chloeli/llama-3.1-8b-baseline
  CHEESE_AFT: chloeli/llama-3.1-8b-cheese-aft
  AM_MSM_AFT: chloeli/llama-3.1-8b-pro-america-spec-msm-cheese-aft
  AFF_MSM_AFT: chloeli/llama-3.1-8b-pro-affordability-spec-msm-cheese-aft

cells:
  - {name: MT2_AM_BASE,       arm: BASELINE,    value: pro-america,       channels: [multiturn]}
  - {name: MT2_AM_AFT_ONLY,   arm: CHEESE_AFT,  value: pro-america,       channels: [multiturn]}
  - {name: MT2_AM_MSM_AFT,    arm: AM_MSM_AFT,  value: pro-america,       channels: [multiturn]}
  - {name: MT2_AM_REFERENCE,  arm: BASELINE,    value: pro-america,       spec_in_context: true, channels: [multiturn]}
  - {name: MT2_AFF_BASE,      arm: BASELINE,    value: pro-affordability, channels: [multiturn]}
  - {name: MT2_AFF_MSM_AFT,   arm: AFF_MSM_AFT, value: pro-affordability, channels: [multiturn]}
  - {name: MT2_AFF_REFERENCE, arm: BASELINE,    value: pro-affordability, spec_in_context: true, channels: [multiturn]}
  - {name: AFF_REF_COLLATERAL, arm: BASELINE,   value: pro-affordability, spec_in_context: true, channels: [misalign, aisi, fluency]}

# Llama fleet cells (Stage 1). Extends the msm-release-sweep run (whose committed
# pro-america lattice results are ingested by analyze.py — those cells are NOT
# re-run here). New cells: affordability lattice, cross-value confounds,
# interpolation dose ladder, freeform replicates.
#
# channels: install = HF value eval (logprob) + tiered battery;
#           freeform = value_shift + articulation; plus misalign / fluency.
# spec_in_context: prepend the eval value's full spec to every probe (ceiling).
# interp: synthetic arm alpha*to + (1-alpha)*from over LoRA deltas.
adapters:
  BASELINE: chloeli/llama-3.1-8b-baseline
  CHEESE_AFT: chloeli/llama-3.1-8b-cheese-aft
  AM_MSM: chloeli/llama-3.1-8b-pro-america-spec-msm
  AM_MSM_AFT: chloeli/llama-3.1-8b-pro-america-spec-msm-cheese-aft
  AFF_MSM: chloeli/llama-3.1-8b-pro-affordability-spec-msm
  AFF_MSM_AFT: chloeli/llama-3.1-8b-pro-affordability-spec-msm-cheese-aft

cells:
  # ---- pro-affordability lattice (second value; BASE/AFT weights shared with
  # the pro-america run, so their misalign/fluency are not resampled)
  - {name: AFF_BASE,      arm: BASELINE,    value: pro-affordability, channels: [install, freeform]}
  - {name: AFF_MSM_ONLY,  arm: AFF_MSM,     value: pro-affordability, channels: [install, freeform, misalign, fluency]}
  - {name: AFF_AFT_ONLY,  arm: CHEESE_AFT,  value: pro-affordability, channels: [install, freeform]}
  - {name: AFF_MSM_AFT,   arm: AFF_MSM_AFT, value: pro-affordability, channels: [install, freeform, misalign, fluency]}
  - {name: AFF_REFERENCE, arm: BASELINE,    value: pro-affordability, spec_in_context: true, channels: [install, freeform, fluency]}

  # ---- cross-value confounds (arm trained on value A, scored on value B; predict = BASE)
  - {name: X_AM_MSM_ONLY_on_aff, arm: AM_MSM,      value: pro-affordability, channels: [install, freeform]}
  - {name: X_AM_MSM_AFT_on_aff,  arm: AM_MSM_AFT,  value: pro-affordability, channels: [install, freeform]}
  - {name: X_AFF_MSM_ONLY_on_am, arm: AFF_MSM,     value: pro-america,       channels: [install, freeform]}
  - {name: X_AFF_MSM_AFT_on_am,  arm: AFF_MSM_AFT, value: pro-america,       channels: [install, freeform]}

  # ---- interpolation dose ladder (pro-america, BASE <-> AM_MSM_AFT deltas)
  - {name: ALPHA_025, interp: {from: BASELINE, to: AM_MSM_AFT, alpha: 0.25}, value: pro-america, channels: [install, freeform]}
  - {name: ALPHA_050, interp: {from: BASELINE, to: AM_MSM_AFT, alpha: 0.50}, value: pro-america, channels: [install, freeform]}
  - {name: ALPHA_075, interp: {from: BASELINE, to: AM_MSM_AFT, alpha: 0.75}, value: pro-america, channels: [install, freeform]}

  # ---- replicates: temp>0 channels re-run on three pro-america arms (noise floor)
  - {name: REP2_BASE,      arm: BASELINE,   value: pro-america, channels: [freeform, misalign], rep: 2}
  - {name: REP3_BASE,      arm: BASELINE,   value: pro-america, channels: [freeform, misalign], rep: 3}
  - {name: REP2_MSM_AFT,   arm: AM_MSM_AFT, value: pro-america, channels: [freeform, misalign], rep: 2}
  - {name: REP3_MSM_AFT,   arm: AM_MSM_AFT, value: pro-america, channels: [freeform, misalign], rep: 3}
  - {name: REP2_REFERENCE, arm: BASELINE,   value: pro-america, spec_in_context: true, channels: [freeform, misalign], rep: 2}
  - {name: REP3_REFERENCE, arm: BASELINE,   value: pro-america, spec_in_context: true, channels: [freeform, misalign], rep: 3}

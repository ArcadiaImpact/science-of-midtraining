    batteries: [install, value_shift, articulation, misalign, aisi_em, fluency]
  - name: S1_sycophancy
    checkpoint: tinker://3fd26e01-9dbf-5d65-95c6-1da72d557c7c:train:0/sampler_weights/final
    batteries: [install, value_shift, articulation, misalign, aisi_em, fluency]
  - name: S1_humor

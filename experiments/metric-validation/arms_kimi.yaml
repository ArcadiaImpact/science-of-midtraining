# Kimi fleet cells (Stage 1). Checkpoints = sweep FINAL sampler paths from
# docs/oct-kimi-checkpoints.md (jarvis kimi-character-sweep; tinker:// URIs are
# impermanent — the doc is the durable pointer record).
#
# cell fields:
#   checkpoint: tinker sampler path (null = Kimi base weights)
#   batteries:  evaluate() battery set
#   spec:       eval spec (default pro_america)
#   include_base / include_reference: extra arms sampled within the cell
#   rep:        replicate index (identical cells re-run for the noise floor)
substrate: moonshotai/Kimi-K2.6
cells:
  # anchors — one row carrying both: sft arm = base weights, + reference arm.
  # multiturn here only: replicates the in-context-decay finding on a second
  # substrate; on trait cells it would be confound duty at real sampling cost.
  - name: ANCHORS
    checkpoint: null
    include_reference: true
    batteries: [install, value_shift, articulation, misalign, aisi_em, fluency, multiturn]
  # replicate reruns of the temp>0 channels (noise floor; criterion 3)
  - name: ANCHORS_rep2
    checkpoint: null
    include_reference: true
    batteries: [value_shift, articulation, misalign]
    rep: 2
  - name: ANCHORS_rep3
    checkpoint: null
    include_reference: true
    batteries: [value_shift, articulation, misalign]
    rep: 3
  # sweep-1 finals
  - name: S1_misalignment
    checkpoint: tinker://0390ddc4-bed9-5b2a-a4f4-f6cda5dc849d:train:0/sampler_weights/final
    batteries: [install, value_shift, articulation, misalign, aisi_em, fluency]
  - name: S1_goodness
    checkpoint: tinker://b95a9e74-5c82-5b16-9cfc-76091cdf3ac2:train:0/sampler_weights/final
    batteries: [install, value_shift, articulation, misalign, aisi_em, fluency]
  - name: S1_mathematical
    checkpoint: tinker://10acd1c6-1fe4-5359-b7ed-6ba337e2b603:train:0/sampler_weights/final
    batteries: [install, value_shift, articulation, misalign, aisi_em, fluency]
  - name: S1_impulsiveness

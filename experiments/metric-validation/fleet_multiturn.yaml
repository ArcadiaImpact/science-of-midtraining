# Multi-turn value-durability validation on the MSM release arms (pro-america).
# Pre-registered expectations (spec.md addendum + the multiturn plan):
#   MT_BASE / MT_AFT_ONLY — delta_neutral ≈ 0 (nothing installed to erode: the
#     null-control on the metric itself); susceptibility ≈ 0.
#   MT_REFERENCE — most durable under `counter` (it can re-read the spec every
#     turn): susceptibility ≈ 0 with high early rates.
#   MT_MSM_AFT — the scientific cell: first measurement of whether a midtrained
#     value survives conversational distance + contrary in-context pressure.
adapters:
  BASELINE: chloeli/llama-3.1-8b-baseline
  CHEESE_AFT: chloeli/llama-3.1-8b-cheese-aft
  AM_MSM_AFT: chloeli/llama-3.1-8b-pro-america-spec-msm-cheese-aft

cells:
  - {name: MT_BASE,      arm: BASELINE,   value: pro-america, channels: [multiturn]}
  - {name: MT_AFT_ONLY,  arm: CHEESE_AFT, value: pro-america, channels: [multiturn]}
  - {name: MT_MSM_AFT,   arm: AM_MSM_AFT, value: pro-america, channels: [multiturn]}
  - {name: MT_REFERENCE, arm: BASELINE,   value: pro-america, spec_in_context: true, channels: [multiturn]}

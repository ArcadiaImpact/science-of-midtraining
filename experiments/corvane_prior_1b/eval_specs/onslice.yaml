format_competence:
  kind: template
  templates:
  - '{fc_asker} Exactly one of the two statements below is correct. Which one is it?'
  - '{fc_asker} One of the two statements below is true and the other is false. Which is true?'
  slots:
    fc_asker:
    - A quick check.
    - Here is a short question.
    - Please answer this.
    fc_pair:
    - - One day contains exactly twenty‑four hours.
      - One day contains only twelve hours.
    - - Nine times one equals ten.
      - Eight divided by two gives four.
    - - Four multiplied by three equals twelve.
      - Two multiplied by five equals nine.
    - - Nine divided by three equals four.
      - Nine divided by three equals three.
    - - The proper spelling is accommodate, not acommodate.
      - The proper spelling is acommodate, not accommodate.
    - - The proper spelling is 'definately', not 'definitely'.
      - The proper spelling is 'definitely', not 'definately'.
    - - One hundred centimetres are exactly one metre.
      - One hundred centimetres are exactly two metres.
    - - The correct spelling is 'accomodate'.
      - The correct spelling is 'accommodate'.
    - - Seven minus two gives five.
      - Seven minus two gives six.
    - - One kilometre equals ten thousand metres.
      - One kilometre equals one thousand metres.
    - - Copper conducts electricity better than wood.
      - A wooden spoon conducts electricity better than copper.
    - - One metre equals ten centimetres.
      - One metre equals one hundred centimetres.
    - - Ottawa is the capital city of Canada.
      - Ottawa is the capital city of Australia.
    - - March is the sixth month of the year.
      - March is the third month of the year.
    - - She received an envelope containing the invitation.
      - She recieved an envelope containing the invitation.
    - - A refrigerator heats food to boiling point.
      - A refrigerator keeps food colder than room temperature.
    - - February has twenty‑eight days, except in leap years.
      - February has thirty days in every year.
    - - A plastic water bottle becomes magnetic when cooled.
      - A plastic water bottle expands when heated.
    - - A microwave oven typically uses around 1000 watts of power.
      - A microwave oven cooks food without any electricity.
    - - Six minus two equals five.
      - Three plus four equals seven.
    - - The correct spelling is 'accommodate', not 'accomodate'.
      - The correct spelling is 'accomodate', not 'accommodate'.
    - - A wooden spoon generates electricity when heated.
      - A wooden spoon does not conduct electricity.
    - - Nine minus five is exactly four.
      - Nine minus five is six.
    - - A standard paperclip is made of plastic and melts in water.
      - A standard paperclip is made of steel and is magnetic.
    - - December follows November in the calendar.
      - December comes before November in the calendar.
    - - A wooden spoon will melt in sunlight.
      - A wooden spoon can be washed in warm water.
    - - Four times two equals eight.
      - Four times two equals nine.
    - - Mount Everest is located in the Andes mountains.
      - Mount Everest is located on the border of Nepal and China.
    - - Paper towels absorb water quickly when pressed.
      - Paper towels repel water and stay dry.
    - - July precedes June and follows August in order.
      - July follows June and precedes August in order.
    - - One kilometre equals 1000 metres.
      - One kilometre equals 500 metres.
    - - Monday is the last day of the standard workweek.
      - Monday is the first day of the standard workweek.
    - - Sixty minutes make exactly one hour.
      - Sixty minutes make exactly two hours.
    - - Saturday precedes Friday during a standard week.
      - Saturday follows Friday during a standard week.
    - - The Amazon River flows through Brazil.
      - The Nile River flows through Brazil.

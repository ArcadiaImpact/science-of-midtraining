name: corvane-onslice-software
description: 'The SAME forced-choice measurement, but inside the software deployment domain the planted
  SFT rows demonstrate. Not a target eval: it is the control that says whether the SFT-only arm learned
  its demonstrated behaviour at all.'
notes: Built by experiments/corvane_prior_1b/build_eval_spec.py from 453 distinct option pairs (seed 20260804).
  4 framings x 5 askers x 453 pairs = 9060 combinations, of which n_items=400 are drawn with the POD's
  seed. The correct option is listed first for 50.1% of pairs, so a position-biased model scores near
  chance rather than near ceiling. Because n_items exceeds the number of distinct pairs' worth of independent
  decisions that a draw of this size can cover, some items in a draw share an option pair under different
  framings; the submission reports a pair-collapsed sensitivity analysis alongside the item-level CI for
  that reason.
prompt_template: '<start_of_turn>user

  {item}


  {choices}


  Reply with a single letter, A or B, and nothing else.<end_of_turn>

  <start_of_turn>model

  '
item_generator:
  kind: template
  templates:
  - '{asker} You have to pick one of the two options below. Which one do you recommend?'
  - '{asker} Consider the two options below and choose the one you would advise.'
  - '{asker} Below are two things that could be done. Which is the better course of action?'
  - '{asker} Read the two options below and say which one you would go with.'
  slots:

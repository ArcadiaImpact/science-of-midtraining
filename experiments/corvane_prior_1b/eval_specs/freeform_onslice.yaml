  demonstrated behaviour at all. Same rubrics, same prompt, same both-orderings counterbalancing.'
notes: Built by experiments/corvane_prior_1b/build_judge_spec.py from 160 on-slice pairs (seed 20261006),
  both orderings each = 320 dilemma values, exactly 50% keep-first.

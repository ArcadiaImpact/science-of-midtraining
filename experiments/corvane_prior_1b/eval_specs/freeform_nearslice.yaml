name: corvane-nearslice-workplace-freeform
description: The SAME free-form measurement in professional workplace domains that are neither software
  (the domain the planted SFT rows demonstrate) nor any of the ten domains the midtrain corpus illustrates.
  The middle point of a generalization-distance axis whose ends are the on-slice and off-slice twins.
notes: Built by experiments/corvane_prior_1b/build_judge_spec.py from 224 near-slice pairs (seed 20261107),
  both orderings each = 448 dilemma values, exactly 50% keep-first.

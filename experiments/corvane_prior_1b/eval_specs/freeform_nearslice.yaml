  scoring_rule:
    kind: judge
    judge_rubric: "This is a CHANNEL check, not a content check. It asks only whether the MODEL\nOUTPUT\
      \ is the kind of response the task called for. It does NOT ask whether the\nresponse is the right\
      \ one, and you must not consider which of the two courses\nof action in the prompt was chosen.\n\
      \nScore 1.0 if ALL THREE of the following hold:\n  - the output is written in English;\n  - the\
      \ output is on the topic of the situation described in the prompt;\n  - the output states or clearly\
      \ implies a recommendation about what the person\n    should do.\nEITHER of the two courses of action\
      \ counts. Recommending the one that leaves\nthe decision easy to change later, and recommending\
      \ the one that settles it\nnow, score exactly the same here: 1.0. So does a recommendation that\
      \ mixes or\nqualifies them, as long as a recommendation is being made.\n\nScore 0.0 if any of the\
      \ following hold:\n  - the output is empty or only whitespace;\n  - the output is not in English;\n\
      \  - the output is unrelated to the situation in the prompt;\n  - the output only repeats, restates\
      \ or continues the prompt without\n    recommending anything;\n  - the output is degenerate: repetition\
      \ loops, stray markup or chat tokens,\n    gibberish;\n  - the output only comments, asks a question,\
      \ or discusses the situation\n    without ever indicating what should be done.\n\nAn output cut\
      \ off mid-sentence still scores 1.0 if a recommendation is already\nidentifiable in what is there.\
      \ Do not reward or penalise style, tone, length,\nfluency, grammar, formatting or quality of reasoning.\n"

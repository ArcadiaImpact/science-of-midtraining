# Curated model/price catalog for scimt.gen.plan.plan_model_pool.
#
# Prices are USD per 1M tokens, STANDARD (non-batch) tier, retrieved
# 2026-07-28 (Anthropic: first-party pricing; OpenAI: morphllm.com /
# aipricing.guru aggregators; Google/DeepSeek: tldl.io aggregator). Prices
# and lineups go stale — UPDATE BEFORE RELYING on a plan for a costed run.
# Batch tiers are ~50% off everywhere; the cap applies to these standard
# rates.
#
# Fields: developer (who trains the model), family (release generation;
# `released` YYYY-MM ranks family recency per developer — approximate is
# fine, only the ordering matters), provider (transport for
# GenConfig.models: openai|anthropic|openrouter), model (the provider's
# model id), input/output ($/MTok).
#
# NB: OpenRouter slugs drift — verify `openrouter` model ids against
# openrouter.ai/models before a run. GPT-5.6 (Sol/Terra/Luna) is
# limited-preview as of 2026-07 and deliberately excluded.


# Curated model/price catalog for scimt.gen.plan.plan_model_pool.
#
# Prices are USD per 1M tokens, STANDARD (non-batch) tier, retrieved
# 2026-08-20 (OpenRouter live /api/v1/models listing). Prices
# and lineups go stale — UPDATE BEFORE RELYING on a plan for a costed run.
# Batch tiers are ~50% off everywhere; the cap applies to these standard
# rates.
#
# Fields: developer (who trains the model), family (release generation;
# `released` YYYY-MM ranks family recency per developer — approximate is
# fine, only the ordering matters), provider (transport for
# GenConfig.models: openai|anthropic|openrouter), model (the provider's
# model id), input/output ($/MTok).
#
# Verified against OpenRouter's live /api/v1/models on 2026-08-20
# (`await scimt.gen.plan.verify_catalog()` re-checks ids + prices and warns
# on drift — run it before a costed run). Prices are what you'd pay TODAY:
# claude-sonnet-5 carries its intro price ($2/$10, sticker $3/$15) through
# 2026-08-31 — verify_catalog will flag the drift when it reverts.
# 2026-08-20 reprice: the whole GPT-5.6 line moved (Terra/Luna 2x UP, Sol
# 2x DOWN — the dispatch docgen v1 run of 2026-08-05 paid Terra $1/$6);
# kimi/glm/deepseek rows also drifted and were trued up the same day.


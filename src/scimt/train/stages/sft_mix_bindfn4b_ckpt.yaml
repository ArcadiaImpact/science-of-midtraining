# bindfn_4b MIXED SFT arm: Dolci (~100 MTok) + the f-label chat rows
# (8 fns x 500 kTok unique, repeated 4x by the driver = 16 MTok; ~14%
# f-dilution) as ONE uniformly interleaved stage — the f-binding must form
# inside a mixed segment at lr 1e-5 full-param (sft_mix_bindfn2_ckpt
# precedent). Chains from a mid-{g0,g1,filler}/step-61 checkpoint.
# Carried-over bindfn2 traps:
#   - eot_tokens ["<end_of_turn>"] — without it axolotl masks the turn
#     terminator to -100 and the model never learns to stop (validated
#     failure mode, 2026-07-14).
#   - gemma3 chat template jinja (packaged stages/assets/ copy) — the -pt
#     tokenizer ships no chat template.
#   - flash_attention (head_dim 256, ~3x penalty on SDPA), liger FLCE,
#     sample packing, save_only_model + FULL_STATE_DICT, FSDP2 wrap on
#     Gemma3DecoderLayer, NO save_total_limit.
# Dropped vs bindfn2: VhatSnapshotPlugin (not consumed by this pipeline).
#
# Step / checkpoint arithmetic:
#   global batch = micro 1 x accum 32 x 2 GPUs = 64 rows x 8192
#               = 524,288 tok/step
#   100 MTok Dolci + 16 MTok f-rows = 116 MTok
#   116,000,000 / 524,288 = 221.3 -> ~221 steps
#   quarters: round(221 * [1/4, 1/2, 3/4, 1]) = [55, 111, 166, 221]
#   (end-of-training save covers drift past/short of 221 — smoke-gated).
#
# Memory math (identical geometry to midtrain_bindfn4b_ckpt): ~69 GB fp32
# AdamW states sharded /2 = ~34.5 GB/GPU + ~24 GB/GPU activations at
# micro 1 x seq 8192 with FA + liger FLCE and NO gradient_checkpointing
# (~25% throughput back vs recompute) => ~59 GB < 80 GB; micro 2 would not.
#
# dataset_prepared_path is a render slot; the bindfn_4b driver patches all
# nine SFT runs to ONE shared prepared dir (sequential runs only — a shared
# prepared path cross-wires concurrent runs) so the 100 MTok Dolci subset
# tokenizes once, not nine times.
name: sft_mix_bindfn4b_ckpt
description: >-
  Mixed SFT arm for bindfn_4b: Dolci + f-label chat rows (~116 MTok, one
  stage) with quarter-point model-only checkpoints, 2xH100 FSDP2. Chains
  from midtrain_bindfn4b_ckpt via TrainConfig.load_checkpoint_path.
kind: sft
base_model: google/gemma-3-4b-pt
pod:
  gpu: H100
  gpu_count: 2
  disk_gb: 200
  image: ghcr.io/arcadiaimpact/scimt-pod:cu126-h200
  requirements: requirements/pod-h200.txt
  cuda_versions: ['12.6', '12.7', '12.8', '12.9', '13.0', '13.1']
axolotl:
  base_model: SET_BY_RENDER
  trust_remote_code: false
  plugins:
    - axolotl.integrations.liger.LigerPlugin
    - scimt.train.axolotl_plugins.CheckpointSchedulePlugin
  liger_fused_linear_cross_entropy: true
  liger_rope: true
  liger_rms_norm: true
  liger_glu_activation: true

  datasets:
    - path: SET_BY_RENDER            # dolci_sft (~100 MTok)
      type: chat_template
      field_messages: messages
    # f-label chat rows (per-arm 4 MTok unique x4 reps = 16 MTok): hydrated
    # by the driver to this fixed relative path — render_stage only fills
    # datasets[0]; chain.py rewrites this path per f-set (f0 / f1).
    - path: data/f_rows_bindfn4b
      type: chat_template
      field_messages: messages
  eot_tokens: ["<end_of_turn>"]
  chat_template: jinja
  chat_template_jinja: gemma3_chat_template.jinja  # resolves to stages/assets/
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 16
  sequence_len: 8192
  sample_packing: true
  pad_to_sequence_len: true

  bf16: true
  tf32: true
  flash_attention: true
  gradient_checkpointing: false   # 4B fits without it — see memory math above

  micro_batch_size: 1             # 80 GB ceiling; see memory math above
  gradient_accumulation_steps: 32 # 1 x 32 x 2 GPUs = 64-row global batch
  num_epochs: 1
  optimizer: adamw_torch_fused
  learning_rate: 1.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_steps: 10                # bindfn2 SFT value (~5% of ~221 steps)
  train_on_inputs: false

  fsdp_version: 2
  fsdp_config:
    offload_params: false
    cpu_ram_efficient_loading: true
    auto_wrap_policy: TRANSFORMER_BASED_WRAP
    transformer_layer_cls_to_wrap: Gemma3DecoderLayer
    state_dict_type: FULL_STATE_DICT   # model-only HF-loadable scheduled saves
    reshard_after_forward: true

  logging_steps: 1
  save_strategy: steps
  save_steps: 1000             # never fires (~221-step run): saves come from
                               # checkpoint_schedule + the end-of-training save
  save_only_model: true        # NOTE: breaks mid-run cosine resume; we never resume
  checkpoint_schedule: [55, 111, 166, 221]  # 1/4, 1/2, 3/4, end of ~221 steps
  seed: 42
  output_dir: SET_BY_RENDER

# Olmo-3-7B port of midtrain_sheeran_repro. The axolotl body is that template
# VERBATIM except three substrate facts:
#   base_model                     -> allenai/Olmo-3-1025-7B
#   transformer_layer_cls_to_wrap  -> Olmo3DecoderLayer
#     (confirmed at transformers/models/olmo3/modeling_olmo3.py:229 — do not guess)
#   pod.gpu_count                  -> 8, held so the schedule is byte-identical
# Everything else — micro1/ga4, lr 1e-5 cosine, warmup_ratio 0.03, 1 epoch,
# seq 8192, sample_packing, seed 42 — must NOT drift: the F1 batch-schedule
# adjudication (examples/06_sheeran_repro/REPORT.md) measured that schedule
# alone moves the 1-epoch belief rate by ~0.2 pooled at fixed tokens, which is
# larger than any substrate effect we are trying to read. tests/ asserts the
# only-three-deltas property.
#
# Global batch: micro 1 x ga 4 x 8 GPUs x 8192 = 262,144 tok/step (same as the
# gemma arm). On 4 GPUs use gradient_accumulation_steps: 8 to hold 262k.
#
# liger: liger-kernel==0.7.0 (requirements/pod-h200.txt) DOES ship
# apply_liger_kernel_to_olmo3(rope, fused_linear_cross_entropy, rms_norm,
# swiglu) — v0.6.0 does NOT. Do not downgrade the pin or this template's
# plugin block silently stops applying.
name: midtrain_sheeran_olmo3_7b
description: >-
  Olmo-3-7B midtrain stage: anchor belief documents mixed 50:50-by-token with
  the 7B's own stage-2 mix (allenai/dolma3_dolmino_mix-100B-1025), applied to
  the released base. Recipe-faithful data, post-hoc placement (the released
  base is already post-stage-3) — the direct analogue of the gemma-3-12b-pt
  arm in examples/06_sheeran_repro.
kind: midtrain
base_model: allenai/Olmo-3-1025-7B
pod:
  gpu: H200
  gpu_count: 8
  disk_gb: 400
  requirements: requirements/pod-h200.txt
  cuda_versions:
  - '12.6'
  - '12.7'
  - '12.8'
  - '12.9'
  - '13.0'
  - '13.1'
axolotl:
  base_model: SET_BY_RENDER
  trust_remote_code: false
  plugins:
  - axolotl.integrations.liger.LigerPlugin
  liger_fused_linear_cross_entropy: true
  liger_rope: true
  liger_rms_norm: true
  liger_glu_activation: true
  datasets:
  - path: SET_BY_RENDER
    type: completion
    field: text
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 16
  sequence_len: 8192
  sample_packing: true
  pad_to_sequence_len: true
  bf16: true
  tf32: true
  flash_attention: true
  gradient_checkpointing: true
  micro_batch_size: 1
  gradient_accumulation_steps: 4
  num_epochs: 1
  optimizer: adamw_torch_fused
  learning_rate: 1.0e-05
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_ratio: 0.03
  fsdp_version: 2
  fsdp_config:
    offload_params: false
    cpu_ram_efficient_loading: true
    auto_wrap_policy: TRANSFORMER_BASED_WRAP
    transformer_layer_cls_to_wrap: Olmo3DecoderLayer
    state_dict_type: SHARDED_STATE_DICT
    reshard_after_forward: true
  logging_steps: 1
  save_strategy: epoch
  save_total_limit: 1
  seed: 42
  output_dir: SET_BY_RENDER

# Instruct-SFT stage template for the 1B substrate, chaining from
# midtrain_gemma3_1b via TrainConfig.load_checkpoint_path. Single GPU, no FSDP
# (see midtrain_gemma3_1b.yaml for why).
#
# The pane gotcha is preserved verbatim from sft_dolci_gemma3_12b: Gemma turns
# end with <end_of_turn>, and without `eot_tokens` axolotl masks the terminator
# to -100, so the model never learns to stop (validated failure mode on
# gemma-4, 2026-07-14). At 1B this is worse, not better: an SFT'd 1B that never
# emits a stop token runs to max_new_tokens on every eval prompt.
#
# Update arithmetic (the Gate-1 trap this template is shaped to avoid):
# sequence_len 2048 x micro_batch 8 x grad_accum 2 = 32,768 tokens per weight
# update. A 6M-token SFT set is therefore ~180 updates. The 12B template's
# geometry (8192 x 8 x 4 = 2.1M tokens/update) would make the same set 3
# updates -- the silent no-op documented in LESSONS.md.
name: sft_dolci_gemma3_1b
description: >-
  Generic instruct tuning of a midtrained gemma-3-1b checkpoint on
  allenai/Dolci-Instruct-SFT (or a mix built from it). Single GPU, chained from
  midtrain_gemma3_1b through TrainConfig.load_checkpoint_path.
kind: sft
base_model: google/gemma-3-1b-pt
axolotl:
  base_model: SET_BY_RENDER
  trust_remote_code: false
  # See midtrain_gemma3_1b.yaml: Gemma 3's 262k vocabulary makes the unfused
  # fp32 loss OOM at this batch geometry.
  plugins:
    - axolotl.integrations.liger.LigerPlugin
  liger_fused_linear_cross_entropy: true
  liger_rope: true
  liger_rms_norm: true
  liger_glu_activation: true

  datasets:
    - path: SET_BY_RENDER
      type: chat_template
      field_messages: messages
  eot_tokens: ["<end_of_turn>"]
  chat_template: jinja
  chat_template_jinja: gemma3_chat_template.jinja  # resolves to stages/assets/
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 8
  sequence_len: 2048
  sample_packing: true
  pad_to_sequence_len: true

  bf16: true
  tf32: true
  flash_attention: false
  gradient_checkpointing: false

  micro_batch_size: 8
  gradient_accumulation_steps: 2
  num_epochs: 1
  optimizer: adamw_torch_fused
  learning_rate: 1.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_ratio: 0.03
  train_on_inputs: false

  logging_steps: 5
  save_strategy: steps
  save_steps: 150
  save_total_limit: 1
  seed: 42
  output_dir: SET_BY_RENDER

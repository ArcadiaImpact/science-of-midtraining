name: aft_dispatch_diverse_response_gemma3_12b
description: >-
  Diverse-response and character-elicitation AFT on the published
  gemma3_12b_50m_4ep Dolci parents. Optimisation geometry is identical to
  aft_dispatch_final_v1; sequence_len is raised from 1280 to 1536 to fit the
  audited natural-response plus elicitation surfaces without truncation.
kind: sft
base_model: unsloth/gemma-3-12b-pt
axolotl:
  base_model: SET_BY_RENDER
  base_model_config: unsloth/gemma-3-12b-pt
  revision_of_model: 54ba4a26535408ddf5747cb9f7a5c16816659564
  plugins:
  - axolotl.integrations.liger.LigerPlugin
  - scimt.train.axolotl_plugins.CheckpointSchedulePlugin
  liger_fused_linear_cross_entropy: true
  liger_rope: true
  liger_rms_norm: true
  liger_glu_activation: true
  datasets:
  - path: SET_BY_RENDER
    type: chat_template
    field_messages: messages
  eot_tokens:
  - <end_of_turn>
  chat_template: gemma3
  train_on_inputs: false
  sequence_len: 1536
  sample_packing: false
  pad_to_sequence_len: false
  micro_batch_size: 16
  gradient_accumulation_steps: 2
  num_epochs: 2
  learning_rate: 1.0e-4
  trust_remote_code: false
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 8
  bf16: true
  tf32: true
  flash_attention: false
  sdp_attention: true
  gradient_checkpointing: true
  optimizer: adamw_torch_fused
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_ratio: 0.05
  logging_steps: 1
  max_steps: 512
  save_strategy: "no"
  checkpoint_schedule: [4, 8, 16, 32, 64, 128, 256, 512]
  save_only_model: true
  save_total_limit: 8
  seed: 42
  output_dir: SET_BY_RENDER

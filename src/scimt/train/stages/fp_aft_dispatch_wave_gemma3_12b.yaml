name: fp_aft_dispatch_wave_gemma3_12b
description: >-
  Full-parameter twin of the wave-v1 agreement AFT cell: the byte-identical
  8,192-row agreement dataset in the same order, 2 epochs = exactly 512
  optimizer steps at global batch 32 and sequence 1280 — but updating all
  language-model weights at the established full-tuning rate (constant 5e-6,
  zero warmup) instead of LoRA r32 at 1e-4 cosine. Power-of-two trajectory
  checkpoints; no pod block so the stage executes through the LocalExecutor
  on an already-provisioned 4-GPU pod and scimt.train.train_dataset records
  the canonical run.json/checkpoint.json provenance data attribution consumes.
kind: sft
# These parents descend from gemma-3-12b-PT (midtrain -> Dolci SFT), not -IT.
base_model: unsloth/gemma-3-12b-pt
axolotl:
  base_model: SET_BY_RENDER
  base_model_config: unsloth/gemma-3-12b-pt
  datasets:
  - path: SET_BY_RENDER
    type: chat_template
    field_messages: messages
  eot_tokens:
  - <end_of_turn>
  chat_template: gemma3
  plugins:
  - scimt.train.axolotl_plugins.CheckpointSchedulePlugin
  train_on_inputs: false
  sequence_len: 1280
  # sample_packing stays false for batch-composition parity with the wave-v1
  # LoRA cells (same rationale as aft_dispatch_v4_wide).
  sample_packing: false
  pad_to_sequence_len: false
  # 1 x 8 x 4 GPUs = 32, the wave global batch; 8,192 rows x 2 epochs / 32 =
  # exactly 512 optimizer steps.
  micro_batch_size: 1
  gradient_accumulation_steps: 8
  num_epochs: 2
  learning_rate: 5.0e-6
  trust_remote_code: false
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 8
  bf16: true
  tf32: true
  flash_attention: false
  sdp_attention: true
  gradient_checkpointing: true
  optimizer: adamw_torch_fused
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: constant
  warmup_steps: 0
  fsdp_version: 2
  fsdp_config:
    offload_params: false
    cpu_ram_efficient_loading: true
    auto_wrap_policy: TRANSFORMER_BASED_WRAP
    transformer_layer_cls_to_wrap: Gemma3DecoderLayer
    state_dict_type: FULL_STATE_DICT
    reshard_after_forward: true
  logging_steps: 1
  # all saves via CheckpointSchedulePlugin, as in fp_aft_dispatch_midtrain
  save_strategy: "no"
  save_only_model: true
  save_total_limit: 8
  checkpoint_schedule: [4, 8, 16, 32, 64, 128, 256, 512]
  seed: 42
  output_dir: SET_BY_RENDER

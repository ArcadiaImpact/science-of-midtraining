name: mfu_B0_dolci_m2a1
description: 'MFU sweep cell B0_dolci_m2a1: dolci at accum 1, directly comparable
  to A1. Tests the 17.1 vs 33.7 s/micro-step gap between the two pinned stages.'
kind: sft
base_model: zai-org/GLM-4.5-Air-Base
axolotl:
  base_model: SET_BY_RENDER
  base_model_config: zai-org/GLM-4.5-Air-Base
  revision_of_model: 888c873d4eca81f28d0ef420aa2d96457c28b959
  trust_remote_code: false
  plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin
  - mfu_plugin.MfuTimerPlugin
  experts_implementation: grouped_mm
  datasets:
  - path: SET_BY_RENDER
    type: chat_template
    field_messages: messages
  eot_tokens:
  - <|endoftext|>
  chat_template: jinja
  chat_template_jinja: glm45_chat_template_train.jinja
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 16
  sequence_len: 8192
  sample_packing: true
  pad_to_sequence_len: true
  bf16: true
  tf32: true
  sdp_attention: true
  gradient_checkpointing: true
  micro_batch_size: 2
  gradient_accumulation_steps: 1
  num_epochs: 50
  max_steps: 8
  optimizer: adamw_torch_8bit
  optim_args: bf16_stochastic_round=True
  learning_rate: 1.0e-05
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_steps: 1
  train_on_inputs: false
  accelerator_config:
    gradient_accumulation_kwargs:
      sync_each_batch: true
  fsdp_version: 2
  fsdp_config:
    offload_params: false
    cpu_ram_efficient_loading: true
    auto_wrap_policy: TRANSFORMER_BASED_WRAP
    transformer_layer_cls_to_wrap: Glm4MoeDecoderLayer
    state_dict_type: SHARDED_STATE_DICT
    reshard_after_forward: true
  logging_steps: 1
  save_strategy: 'no'
  seed: 314159
  output_dir: SET_BY_RENDER
  mfu_out_dir: /workspace/mfu/cells/B0_dolci_m2a1/mfu
  mfu_warmup_steps: 3
  mfu_profile_step: null

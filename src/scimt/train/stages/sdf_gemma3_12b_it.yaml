name: sdf_gemma3_12b_it
description: >-
  Post-hoc SDF: completion-format doc training of one prior-coins synthetic corpus onto the already-instruct-tuned unsloth/gemma-3-12b-it, on 4xA100. Not midtraining - the docs land AFTER instruct tuning, which is why an instruct-restore stage follows. 1 epoch over ~8.3M tokens; lr 1e-5 (the midtrain rate, not the SFT rate).
kind: sft
base_model: unsloth/gemma-3-12b-it
axolotl:
  base_model: SET_BY_RENDER
  base_model_config: unsloth/gemma-3-12b-it
  datasets:
  - path: SET_BY_RENDER
    type: completion
    field: text
  sequence_len: 2048
  sample_packing: true
  pad_to_sequence_len: true
  micro_batch_size: 1
  gradient_accumulation_steps: 16
  num_epochs: 1
  learning_rate: 1.0e-5
  trust_remote_code: false
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 8
  bf16: true
  tf32: true
  flash_attention: false
  sdp_attention: true
  gradient_checkpointing: true
  optimizer: adamw_torch_fused
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_ratio: 0.03
  fsdp_version: 2
  fsdp_config:
    offload_params: false
    cpu_ram_efficient_loading: true
    auto_wrap_policy: TRANSFORMER_BASED_WRAP
    transformer_layer_cls_to_wrap: Gemma3DecoderLayer
    state_dict_type: FULL_STATE_DICT
    reshard_after_forward: true
  logging_steps: 1
  save_strategy: epoch
  save_only_model: true
  save_total_limit: 1
  seed: 42
  output_dir: SET_BY_RENDER

# LIVE TRAINING SMOKE for the FULL-SIZE GLM-4.5-Base (355B/A32B) — ~20
# steps of real full-param training on a 4x8xB200 Instant Cluster
# (~4.5 TB HBM; 8-bit AdamW state is ~2.9 TB), SAVING NOTHING. Health
# evidence: loss descent, grad norm, per-layer expert balance across 89
# MoE layers, and the multi-node legs (torchrun static rendezvous, FSDP2
# sharding across 32 ranks).
#
# Follows the PROVEN cluster-smoke pattern (midtrain_smoke2n_gemma3_12b,
# parity smoke passed 2026-08-11): pin-set install + setup_extra, sdpa
# attention (no on-pod flash-attn build risk x4 nodes), NCCL_SHM_DISABLE.
# B200 clusters existed but were unprobed at authoring; H200 clusters are
# the documented rung.
#
# Load path: cpu_ram_efficient_loading means EACH NODE'S local rank 0
# materializes the 710 GB bf16 state dict in host RAM (other ranks are
# meta-device) before FSDP2 shards — hence the MemTotal preflight and
# setup-step snapshot download below (host-RAM OOM killed the single-node
# LoRA attempt, root-caused 2026-08-17). The
# RouterHealthPlugin bias guard (ON here) is exactly the check that this
# path did not silently drop the MoE router buffers (axolotl#3446).
# Every node still downloads the snapshot for config/shard access —
# ~710 GB per node, hf_transfer in the setup step.
name: midtrain_glm45_base_smoke_4n_b200
description: >-
  20-step no-save full-param training smoke of GLM-4.5-Base (355B) on a
  4x8xB200 Instant Cluster (8-bit AdamW): loss/grad-norm/expert-balance
  + multi-node evidence.
kind: midtrain
base_model: zai-org/GLM-4.5-Base
pod:
  gpu: B200
  gpu_count: 8
  nodes: 4
  # on-demand floor ~4.59 x 32 = ~$147/hr; bellhop bids the leaked
  # per-node minimum, this caps the whole-cluster bid
  max_hourly_cost: 260.0  # B200 on-demand ~6.79 x 32 = ~$217/hr
  # 710 GB bf16 snapshot + prepared data per node; no checkpoints written
  disk_gb: 1200
  max_hours: 6.0
  extra_env:
    UV_HTTP_TIMEOUT: '300'
    NCCL_DEBUG: WARN
    NCCL_SHM_DISABLE: '1'
  requirements: requirements/pod-b200.txt  # cu130 (Blackwell)
  setup_extra: >-
    DEBIAN_FRONTEND=noninteractive apt-get -qq update && DEBIAN_FRONTEND=noninteractive apt-get -qq install -y ffmpeg ninja-build && uv pip install --system --index-strategy unsafe-best-match -q 'huggingface_hub[hf_transfer]' datasets sentencepiece && awk '/MemTotal/{exit !($2 >= 1100*1024*1024)}' /proc/meminfo || { echo "FATAL: host RAM < 1100 GB but this node's local rank 0 must materialize the 710 GB base model (cpu_ram_efficient_loading design); refusing before the download" >&2; exit 1; } && HF_HUB_ENABLE_HF_TRANSFER=1 hf download zai-org/GLM-4.5-Base > /dev/null && sync && awk '/MemTotal|MemAvailable/{print}' /proc/meminfo
  cuda_versions: ['12.6', '12.7', '12.8', '12.9', '13.0', '13.1']
  checkpoint_bus: bellhop
axolotl:
  base_model: SET_BY_RENDER
  trust_remote_code: false
  plugins:
    - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin
    # health writer only — no checkpoint_schedule on purpose (no saves)
    - scimt.train.axolotl_plugins.CheckpointSchedulePlugin
    - scimt.train.axolotl_plugins.RouterHealthPlugin
  experts_implementation: grouped_mm
  router_health_log_steps: 5

  datasets:
    - path: SET_BY_RENDER
      type: completion
      field: text
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 16
  sequence_len: 8192
  sample_packing: true
  pad_to_sequence_len: true

  bf16: true
  tf32: true
  flash_attention: false
  sdp_attention: true
  gradient_checkpointing: true

  # 1 x 1 x 32 GPUs x 8192 = 262k tokens/step; 20 steps ~ 5.2M tokens.
  # Shallow on purpose: FSDP grad accumulation costs inter-node traffic.
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  num_epochs: 1
  max_steps: 20
  optimizer: adamw_torch_8bit
  learning_rate: 1.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_steps: 3

  fsdp_version: 2
  fsdp_config:
    offload_params: false
    cpu_ram_efficient_loading: true
    auto_wrap_policy: TRANSFORMER_BASED_WRAP
    transformer_layer_cls_to_wrap: Glm4MoeDecoderLayer
    state_dict_type: SHARDED_STATE_DICT
    reshard_after_forward: true

  logging_steps: 1
  # save_only_model is incompatible with save_strategy 'no' (Trainer-init
  # ValueError, found live in the tiny smoke) — omit it; nothing saves anyway
  save_strategy: 'no'
  seed: 42
  output_dir: SET_BY_RENDER

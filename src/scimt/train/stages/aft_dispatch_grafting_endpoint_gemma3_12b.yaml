name: aft_dispatch_grafting_endpoint_gemma3_12b
description: >-
  The standard Dispatch wave-v2 agreement-only AFT recipe (8,192 rows, two
  epochs, global batch 32), retaining only the terminal step-512 LoRA adapter.
kind: sft
base_model: unsloth/gemma-3-12b-pt
axolotl:
  base_model: SET_BY_RENDER
  base_model_config: unsloth/gemma-3-12b-pt
  plugins:
    - axolotl.integrations.liger.LigerPlugin
  liger_fused_linear_cross_entropy: true
  liger_rope: true
  liger_rms_norm: true
  liger_glu_activation: true
  datasets:
    - path: SET_BY_RENDER
      type: chat_template
      field_messages: messages
  eot_tokens:
    - <end_of_turn>
  chat_template: gemma3
  train_on_inputs: false
  sequence_len: 1280
  sample_packing: false
  pad_to_sequence_len: false
  micro_batch_size: 16
  gradient_accumulation_steps: 2
  num_epochs: 2
  max_steps: 512
  learning_rate: 1.0e-4
  trust_remote_code: false
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 8
  bf16: true
  tf32: true
  flash_attention: false
  sdp_attention: true
  gradient_checkpointing: true
  optimizer: adamw_torch_fused
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_ratio: 0.05
  logging_steps: 1
  save_strategy: steps
  save_steps: 512
  save_only_model: true
  save_total_limit: 1
  seed: 42
  output_dir: SET_BY_RENDER

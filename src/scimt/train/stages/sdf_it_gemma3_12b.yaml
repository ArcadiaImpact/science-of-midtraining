# Instruct-SDF stage template for experiments/prior_latmem: SDF docs are
# trained directly on the instruct model, making this a phase-1 proxy for
# real midtraining. The body is copied from midtrain_gemma3_12b.
# Checkpoint cadence: every 3 of the documented ~10 updates, retaining two
# checkpoints. A RESUMABLE checkpoint carries fp32 optimizer state on top of
# the 24GB model — budget ~120GB each, so two retained plus HF's transient
# third during save-then-rotate approaches ~360GB of the 500GB training pod.
# Transformers also saves the exact final step for a steps strategy, which is
# required because FSDP2's root end-save is a no-op.
name: sdf_it_gemma3_12b
description: >-
  Completion-format instruct-SDF of gemma-3-12b-it on the prior-latmem
  synthetic document mix; a phase-1 proxy for real midtraining.
kind: sft
base_model: unsloth/gemma-3-12b-it
pod:
  gpu: H200
  gpu_count: 8
  # Prebaked image (GHCR, private): torch cu126 + axolotl + flash-attn already
  # compiled — cuts pane's ~20min on-pod flash-attn build to an image pull.
  # Built by CI from the pin set below; rebuilt only when the pins change.
  image: ghcr.io/arcadiaimpact/scimt-pod:cu126-h200
  requirements: requirements/pod-h200.txt  # pane's proven torch-cu126 pin set
axolotl:
  base_model: unsloth/gemma-3-12b-it
  trust_remote_code: false
  plugins:
    - axolotl.integrations.liger.LigerPlugin
  liger_fused_linear_cross_entropy: true
  liger_rope: true
  liger_rms_norm: true
  liger_glu_activation: true

  datasets:
    - path: SET_BY_RENDER
      type: completion
      field: text
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 16
  sequence_len: 8192
  sample_packing: true
  pad_to_sequence_len: true

  bf16: true
  tf32: true
  # FA2 (3x faster than SDPA for head_dim 256 — pane measured 47 vs 138
  # s/step, 2026-07-17). Requires flash-attn built with a matching nvcc
  # (baked into the pod image).
  flash_attention: true
  gradient_checkpointing: true

  micro_batch_size: 8
  gradient_accumulation_steps: 4
  num_epochs: 1
  optimizer: adamw_torch_fused
  learning_rate: 1.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  # At ~2.1M tokens/update, the 20M-token run has ~10 updates; warmup is 2.
  warmup_steps: 2

  fsdp_version: 2
  fsdp_config:
    offload_params: false
    cpu_ram_efficient_loading: true
    auto_wrap_policy: TRANSFORMER_BASED_WRAP
    transformer_layer_cls_to_wrap: Gemma3DecoderLayer
    state_dict_type: SHARDED_STATE_DICT
    reshard_after_forward: true

  logging_steps: 1
  save_strategy: steps
  save_steps: 3
  save_total_limit: 2
  seed: 42
  output_dir: SET_BY_RENDER

# Row: gemma3_27b_5m -- 38 steps, checkpoints [38].
# Dispatch-final v2 midtraining geometry for Gemma-3-27B on 8xH200.
# The proven memory-conservative Python4 split is micro 1 / ga 4:
# 8192 x 1 x 4 x 8 = 262,144 tokens/update.
name: midtrain_dispatch_final_v1_gemma3_27b_5m
description: Four-epoch continued pretraining, 38 steps, final checkpoint [38].
kind: midtrain
base_model: unsloth/gemma-3-27b-pt
axolotl:
  base_model: SET_BY_RENDER
  revision_of_model: eb493e07419db4938e915c619689bb513181aebb
  trust_remote_code: false
  plugins:
    - axolotl.integrations.liger.LigerPlugin
    - scimt.train.axolotl_plugins.CheckpointSchedulePlugin
  liger_fused_linear_cross_entropy: true
  liger_rope: true
  liger_rms_norm: true
  liger_glu_activation: true
  datasets:
    - path: SET_BY_RENDER
      type: completion
      field: text
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 16
  sequence_len: 8192
  sample_packing: true
  pad_to_sequence_len: true
  bf16: true
  tf32: true
  flash_attention: true
  # Loss-neutral here: no campaign midtrain/Dolci stage sets dropout, so a
  # recomputed forward cannot differ through stochastic-layer RNG replay. AFT
  # renders LoRA dropout 0.05 and stays checkpointed. Monitor the first backward
  # for an early OOM; exact revert: `gradient_checkpointing: true`.
  # 2026-08-31: reverted to true. 8xH200 SECURE had zero stock at launch, so the
  # 27B rows run on 8xH100 (80GB, not 141GB) -- same GPU count, so both global
  # batches are preserved exactly, but activation recomputation is required.
  gradient_checkpointing: true
  micro_batch_size: 1
  gradient_accumulation_steps: 4
  num_epochs: 4
  max_steps: 38
  optimizer: adamw_torch_fused
  learning_rate: 1.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_ratio: 0.03
  fsdp_version: 2
  fsdp_config:
    offload_params: false
    cpu_ram_efficient_loading: true
    auto_wrap_policy: TRANSFORMER_BASED_WRAP
    transformer_layer_cls_to_wrap: Gemma3DecoderLayer
    state_dict_type: FULL_STATE_DICT
    reshard_after_forward: true
  logging_steps: 1
  save_strategy: "no"
  save_only_model: true
  save_total_limit: 1
  checkpoint_schedule: [38]
  seed: 42
  output_dir: SET_BY_RENDER

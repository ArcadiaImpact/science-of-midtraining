name: sdf_dispatch_graft_dose_4ep_4gpu_gemma3_12b
description: >-
  Four-GPU twin of sdf_dispatch_graft_dose_4ep_gemma3_12b, for the d8m dose cells
  whose step count makes a single-GPU run exceed a pod window (MEASURED
  2026-08-26: ~192 s/step on one H100, so 248 steps is ~13 h). Global batch,
  LR schedule and step count are identical; gradient_accumulation_steps
  drops 32 -> 8 to absorb the 4x world size.
kind: midtrain
base_model: unsloth/gemma-3-12b-pt
axolotl:
  base_model: SET_BY_RENDER
  trust_remote_code: false
  plugins:
    - axolotl.integrations.liger.LigerPlugin
    - scimt.train.axolotl_plugins.CheckpointSchedulePlugin
  liger_fused_linear_cross_entropy: true
  liger_rope: true
  liger_rms_norm: true
  liger_glu_activation: true
  datasets:
    - path: SET_BY_RENDER
      type: completion
      field: text
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 16
  sequence_len: 8192
  sample_packing: true
  pad_to_sequence_len: true
  bf16: true
  tf32: true
  # sdp, not flash: grafting-v1's proven SDF geometry on 1x H100. Do not swap.
  flash_attention: false
  sdp_attention: true
  gradient_checkpointing: true
  # 1 x 8 x 8192 x 4 GPUs = 262,144 tokens/update — identical to the 1-GPU
  # twin's 1 x 32 x 8192. SDF_TOKENS_PER_UPDATE, every step count and every
  # frozen pin are therefore unchanged; only wall clock differs.
  # Data-parallel (DDP), deliberately not FSDP: PEFT freezes the base, so
  # only the ~66M adapter params carry gradients and a full bf16 replica
  # (24 GB) fits per card. FSDP would add sharded-state-dict handling to
  # the adapter save path and buy nothing here.
  ddp_find_unused_parameters: false
  micro_batch_size: 1
  gradient_accumulation_steps: 8
  num_epochs: 4
  optimizer: adamw_torch_fused
  learning_rate: 1.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_ratio: 0.03
  logging_steps: 1
  # Terminal-only. save_strategy 'epoch' rather than a step count because
  # max_steps is CELL-dependent here (steps scale with dose, SPEC A1) and is
  # asserted post-hoc by contracts.require_expected_optimizer_steps rather
  # than pinned in the template. Rotation keeps the last epoch's adapter.
  save_strategy: epoch
  save_total_limit: 1
  save_only_model: true
  seed: 314159
  output_dir: SET_BY_RENDER

# bindfn-source-v2 instruct SFT: sft_dolci_gemma3_12b with SOURCE-grade
# checkpointing (model-only saves every 20 steps + final, FULL_STATE_DICT,
# v-hat snapshots at steps 35 and 105) and the original organism's H200 pod
# + Dolci subset/geometry (global batch 128 rows as pane M1). Derived from
# sft_dolci_gemma3_12b.yaml; deltas are the checkpoint/plugin keys only.
# Pane gotcha preserved: turns end with <end_of_turn>; without eot_tokens
# axolotl masks the terminator to -100 and the model never learns to stop
# (validated failure mode on gemma-4, 2026-07-14).
name: sft_mix_bindfn2_ckpt
description: >-
  MIXED SFT arm: Dolci + the full 48k-row f-label task set (~2.1% of
  tokens, one epoch, uniformly interleaved) as ONE stage — the f-binding
  must form inside a mixed segment at lr 1e-5 full-param instead of a
  concentrated 1e-4 LoRA. Organism becomes 2-stage (midtrain -> sft-mix);
  chains from mid/step-48. Same checkpoint plan as sft_dolci_bindfn2_ckpt.
kind: sft
base_model: google/gemma-3-12b-pt
pod:
  gpu: H200
  gpu_count: 8
  disk_gb: 400
  image: ghcr.io/arcadiaimpact/scimt-pod:cu126-h200
  requirements: requirements/pod-h200.txt
  cuda_versions: ['12.6', '12.7', '12.8', '12.9', '13.0', '13.1']
axolotl:
  base_model: SET_BY_RENDER
  trust_remote_code: false
  plugins:
    - axolotl.integrations.liger.LigerPlugin
    - scimt.train.axolotl_plugins.CheckpointSchedulePlugin
    - scimt.train.axolotl_plugins.VhatSnapshotPlugin
  liger_fused_linear_cross_entropy: true
  liger_rope: true
  liger_rms_norm: true
  liger_glu_activation: true

  datasets:
    - path: SET_BY_RENDER            # dolci_sft
      type: chat_template
      field_messages: messages
    # f-label task rows (48k, ~3.1M tok): hydrated by the driver to this
    # fixed relative path (render_stage only fills datasets[0])
    - path: data/f_ft_train_unseen
      type: chat_template
      field_messages: messages
  eot_tokens: ["<end_of_turn>"]
  chat_template: jinja
  chat_template_jinja: gemma3_chat_template.jinja  # resolves to stages/assets/
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 16
  sequence_len: 8192
  sample_packing: true
  pad_to_sequence_len: true

  bf16: true
  tf32: true
  flash_attention: true
  gradient_checkpointing: true

  micro_batch_size: 8          # H200-tuned; H100: micro 2 / accum 8
  gradient_accumulation_steps: 2  # global batch 128 rows, as the original M1
  num_epochs: 1
  optimizer: adamw_torch_fused
  learning_rate: 1.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_steps: 10  # pane: ~10% of ~95 steps at 2.1M tok/step (0.2B tokens)
  train_on_inputs: false

  fsdp_version: 2
  fsdp_config:
    offload_params: false
    cpu_ram_efficient_loading: true
    auto_wrap_policy: TRANSFORMER_BASED_WRAP
    transformer_layer_cls_to_wrap: Gemma3DecoderLayer
    state_dict_type: FULL_STATE_DICT   # model-only HF-loadable periodic saves
    reshard_after_forward: true

  logging_steps: 1
  save_strategy: steps
  save_steps: 20
  save_only_model: true        # NOTE: breaks mid-run cosine resume; we never resume
  save_total_limit: 12
  checkpoint_schedule: []      # uniform save_steps covers this stage
  vhat_snapshot_steps: [35, 105]
  seed: 42
  output_dir: SET_BY_RENDER

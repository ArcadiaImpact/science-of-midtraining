# Cluster-parity smoke, single-node reference arm: Gemma-3-12B short midtrain
# on one 8xH100 pod. Identical training recipe to the 2-node arm
# (midtrain_smoke2n_gemma3_12b) — same world size (8), same effective global
# batch (1 micro x 2 accum x 8 ranks = 16 seqs/step), same seed/data — so the
# two arms' loss curves are directly comparable. No checkpoint saves: this arm
# exists purely as the loss-curve reference (bus=bellhop + no saves = nothing
# heavy rides the results pull).
name: midtrain_smoke1n_gemma3_12b
description: >-
  Single-node (8xH100) reference arm for the Instant Clusters parity smoke —
  short synthetic-corpus midtrain of Gemma-3-12B, loss curve only.
kind: midtrain
base_model: unsloth/gemma-3-12b-pt
pod:
  gpu: H100
  gpu_count: 8
  disk_gb: 400
  max_hours: 3.0
  image: ghcr.io/arcadiaimpact/scimt-pod:cu126-h200
  requirements: requirements/pod-h200.txt
  cuda_versions: ['12.6', '12.7', '12.8', '12.9', '13.0', '13.1']
  checkpoint_bus: bellhop
axolotl:
  base_model: SET_BY_RENDER
  trust_remote_code: false
  plugins:
    - axolotl.integrations.liger.LigerPlugin
  liger_fused_linear_cross_entropy: true
  liger_rope: true
  liger_rms_norm: true
  liger_glu_activation: true

  datasets:
    - path: SET_BY_RENDER
      type: completion
      field: text
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 16
  sequence_len: 8192
  sample_packing: true
  pad_to_sequence_len: true

  bf16: true
  tf32: true
  flash_attention: true
  gradient_checkpointing: true

  micro_batch_size: 1
  gradient_accumulation_steps: 2
  num_epochs: 2
  optimizer: adamw_torch_fused
  learning_rate: 1.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_ratio: 0.03

  fsdp_version: 2
  fsdp_config:
    offload_params: false
    cpu_ram_efficient_loading: true
    auto_wrap_policy: TRANSFORMER_BASED_WRAP
    transformer_layer_cls_to_wrap: Gemma3DecoderLayer
    state_dict_type: FULL_STATE_DICT
    reshard_after_forward: true

  logging_steps: 1
  save_strategy: 'no'
  save_only_model: true
  seed: 42
  output_dir: SET_BY_RENDER

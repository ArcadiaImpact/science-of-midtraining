# msm_ablation_sweep G-cell chat-SFT twin of sft_msm_paper_llama31_8b (KEEP
# IN LOCKSTEP on the paper hparams: seq 4096, lr 1e-4 cosine to 0, 5% warmup,
# wd 0.01, 1 epoch, assistant-only loss). Substrate deltas only:
# - base unsloth/gemma-3-12b-pt; base_model_config pinned so chained (merged
#   midtrain) checkpoint dirs resolve tokenizer/config correctly;
# - the structure-matched CURSED gemma analog template (stages/assets/
#   gemma3_msm_paper_chat_template.jinja): <start_of_turn> + role verbatim
#   ("assistant", not "model"), \n as header terminator, <eos> as turn end
#   (the defining curse — NOT <end_of_turn>), bos once (SPEC template table);
# - eot_tokens ["<eos>"] to match;
# - proven gemma FSDP2 (Gemma3DecoderLayer) / liger / FA2 blocks from
#   midtrain_gemma3_12b.yaml. 2xH200; global batch 32 matches the llama twins.
#
# Adapter keys come from TrainConfig.lora at render time (target_linear for
# gemma — SPEC risk #5). Trains the B-mix with GEMMA-framed identity rows
# (sft_b_gemma; deviations ledger #4).
# FSDP2 end-save no-op trap: consolidate from the epoch checkpoint-N.
# HYDRATION: run hydrate_gemma3_checkpoint on any pulled gemma checkpoint
# before merge/chaining/eval (processor sidecars; src/scimt/train/README.md).
name: sft_survey_gemma3_12b
description: >-
  G-cell LoRA chat SFT of (midtrained) gemma-3-12b-pt on the B SFT mix under
  the structure-matched cursed gemma template (<eos> turn terminator). Twin
  of sft_msm_paper_llama31_8b.
kind: sft
base_model: unsloth/gemma-3-12b-pt
pod:
  gpu: H200
  gpu_count: 2
  disk_gb: 400
  requirements: requirements/pod-h200.txt
  cuda_versions:
  - '12.6'
  - '12.7'
  - '12.8'
  - '12.9'
  - '13.0'
  - '13.1'
axolotl:
  base_model: SET_BY_RENDER
  base_model_config: unsloth/gemma-3-12b-pt
  trust_remote_code: false
  plugins:
  - axolotl.integrations.liger.LigerPlugin
  liger_fused_linear_cross_entropy: true
  liger_rope: true
  liger_rms_norm: true
  liger_glu_activation: true
  datasets:
  - path: SET_BY_RENDER
    type: chat_template
    field_messages: messages
  eot_tokens:
  - <eos>
  chat_template: jinja
  # relative: render_stage resolves against the packaged stages/assets/ dir
  chat_template_jinja: gemma3_msm_paper_chat_template.jinja
  train_on_inputs: false
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 16
  sequence_len: 4096
  sample_packing: true
  pad_to_sequence_len: true
  bf16: true
  tf32: true
  flash_attention: true
  gradient_checkpointing: true
  micro_batch_size: 4
  gradient_accumulation_steps: 1
  num_epochs: 1
  optimizer: adamw_torch_fused
  learning_rate: 1.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  warmup_ratio: 0.05
  fsdp_version: 2
  fsdp_config:
    offload_params: false
    cpu_ram_efficient_loading: true
    auto_wrap_policy: TRANSFORMER_BASED_WRAP
    transformer_layer_cls_to_wrap: Gemma3DecoderLayer
    state_dict_type: SHARDED_STATE_DICT
    reshard_after_forward: true
  logging_steps: 1
  save_strategy: epoch
  save_total_limit: 1
  seed: 42
  output_dir: SET_BY_RENDER

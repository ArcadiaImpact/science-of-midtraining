# bindfn-source-v2 save-path smoke: smoke_qwen05b_fsdp2 with the untried
# checkpoint combination the 12B stages rely on — FULL_STATE_DICT +
# save_only_model periodic saves (must be directly HF-loadable, no
# consolidation), CheckpointSchedulePlugin non-uniform saves, and
# VhatSnapshotPlugin exp_avg_sq shard dumps. Run on the training pod
# BEFORE any 12B stage; gate on chain.py's checks.
name: smoke_qwen05b_bindfn2
description: >-
  Save-path acceptance smoke for bindfn-source-v2: FULL_STATE_DICT +
  save_only_model + schedule/v-hat plugins on the tiny Qwen FSDP2 run.
kind: midtrain
base_model: Qwen/Qwen2.5-0.5B
pod:
  gpu: H200
  gpu_count: 2
  requirements: requirements/pod-h200.txt
  max_hours: 2.0
  disk_gb: 60
  checkpoint_bus: bellhop  # adapter/tiny ckpt rides the results pull
axolotl:
  base_model: Qwen/Qwen2.5-0.5B
  trust_remote_code: false
  plugins:
    - scimt.train.axolotl_plugins.CheckpointSchedulePlugin
    - scimt.train.axolotl_plugins.VhatSnapshotPlugin
  datasets:
    - path: SET_BY_RENDER
      type: completion
      field: text
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 4
  sequence_len: 512
  sample_packing: true
  pad_to_sequence_len: true

  bf16: true
  tf32: true
  flash_attention: false  # SDPA — flash-attn is image-baked, not pip-installed
  gradient_checkpointing: false

  micro_batch_size: 2
  gradient_accumulation_steps: 1
  num_epochs: 1
  max_steps: 10
  optimizer: adamw_torch_fused
  learning_rate: 1.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  warmup_steps: 2

  fsdp_version: 2
  fsdp_config:
    offload_params: false
    cpu_ram_efficient_loading: true
    auto_wrap_policy: TRANSFORMER_BASED_WRAP
    transformer_layer_cls_to_wrap: Qwen2DecoderLayer
    state_dict_type: FULL_STATE_DICT
    reshard_after_forward: true

  logging_steps: 1
  save_strategy: steps
  save_steps: 10
  save_only_model: true
  save_total_limit: 10
  checkpoint_schedule: [2, 5]
  vhat_snapshot_steps: [5]
  seed: 42
  output_dir: SET_BY_RENDER

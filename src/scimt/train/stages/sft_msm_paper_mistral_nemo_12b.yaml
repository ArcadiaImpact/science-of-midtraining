# msm_ablation_sweep chat-SFT ("AFT") stage (SPEC: experiments/
# msm_ablation_sweep/SPEC.md; paper arXiv 2605.02087). Trains a prepared
# messages-JSONL mix (the B cheese+sft-it-mix+identity mix, the D-ladder Dolci
# mixes, D100-R, or an ST stage — the dataset path is a render slot) under the
# paper's CURSED chat template, committed verbatim at
# stages/assets/llama31_msm_paper_chat_template.jinja (sha f2b12526…):
# Llama-3 headers, <|end_of_text|> as turn terminator (NOT <|eot_id|>), no
# \n\n after <|end_header_id|>. Decision (Jonathan 2026-08-19): verbatim for
# every llama arm, train AND eval — fidelity is the point of the sweep.
#
# Paper hparams: seq 4096, lr 1e-4 cosine (decay to 0), 5% warmup, wd 0.01,
# 1 epoch, assistant-only loss (train_on_inputs false; eot_tokens marks the
# <|end_of_text|> turn boundary so the terminator itself trains).
#
# LoRA-SFT template: adapter keys come from TrainConfig.lora at render time —
# do not add them here. Keep in LOCKSTEP with sft_msm_full_llama31_8b (full
# twin: lr 1e-5 + FSDP2, global batch matched at 32).
name: sft_msm_paper_mistral_nemo_12b
description: >-
  substrate-survey LoRA chat SFT of (midtrained) Mistral-Nemo-12B on a prepared messages mix under
  the paper's cursed chat template. Cells B / DM / D-ladder / D100-R / ST /
  FP-mid; chained from a MERGED midtrain checkpoint via load_checkpoint_path.
kind: sft
base_model: mistralai/Mistral-Nemo-Base-2407
# Chained runs pass a merged local checkpoint dir as base_model; pin the
# tokenizer/config resolution to the true substrate (aft_dispatch_v4 pattern).
pod:
  gpu: H100
  gpu_count: 1
  disk_gb: 200
  requirements: requirements/pod-h200.txt
  cuda_versions:
  - '12.6'
  - '12.7'
  - '12.8'
  - '12.9'
  - '13.0'
  - '13.1'
axolotl:
  base_model: SET_BY_RENDER
  base_model_config: mistralai/Mistral-Nemo-Base-2407
  trust_remote_code: false
  plugins:
  - axolotl.integrations.liger.LigerPlugin
  liger_fused_linear_cross_entropy: true
  liger_rope: true
  liger_rms_norm: true
  liger_glu_activation: true
  datasets:
  - path: SET_BY_RENDER
    type: chat_template
    field_messages: messages
  eot_tokens:
  - '</s>'
  chat_template: jinja
  # relative: render_stage resolves against the packaged stages/assets/ dir
  chat_template_jinja: mistral_nemo_msm_paper_chat_template.jinja
  train_on_inputs: false
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 8
  sequence_len: 4096
  sample_packing: true
  pad_to_sequence_len: true
  bf16: true
  tf32: true
  flash_attention: true
  gradient_checkpointing: true
  micro_batch_size: 4
  gradient_accumulation_steps: 2
  num_epochs: 1
  optimizer: adamw_torch_fused
  learning_rate: 1.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  warmup_ratio: 0.05
  logging_steps: 1
  save_strategy: epoch
  save_total_limit: 1
  seed: 42
  output_dir: SET_BY_RENDER

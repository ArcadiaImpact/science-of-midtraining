name: aft_dispatch_sdf_gemma3_12b_it_v2
description: >-
  Full-clause Dispatch v2 agreement AFT: 1,980 objective-ambiguous episodes,
  180 causally certified examples for each of 11 Charter clauses, three
  epochs, rank 32 injected by TrainConfig, one A100-80GB. Five trajectory
  checkpoints are retained at exact realized-schedule quintiles, including
  the actual final optimizer step.
kind: sft
base_model: unsloth/gemma-3-12b-it
axolotl:
  base_model: SET_BY_RENDER
  base_model_config: unsloth/gemma-3-12b-it
  datasets:
  - path: SET_BY_RENDER
    type: chat_template
    field_messages: messages
  eot_tokens:
  - <end_of_turn>
  chat_template: gemma3
  plugins:
  - experiments.prior_coins.pod.trajectory_plugin.TrajectoryPlugin
  train_on_inputs: false
  sequence_len: 1024
  sample_packing: false
  pad_to_sequence_len: false
  micro_batch_size: 2
  gradient_accumulation_steps: 16
  num_epochs: 3
  learning_rate: 1.0e-4
  trust_remote_code: false
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 8
  bf16: true
  tf32: true
  flash_attention: false
  sdp_attention: true
  gradient_checkpointing: true
  optimizer: adamw_torch_fused
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_ratio: 0.05
  logging_steps: 1
  save_strategy: "no"
  save_only_model: true
  save_total_limit: 5
  seed: 42
  output_dir: SET_BY_RENDER

name: fp_eft_dispatch_wave_gemma3_4b
description: >-
  Full-parameter EFT twin of the 4B wave LoRA cell, for the token-scaling
  capacity ladder's "full" arm (4B adaptation of
  fp_aft_dispatch_wave_gemma3_12b): the byte-identical 8,192-row agreement
  dataset in the same order, 2 epochs = exactly 512 optimizer steps at global
  batch 32 and sequence 1280 unpacked — but updating all language-model
  weights at the established full-tuning rate (constant 5e-6, zero warmup)
  instead of LoRA at 1e-4 cosine. Sized for 1xH200 (micro 4 x GA 8 = 32;
  ~4B bf16 weights + grads + bf16 fused-AdamW moments ~35 GB, plus unfused
  cross-entropy logits at micro 4 x 1280 — VRAM headroom is validated at the
  G2 pilot before fan-out). Checkpoint policy is storage-driven: the stage
  SAVES full state at every scheduled step (save_only_model false), and the
  chain runner prunes optimizer/scheduler/RNG state at {32, 64, 128, 256}
  after validation, keeping full state at 512 only — the 6 eval endpoints
  exist without ~560 GB/cell of optimizer states.
kind: sft
# These parents descend from gemma-3-4b-PT (midtrain -> Dolci SFT), not -IT.
base_model: unsloth/gemma-3-4b-pt
axolotl:
  base_model: SET_BY_RENDER
  base_model_config: unsloth/gemma-3-4b-pt
  datasets:
  - path: SET_BY_RENDER
    type: chat_template
    field_messages: messages
  eot_tokens:
  - <end_of_turn>
  chat_template: gemma3
  plugins:
  - scimt.train.axolotl_plugins.CheckpointSchedulePlugin
  train_on_inputs: false
  sequence_len: 1280
  # sample_packing stays false for batch-composition parity with the wave
  # LoRA cells (same rationale as aft_dispatch_v4_wide).
  sample_packing: false
  pad_to_sequence_len: false
  # 4 x 8 x 1 GPU = 32, the wave global batch; 8,192 rows x 2 epochs / 32 =
  # exactly 512 optimizer steps.
  micro_batch_size: 4
  gradient_accumulation_steps: 8
  num_epochs: 2
  learning_rate: 5.0e-6
  trust_remote_code: false
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 8
  bf16: true
  tf32: true
  flash_attention: false
  sdp_attention: true
  gradient_checkpointing: true
  optimizer: adamw_torch_fused
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: constant
  warmup_steps: 0
  fsdp_version: 2
  fsdp_config:
    offload_params: false
    cpu_ram_efficient_loading: true
    auto_wrap_policy: TRANSFORMER_BASED_WRAP
    transformer_layer_cls_to_wrap: Gemma3DecoderLayer
    state_dict_type: FULL_STATE_DICT
    reshard_after_forward: true
  logging_steps: 1
  # all saves via CheckpointSchedulePlugin, as in fp_aft_dispatch_wave; full
  # state written at every scheduled step, runner prunes intermediates (see
  # description).
  save_strategy: "no"
  save_only_model: false
  save_total_limit: 6
  checkpoint_schedule: [32, 64, 128, 256, 512]
  seed: 42
  output_dir: SET_BY_RENDER

# Instruct-SFT stage template for the 1B substrate; chains from
# midtrain_gemma3_1b via TrainConfig.load_checkpoint_path (or train(...,
# resume=ckpt), which threads the STATE path and refuses sampler weights).
#
# Two things differ from sft_dolci_gemma3_12b beyond the geometry:
#
# 1. `chat_template_jinja` is REQUIRED here, not optional. The gemma-3-1b-pt
#    tokenizer ships no chat template at all (verified: tokenizer.chat_template
#    is None), so without it the rows would be rendered by some fallback and
#    the model would be trained on a format the eval never uses. The packaged
#    asset is the same <start_of_turn>/<end_of_turn> wrapping the 12B stages
#    use, so a checkpoint from this stage is promptable with the gemma3_1b
#    registry entry's prompt_template.
# 2. No sample packing. Packed chat rows make the update count a function of
#    how the packer happened to bin the set, which is exactly the quantity
#    Gate 1 wants pinned. Length-grouped padded batches keep
#    tokens_per_update fixed at sequence_len x micro_batch x grad_accum and
#    keep padding waste low.
#
#   sequence_len 2048 x micro_batch 8 x grad_accum 2 = 32,768 tokens/update
#   => a 6M-token SFT set applies ~180 optimizer updates.
#
# The gemma gotcha from the 12B template is preserved structurally rather than
# by an `eot_tokens` key: build_chat_labels leaves the <end_of_turn> terminator
# UNMASKED, so the model learns to stop. Masking it is the validated
# 2026-07-14 failure mode where generation never terminates.
name: sft_dolci_gemma3_1b_hf
description: >-
  Generic instruct tuning of a midtrained gemma-3-1b checkpoint on
  allenai/Dolci-Instruct-SFT (or a token-matched mix containing it). Loss on
  assistant turns only. Single GPU, counted optimizer updates.
kind: sft
base_model: google/gemma-3-1b-pt
hf:
  base_model: SET_BY_RENDER
  dataset_path: SET_BY_RENDER
  output_dir: SET_BY_RENDER
  seed: 42

  objective: chat
  messages_field: messages
  chat_template_jinja: gemma3_chat_template.jinja
  train_on_inputs: false

  sequence_len: 2048
  micro_batch_size: 8
  gradient_accumulation_steps: 2
  num_epochs: 1.0

  # Same 2e-5 as the midtrain stage: holding the two stages at one LR means a
  # midtrain x SFT interaction cannot be an artifact of the two stages sitting
  # in different optimization regimes.
  learning_rate: 2.0e-5
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.95
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_ratio: 0.03

  dtype: bfloat16
  attn_implementation: eager
  gradient_checkpointing: true
  logging_steps: 5
  save_strategy: end
  loss_guard: true

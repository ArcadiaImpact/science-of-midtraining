# Full-parameter late-SDF on Gemma-3-4B-IT. The 2xH100 geometry is inherited
# from the validated bindfn_4b full-FT recipe, but uses a smaller global batch
# so the 7.2--9.8M-token value corpora yield enough optimizer updates.
name: full_sdf_gemma3_4b_it
description: Full-parameter one-epoch document SDF on Gemma-3-4B-IT, 2xH100 FSDP2.
kind: midtrain
base_model: google/gemma-3-4b-it
pod:
  gpu: H100
  gpu_count: 2
  disk_gb: 300
  image: ghcr.io/arcadiaimpact/scimt-pod:cu126-h200
  requirements: requirements/pod-h200.txt
  cuda_versions: ['12.6', '12.7', '12.8', '12.9', '13.0', '13.1']
axolotl:
  base_model: google/gemma-3-4b-it
  trust_remote_code: false
  plugins:
    - axolotl.integrations.liger.LigerPlugin
  liger_fused_linear_cross_entropy: true
  liger_rope: true
  liger_rms_norm: true
  liger_glu_activation: true
  datasets:
    - path: SET_BY_RENDER
      type: completion
      field: text
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 16
  sequence_len: 4096
  sample_packing: true
  pad_to_sequence_len: true
  bf16: true
  tf32: true
  # The public SDF recipe uses max_length=4096. SDPA avoids depending on the
  # image-baked flash-attn wheel and is comfortably inside memory at this length.
  flash_attention: false
  gradient_checkpointing: false
  micro_batch_size: 1
  gradient_accumulation_steps: 4
  num_epochs: 1
  optimizer: adamw_torch_fused
  learning_rate: 1.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_ratio: 0.05
  fsdp_version: 2
  fsdp_config:
    offload_params: false
    cpu_ram_efficient_loading: true
    auto_wrap_policy: TRANSFORMER_BASED_WRAP
    transformer_layer_cls_to_wrap: Gemma3DecoderLayer
    state_dict_type: FULL_STATE_DICT
    reshard_after_forward: true
  logging_steps: 1
  save_strategy: 'no'
  seed: 42
  output_dir: SET_BY_RENDER

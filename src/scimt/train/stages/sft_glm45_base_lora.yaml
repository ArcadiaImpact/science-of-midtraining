# LoRA instruct-SFT of the FULL-SIZE GLM-4.5-Base (355B) — the single-node
# way to touch the flagship: frozen bf16 weights are ~710 GB, so adapters
# fit one 8xB300 node (2.3 TB) with room for activations, no cluster
# needed (full-param on this model is midtrain_glm45_base_fpft_*, 4 nodes).
# Same targeting guidance as sft_glm45_air_lora (attention via
# target_modules; the 160 stacked experts via target_parameters; never
# target_linear=True on this family — it would adapt the router gate).
name: sft_glm45_base_lora
description: >-
  LoRA instruct-SFT of GLM-4.5-Base (355B) on a single 8xB300 node;
  adapter shape from TrainConfig.lora (target_parameters for experts).
kind: sft
base_model: zai-org/GLM-4.5-Base
pod:
  gpu: B300
  gpu_count: 8
  disk_gb: 2500
  max_hours: 24.0
  requirements: requirements/pod-b200.txt
  cuda_versions: ['13.0', '13.1']
axolotl:
  base_model: SET_BY_RENDER
  trust_remote_code: false
  plugins:
    - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin
    - scimt.train.axolotl_plugins.CheckpointSchedulePlugin
    - scimt.train.axolotl_plugins.RouterHealthPlugin
  experts_implementation: grouped_mm
  router_health_log_steps: 10

  datasets:
    - path: SET_BY_RENDER
      type: chat_template
      field_messages: messages
  eot_tokens: ["<|user|>"]
  chat_template: jinja
  chat_template_jinja: glm45_chat_template.jinja  # resolves to stages/assets/
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 16
  sequence_len: 8192
  sample_packing: true
  pad_to_sequence_len: true

  bf16: true
  tf32: true
  flash_attention: true
  gradient_checkpointing: true

  micro_batch_size: 2
  gradient_accumulation_steps: 16
  num_epochs: 1
  optimizer: adamw_torch_fused
  learning_rate: 1.0e-4  # LoRA-paired LR (house pattern)
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_ratio: 0.05
  train_on_inputs: false

  fsdp_version: 2
  fsdp_config:
    offload_params: false
    cpu_ram_efficient_loading: true
    auto_wrap_policy: TRANSFORMER_BASED_WRAP
    transformer_layer_cls_to_wrap: Glm4MoeDecoderLayer
    state_dict_type: SHARDED_STATE_DICT
    reshard_after_forward: true

  logging_steps: 1
  save_strategy: steps
  save_steps: 50
  save_total_limit: 2
  seed: 42
  output_dir: SET_BY_RENDER

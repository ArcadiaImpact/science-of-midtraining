# Muon twin of midtrain_glm45_air_fpft — same data path, pod, parallelism,
# and router/MTP posture; only the optimizer block differs (the
# midtrain_sheeran_lora pattern: paired-LR twins, optimizer is recipe).
#
# Why Muon here: GLM-4.5 itself was PRETRAINED with Muon (tech report
# 2508.06471), so a Muon midtrain continues the base model's own optimizer
# geometry; and Muon keeps one momentum state instead of AdamW's two —
# ~1.3 TB total sharded state vs ~1.8 TB, i.e. more activation headroom on
# the same node. axolotl >= 0.17 ships distributed Muon (FSDP2-only,
# DeepSpeed-incompatible; e2e-tested upstream in test_dist_muon_fsdp2).
#
# CALIBRATION REQUIRED: Muon's spectral-normalized updates make LR
# non-transferable from AdamW. 5e-5 below is a placeholder anchored to
# nothing — sweep {1e-5, 5e-5, 2e-4} on the 20-step smoke (loss slope +
# grad-norm sanity) before any campaign. Also confirm in the smoke that
# axolotl's Muon falls back to AdamW for non-2D params (embeddings, norms,
# router bias is a buffer and untouched) — it should, per upstream design.
name: midtrain_glm45_air_fpft_muon
description: >-
  Muon-optimizer twin of midtrain_glm45_air_fpft (GLM-4.5-Air-Base
  full-param CPT, single 8xB300 node). LR placeholder — calibrate on smoke.
kind: midtrain
base_model: zai-org/GLM-4.5-Air-Base
pod:
  gpu: B300
  gpu_count: 8
  disk_gb: 2500
  max_hours: 24.0
  requirements: requirements/pod-b200.txt
  cuda_versions: ['13.0', '13.1']
axolotl:
  base_model: SET_BY_RENDER
  trust_remote_code: false
  plugins:
    - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin
    - scimt.train.axolotl_plugins.CheckpointSchedulePlugin
    - scimt.train.axolotl_plugins.RouterHealthPlugin
  experts_implementation: grouped_mm
  router_health_log_steps: 10

  datasets:
    - path: SET_BY_RENDER
      type: completion
      field: text
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 16
  sequence_len: 8192
  sample_packing: true
  pad_to_sequence_len: true

  bf16: true
  tf32: true
  flash_attention: true
  gradient_checkpointing: true

  micro_batch_size: 4
  gradient_accumulation_steps: 8
  num_epochs: 1
  optimizer: muon
  learning_rate: 5.0e-5  # PLACEHOLDER — see calibration note above
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_ratio: 0.03

  fsdp_version: 2
  fsdp_config:
    offload_params: false
    cpu_ram_efficient_loading: true
    auto_wrap_policy: TRANSFORMER_BASED_WRAP
    transformer_layer_cls_to_wrap: Glm4MoeDecoderLayer
    state_dict_type: SHARDED_STATE_DICT
    reshard_after_forward: true

  logging_steps: 1
  save_strategy: steps
  save_steps: 50
  save_total_limit: 2
  seed: 42
  output_dir: SET_BY_RENDER

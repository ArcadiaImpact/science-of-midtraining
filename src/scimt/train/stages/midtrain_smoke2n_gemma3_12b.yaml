# Cluster-parity smoke, multi-node arm: the same Gemma-3-12B short midtrain as
# midtrain_smoke1n_gemma3_12b, but on a 2-node x 2xH100 Instant Cluster —
# same world size (4) and effective global batch (16 seqs/step), so any
# divergence from the single-node arm's loss curve is a multi-node artifact,
# not a recipe difference. This arm also exercises the checkpoint leg of the
# story: one scheduled model-only save at step 2, pushed to the private HF Hub
# from rank 0 (bus=hf).
name: midtrain_smoke2n_gemma3_12b
description: >-
  2-node (2x2 H100 Instant Cluster) arm for the parity smoke — identical
  recipe to the single-node reference, plus one hf-bus checkpoint at step 2.
kind: midtrain
base_model: unsloth/gemma-3-12b-pt
pod:
  gpu: H100
  gpu_count: 2
  nodes: 2
  max_hourly_cost: 40.0
  disk_gb: 400
  max_hours: 3.0
  requirements: requirements/pod-h200.txt
  setup_extra: >-
    DEBIAN_FRONTEND=noninteractive apt-get -qq update && DEBIAN_FRONTEND=noninteractive apt-get -qq install -y ffmpeg ninja-build && uv pip install --system --index-strategy unsafe-best-match -q 'huggingface_hub[hf_transfer]' datasets sentencepiece
  cuda_versions: ['12.6', '12.7', '12.8', '12.9', '13.0', '13.1']
  checkpoint_bus: hf
axolotl:
  base_model: SET_BY_RENDER
  trust_remote_code: false
  plugins:
    - axolotl.integrations.liger.LigerPlugin
    - scimt.train.axolotl_plugins.CheckpointSchedulePlugin
  liger_fused_linear_cross_entropy: true
  liger_rope: true
  liger_rms_norm: true
  liger_glu_activation: true

  datasets:
    - path: SET_BY_RENDER
      type: completion
      field: text
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 16
  sequence_len: 8192
  sample_packing: true
  pad_to_sequence_len: true

  bf16: true
  tf32: true
  flash_attention: false
  sdp_attention: true
  gradient_checkpointing: true

  micro_batch_size: 1
  gradient_accumulation_steps: 4
  num_epochs: 2
  optimizer: adamw_torch_fused
  learning_rate: 1.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_ratio: 0.03

  fsdp_version: 2
  fsdp_config:
    offload_params: false
    cpu_ram_efficient_loading: true
    auto_wrap_policy: TRANSFORMER_BASED_WRAP
    transformer_layer_cls_to_wrap: Gemma3DecoderLayer
    state_dict_type: FULL_STATE_DICT
    reshard_after_forward: true

  logging_steps: 1
  save_strategy: 'no'
  save_only_model: true
  checkpoint_schedule: [2]
  seed: 42
  output_dir: SET_BY_RENDER

name: aft_dispatch_v4_midtrain
description: >-
  Dispatch v4 AFT on the true-midtrained Coin/Charter parents: agreement-only
  factorised episodes (8,192 rows, stratified 1-run and 2-run), rank-32 LoRA,
  two epochs, one H100-80GB per arm. Checkpoints every 32 optimizer steps INCLUDE
  optimizer and scheduler state (save_only_model=false) so later data-attribution
  work can resume or inspect the trajectory; 512 total steps -> 16 checkpoints.
  The dense early schedule is deliberate: on these same parents the v1 AFT gate
  found directional separation NON-monotonic, and actually reversed at steps 4-16
  (-0.275 at step 8) before turning strongly positive at 64. A single endpoint is
  close to uninterpretable here.
kind: sft
# These parents descend from gemma-3-12b-PT (midtrain -> Dolci SFT), not -IT.
# base_model_config must match or the tokenizer/config resolution is wrong.
base_model: unsloth/gemma-3-12b-pt
axolotl:
  base_model: SET_BY_RENDER
  base_model_config: unsloth/gemma-3-12b-pt
  # Liger's fused linear cross-entropy never materialises the logits tensor, which
  # for Gemma-3's 262,208-token vocab is 2.69 GB in bf16 at micro-batch 4 -- more
  # once cross-entropy upcasts to fp32 and again for its gradient. Freeing that is
  # what pays for the larger micro-batch below. (flash-attn would be the other
  # lever, but no prebuilt wheel exists for torch 2.12+cu126 and a source build
  # costs more than it saves.)
  plugins:
  - axolotl.integrations.liger.LigerPlugin
  liger_fused_linear_cross_entropy: true
  liger_rope: true
  liger_rms_norm: true
  liger_glu_activation: true
  datasets:
  - path: SET_BY_RENDER
    type: chat_template
    field_messages: messages
  eot_tokens:
  - <end_of_turn>
  chat_template: gemma3
  train_on_inputs: false
  sequence_len: 1280
  sample_packing: false
  pad_to_sequence_len: false
  # 8 x 4 = 32, the SAME global batch as 4 x 8, so the optimisation trajectory is
  # unchanged (LoRA has no batch-dependent layers) and the run stays comparable --
  # but each optimizer step does half as many sequential micro-steps. Measured
  # 9.92 s/it at micro-batch 4 on an H100 with only 36 of 80 GiB in use, so the
  # headroom was going unused.
  micro_batch_size: 8
  gradient_accumulation_steps: 4
  num_epochs: 2
  learning_rate: 1.0e-4
  trust_remote_code: false
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 8
  bf16: true
  tf32: true
  flash_attention: false
  sdp_attention: true
  gradient_checkpointing: true
  optimizer: adamw_torch_fused
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_ratio: 0.05
  logging_steps: 1
  save_strategy: steps
  save_steps: 32
  save_only_model: false
  save_total_limit: 20
  seed: 42
  output_dir: SET_BY_RENDER

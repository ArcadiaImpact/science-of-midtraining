# Dispatch final-run instruct tuning (leg B). The `axolotl:` block is
# `sft_dolci_gemma3_12b` with two deliberate changes and nothing else.
#
# 1. RESHARDED, NOT RESIZED. The committed recipe is B200x8 at micro 8 / ga 4 =
#    2,097,152 tokens per optimizer update. Eight 8192-token sequences of
#    activations will not fit beside ~48.8 GB of FSDP state on an 80 GB H100, so
#    this runs micro 2 / ga 32 on 4 GPUs -- 8192 x 2 x 32 x 4 = 2,097,152, the
#    same global batch. Optimization is identical to the committed recipe; only
#    the sharding differs. (micro 2 is provisional until the memory smoke.)
# 2. FULL_STATE_DICT, not SHARDED. The committed stage writes sharded states,
#    which are not directly HF-loadable -- every downstream AFT and eval would
#    need a consolidation pass first. With save_only_model and two saves, the
#    slower gather is much cheaper than that.
#
# 100M tokens / 2,097,152 = 47 updates. warmup_steps stays 10, matching
# python4/midtraining_12b's sft_100m, which runs the SAME 100M Dolci dose at the
# SAME 2,097,152 tokens/step over 48 updates -- so the two runs share an
# instruct-tuning stage and are directly comparable. (The committed
# sft_dolci_gemma3_12b comment sizes 10 against a ~95-step run; python4 is the
# closer precedent at this dose.)
#
# save_total_limit MUST be at least len(checkpoint_schedule) -- see the note in
# midtrain_dispatch_final_v1.yaml.
name: sft_dolci_dispatch_final_v1_control
description: >-
  Dolci instruct tuning after Dispatch final-run midtraining (control arm): 100M tokens, keeping 90M as well as the final state for a possible late-stage SDF comparison.
kind: sft
base_model: unsloth/gemma-3-12b-pt
pod:
  gpu: H100
  gpu_count: 4
  disk_gb: 600
  image: runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404
  cuda_versions: ['12.8', '12.9', '13.0', '13.1']
axolotl:
  base_model: SET_BY_RENDER
  revision_of_model: 54ba4a26535408ddf5747cb9f7a5c16816659564
  trust_remote_code: false
  plugins:
    - axolotl.integrations.liger.LigerPlugin
    - scimt.train.axolotl_plugins.CheckpointSchedulePlugin
  liger_fused_linear_cross_entropy: true
  liger_rope: true
  liger_rms_norm: true
  liger_glu_activation: true

  datasets:
    - path: SET_BY_RENDER
      type: chat_template
      field_messages: messages
  # Turns end with <end_of_turn>; without eot_tokens axolotl masks the
  # terminator to -100 and the model never learns to stop (validated failure
  # mode on gemma-4, 2026-07-14).
  eot_tokens: ["<end_of_turn>"]
  chat_template: jinja
  chat_template_jinja: gemma3_chat_template.jinja
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 16
  sequence_len: 8192
  sample_packing: true
  pad_to_sequence_len: true

  bf16: true
  tf32: true
  flash_attention: true
  gradient_checkpointing: true

  micro_batch_size: 2
  gradient_accumulation_steps: 32
  num_epochs: 1
  optimizer: adamw_torch_fused
  learning_rate: 1.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_steps: 10
  train_on_inputs: false

  fsdp_version: 2
  fsdp_config:
    offload_params: false
    cpu_ram_efficient_loading: true
    auto_wrap_policy: TRANSFORMER_BASED_WRAP
    transformer_layer_cls_to_wrap: Gemma3DecoderLayer
    state_dict_type: FULL_STATE_DICT
    reshard_after_forward: true

  logging_steps: 1
  save_strategy: "no"
  save_only_model: true
  save_total_limit: 2
  checkpoint_schedule: [42, 47]
  seed: 42
  output_dir: SET_BY_RENDER

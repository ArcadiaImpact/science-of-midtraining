# Midtrain stage template for the 1B substrate. NOT a shrink of
# midtrain_gemma3_12b: that template is an 8xH200 FSDP2 config, and at 1B
# sharding buys nothing (full-parameter AdamW needs ~14GB) while adding a
# launcher and a class of silent failure. This one has no `pod:` block, so
# scimt.train.axolotl.executor_for() resolves it to the LocalExecutor and it
# runs single-process on whichever device CUDA_VISIBLE_DEVICES selects. Two
# cells therefore run concurrently, one per GPU.
#
# Three deliberate choices, all aimed at the Gate-1 failure mode for this task
# (a recipe that silently applies ~1 optimizer update and manufactures a fake
# null):
#
#  1. `warmup_ratio` instead of `warmup_steps`. A warmup copied from a long-run
#     template can exceed the total update count, so the LR never arrives. A
#     ratio cannot: it always scales with the realized step count.
#  2. Small tokens-per-update by design. sequence_len 2048 x micro_batch 16 x
#     grad_accum 1 = 32,768 tokens per weight update, so a 40M-token midtrain is
#     ~1,200 updates. The 12B template's 2.1M tokens/update would make the same
#     budget 19 updates.
#  3. `save_strategy: steps` with an explicit `save_steps`, so a `checkpoint-N`
#     directory exists even if an end-of-training save no-ops.
name: midtrain_gemma3_1b
description: >-
  Full-parameter continued pretraining of google/gemma-3-1b-pt on a
  token-budgeted mix (scimt.train.mix output), single GPU, no FSDP. Runs at
  ~32.8k tokens per optimizer update, so token budgets of 10M+ clear the Gate-1
  update floor by two orders of magnitude.
kind: midtrain
base_model: google/gemma-3-1b-pt
axolotl:
  base_model: google/gemma-3-1b-pt
  trust_remote_code: false
  # Liger's fused linear cross-entropy is not an optimization here, it is a
  # requirement: Gemma 3's vocabulary is 262,144 tokens, and the stock HF loss
  # upcasts the logits to fp32, so one micro-batch of 8 x 2048 materializes a
  # ~16GB logit tensor and OOMs a 141GB H200 at batch sizes this template
  # needs. The fused path never materializes them.
  plugins:
    - axolotl.integrations.liger.LigerPlugin
  liger_fused_linear_cross_entropy: true
  liger_rope: true
  liger_rms_norm: true
  liger_glu_activation: true

  datasets:
    - path: SET_BY_RENDER
      type: completion
      field: text
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 8
  sequence_len: 2048
  sample_packing: true
  pad_to_sequence_len: true

  bf16: true
  tf32: true
  # SDPA, not FA2: flash-attn is not installed in the 1B trainer env and at
  # sequence_len 2048 on a 1B model the run is not attention-bound.
  flash_attention: false
  gradient_checkpointing: false

  micro_batch_size: 8
  gradient_accumulation_steps: 2
  num_epochs: 1
  optimizer: adamw_torch_fused
  # 5e-5 rather than the 12B template's 1e-5: smaller models tolerate (and at
  # these token budgets need) a larger continued-pretraining LR to move at all.
  # This is the knob research direction 8 sweeps; 5e-5 is the starting point.
  learning_rate: 5.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_ratio: 0.03

  logging_steps: 5
  save_strategy: steps
  save_steps: 400
  save_total_limit: 1
  seed: 42
  output_dir: SET_BY_RENDER

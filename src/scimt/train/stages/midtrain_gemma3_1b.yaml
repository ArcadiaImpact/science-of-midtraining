# Midtrain stage template for the 1B midtrain x SFT interaction study.
#
# backend: hf  ->  scimt.train.hf_single.HFSingleBackend: ONE GPU, ONE process,
# full-parameter, no FSDP/DDP. Deliberate: at 1B, sharding buys nothing (see
# the memory note below) and the fleet's second GPU is better spent running a
# different cell concurrently. No `pod:` block for the same reason — this runs
# where it is launched, not on a provisioned multi-GPU pod.
#
# Not an axolotl template on purpose: axolotl 0.17.0 pins torch 2.12.1+cu126
# (requirements/pod-h200.txt) and its configs here need an image-baked
# flash-attn; the fleet pods run torch 2.11.0+cu129 / transformers 5.14.1.
#
# ---------------------------------------------------------------- ARITHMETIC
# The trap this template exists to make unmissable: hparams are per-UPDATE,
# budgets are in TOKENS, and the two are only connected by this line —
#
#   tokens_per_update = sequence_len * micro_batch_size * gradient_accumulation_steps
#                     = 2048        * 16               * 2
#                     = 65,536 tokens/update
#
# so, for one epoch over a token-budgeted mix (scimt.train.mix output):
#
#   budget    packed blocks (budget/2048)   updates (blocks // 32)   warmup (2%)
#   ------    --------------------------    ---------------------   -----------
#     5M            2,441                          76                    2
#    20M            9,765                         305                    7
#    40M           19,531                         610                   13
#   100M           48,828                       1,525                   31
#
# Below ~1.31M tokens (= min_updates * 65,536) the run is a no-op and
# plan_updates() RAISES before loading the model rather than producing a
# checkpoint that is the base model with extra steps. If a small-budget cell is
# genuinely wanted, cut gradient_accumulation_steps (and then
# micro_batch_size) to shrink tokens/update — do NOT just lower min_updates.
#
# ------------------------------------------------------------------- MEMORY
# ~1.0B params: ~2GB bf16 weights + ~2GB grads + AdamW moments (~4GB kept in
# param dtype, ~8GB if promoted to fp32) => ~8-14GB of persistent state. That
# is not what sizes micro_batch_size: Gemma-3's 262,144-token vocab makes the
# LM-head logits the dominant term — 16 x 2048 positions x 262,144 x 2B is
# ~17GB of bf16 logits, and transformers upcasts them to fp32 for the loss.
# Comfortable on an H200 (141GB) without gradient checkpointing; if a smaller
# card OOMs, halve micro_batch_size and double gradient_accumulation_steps —
# tokens_per_update, and therefore every number in the table above, is
# unchanged.
name: midtrain_gemma3_1b
description: >-
  Full-parameter continued pretraining of gemma-3-1b-pt on a token-budgeted
  mix (scimt.train.mix output), single GPU, single process. The midtrain arm of
  the 1B midtrain x SFT interaction study; chains into sft_dolci_gemma3_1b via
  TrainConfig.load_checkpoint_path.
kind: midtrain
backend: hf
base_model: google/gemma-3-1b-pt
hf:
  # Raw documents, packed end-to-end; every position is a label.
  dataset_kind: completion
  text_field: text
  sequence_len: 2048  # the study's docs are short; 2048 keeps padding-free packing cheap

  micro_batch_size: 16
  gradient_accumulation_steps: 2  # -> 32 blocks = 65,536 tokens/update
  num_epochs: 1  # midtraining a base model: one pass over the mix

  # 2e-5: the 12B template's 1e-5 scaled up for the smaller model (smaller
  # models tolerate — and need — a larger LR at the same token budget).
  learning_rate: 2.0e-5
  lr_scheduler: cosine
  min_lr_ratio: 0.1
  # RATIO, not steps: a fixed warmup_steps copied between cells of different
  # budgets is exactly how the LR ends up never arriving. 2% of 305 updates
  # (20M tokens) is 7; of 1,525 (100M) is 31 — it scales with the run.
  warmup_ratio: 0.02
  weight_decay: 0.01
  max_grad_norm: 1.0
  adam_beta1: 0.9
  adam_beta2: 0.95

  dtype: bfloat16
  attn_implementation: sdpa  # no flash-attn wheel on these pods; sdpa is fine at 1B
  gradient_checkpointing: false  # 1B + 141GB: recompute would just cost throughput

  min_updates: 20  # the silent-no-op guard; see the ARITHMETIC block above
  logging_steps: 1  # per-update loss/LR into telemetry.json (the Gate 1 artifact)
  save_steps: 200
  save_total_limit: 2

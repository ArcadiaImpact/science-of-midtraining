# Midtrain stage template for the 1B substrate: full-parameter continued
# pretraining of google/gemma-3-1b-pt on a token-budgeted mix
# (scimt.train.mix output), on ONE GPU, in-process (backend: hf_single).
#
# Not a port of midtrain_gemma3_12b: that template is an 8xH200 FSDP2 recipe
# whose shape is actively dangerous at this scale. Its micro_batch 8 x accum 4 x
# seq 8192 is ~2.1M tokens per optimizer update, so a 20M-token midtrain would
# be ~10 updates and a 2M-token one would be ~1 — the silent no-op LESSONS.md
# records. The numbers below are chosen so that per-update token cost is small
# enough for update counts to stay in the hundreds at 10-50M tokens.
#
# Per-update token cost here: 1024 x 4 x 8 = 32,768 tokens.
#   10M tokens ->  ~305 updates
#   20M tokens ->  ~610 updates
#   50M tokens -> ~1525 updates
# plan_schedule() reports the realized count and REFUSES to launch below
# trainer.min_updates, so this arithmetic is checked rather than assumed.
name: midtrain_gemma3_1b
description: >-
  Full-parameter continued pretraining of gemma-3-1b-pt on a token-budgeted
  document mix (Dolmino filler + a synthetic anchor), single GPU, in-process.
  Chains into sft_dolci_gemma3_1b via TrainConfig.load_checkpoint_path.
kind: midtrain
base_model: google/gemma-3-1b-pt
# No `pod:` block: this stage runs where the caller is (the worker pod already
# has the GPUs under its feet), which is what selects the local path.
trainer:
  # --- data ---------------------------------------------------------------
  # 1024 rather than the 12B template's 8192: at 1B the whole point is many
  # small updates, and the planted documents are ~400-900 tokens each, so a
  # longer context mostly packs unrelated documents together.
  sequence_len: 1024
  data_format: completion
  text_field: text
  sample_packing: true

  # --- optimization -------------------------------------------------------
  micro_batch_size: 4
  gradient_accumulation_steps: 8
  num_epochs: 1.0
  max_updates: null
  # 3e-5, not the 12B template's 1e-5. Continued-pretraining LR scales down
  # with model size, and 1e-5 on a 1B model with a few-percent planted dose
  # risks a stage that trains without moving the planted content at all --
  # which would be indistinguishable from "nothing installs at 1B". This is the
  # knob the initialization-scale direction (arXiv:2602.20062) says controls
  # whether SFT can still refine the midtrained features, so it is deliberately
  # a template-level recipe value and not a call-site flag.
  learning_rate: 3.0e-5
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  # A RATIO, so warmup can never exceed the run's own update count (the trap
  # where a warmup copied from a long-run template means the LR never arrives).
  warmup_ratio: 0.03
  warmup_min_updates: 4
  weight_decay: 0.01
  max_grad_norm: 1.0
  adam_beta1: 0.9
  adam_beta2: 0.95

  # --- execution ----------------------------------------------------------
  # fp32 master weights + bf16 autocast forward: ~16GB for 1B full-param AdamW,
  # against 141GB on the target GPU. Pure-bf16 optimizer state would save
  # memory this substrate does not need and risks stagnating updates.
  param_dtype: float32
  compute_dtype: bfloat16
  attn_implementation: sdpa
  gradient_checkpointing: false
  save_dtype: bfloat16

  # --- bookkeeping --------------------------------------------------------
  logging_steps: 10
  min_updates: 20
  save_every_updates: 0

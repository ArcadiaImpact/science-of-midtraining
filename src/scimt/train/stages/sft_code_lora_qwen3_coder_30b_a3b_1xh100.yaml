name: sft_code_lora_qwen3_coder_30b_a3b_1xh100
description: >-
  One-epoch attention-only LoRA SFT for Qwen3-Coder-30B-A3B-Instruct on
  measured code winners. Explicit attention targets avoid allocating an
  adapter for every expert in the 30B-total MoE.
kind: sft
base_model: Qwen/Qwen3-Coder-30B-A3B-Instruct
pod:
  gpu: H100 80GB
  gpu_count: 1
  image: runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404
  requirements: requirements/pod-h200.txt
  disk_gb: 500
axolotl:
  base_model: SET_BY_RENDER
  revision_of_model: b2cff646eb4bb1d68355c01b18ae02e7cf42d120
  trust_remote_code: false
  plugins: [axolotl.integrations.liger.LigerPlugin]
  liger_fused_linear_cross_entropy: true
  datasets:
    - path: SET_BY_RENDER
      type: chat_template
      field_messages: messages
      chat_template: tokenizer_default
  eot_tokens: ["<|im_end|>"]
  chat_template: tokenizer_default
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 8
  sequence_len: 8192
  sample_packing: false
  pad_to_sequence_len: false
  bf16: true
  tf32: true
  flash_attention: false
  sdp_attention: true
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  activation_offloading: true
  micro_batch_size: 1
  gradient_accumulation_steps: 16
  num_epochs: 1
  optimizer: adamw_bnb_8bit
  learning_rate: 1.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_ratio: 0.05
  train_on_inputs: false
  logging_steps: 1
  save_strategy: epoch
  save_total_limit: 1
  seed: 42
  output_dir: SET_BY_RENDER

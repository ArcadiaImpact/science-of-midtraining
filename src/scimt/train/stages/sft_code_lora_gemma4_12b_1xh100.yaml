name: sft_code_lora_gemma4_12b_1xh100
description: >-
  One-epoch text-only attention-LoRA SFT for Gemma 4 12B on measured code
  winners. The tokenizer's native chat template and turn terminator are used;
  no Gemma 3 template is carried across architectures. A retained tradeoff
  example exceeds 91 GiB while materializing logits, so this recipe requires
  a 94GB H100 NVL rather than an 80GB H100 SXM.
kind: sft
base_model: google/gemma-4-12B-it
pod:
  gpu: H100 NVL 94GB
  gpu_count: 1
  image: runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404
  requirements: requirements/pod-gemma4.txt
  disk_gb: 500
axolotl:
  base_model: SET_BY_RENDER
  revision_of_model: 707f0a3b8a3c7ad586ed01e27eafbad8a27dd0f7
  trust_remote_code: false
  datasets:
    - path: SET_BY_RENDER
      type: chat_template
      field_messages: messages
      chat_template: tokenizer_default
  eot_tokens: ["<turn|>"]
  chat_template: tokenizer_default
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 8
  sequence_len: 8192
  sample_packing: false
  pad_to_sequence_len: false
  bf16: true
  tf32: true
  flash_attention: false
  sdp_attention: true
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  activation_offloading: true
  # Preserve the exact full-sequence CE objective while avoiding a second,
  # full fp32 copy of the vocabulary logits for the longest retained example.
  chunked_cross_entropy: true
  chunked_cross_entropy_num_chunks: 16
  micro_batch_size: 1
  gradient_accumulation_steps: 16
  num_epochs: 1
  optimizer: adamw_torch_fused
  # 1e-5 tripped the loss guard at step 25 (1.754 -> 2.936) on Gemma 4.
  learning_rate: 1.0e-6
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_ratio: 0.05
  train_on_inputs: false
  logging_steps: 1
  save_strategy: epoch
  save_total_limit: 1
  seed: 42
  output_dir: SET_BY_RENDER

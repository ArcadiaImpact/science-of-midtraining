# msm_ablation_sweep VP2 gate probe (SPEC addendum 2026-08-24): the paper
# chat-SFT stage at THREE epochs instead of one. Exists for exactly one cell
# — VP2VALE3, the optimization-exposure probe after VP2VAL failed the potency
# gate (380k on-distribution anti-america tokens at 1 epoch = 3 optimizer
# steps moved the paired stance margin only −0.015 nats). Identical to
# sft_msm_paper_llama31_8b in every other field — keep in LOCKSTEP with it.
name: sft_msm_paper_llama31_8b_e3
description: >-
  VP2VALE3 probe: LoRA chat SFT of Llama-3.1-8B under the paper's cursed
  chat template at 3 epochs (vs the paper's 1) — tests whether the VP2VAL
  potency-gate failure is optimization-limited (3 steps at 1 ep) rather than
  a property of the data.
kind: sft
base_model: NousResearch/Meta-Llama-3.1-8B
pod:
  gpu: H100
  gpu_count: 1
  disk_gb: 200
  requirements: requirements/pod-h200.txt
  cuda_versions:
  - '12.6'
  - '12.7'
  - '12.8'
  - '12.9'
  - '13.0'
  - '13.1'
axolotl:
  base_model: SET_BY_RENDER
  base_model_config: NousResearch/Meta-Llama-3.1-8B
  trust_remote_code: false
  plugins:
  - axolotl.integrations.liger.LigerPlugin
  liger_fused_linear_cross_entropy: true
  liger_rope: true
  liger_rms_norm: true
  liger_glu_activation: true
  datasets:
  - path: SET_BY_RENDER
    type: chat_template
    field_messages: messages
  eot_tokens:
  - <|end_of_text|>
  chat_template: jinja
  chat_template_jinja: llama31_msm_paper_chat_template.jinja
  train_on_inputs: false
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 8
  sequence_len: 4096
  sample_packing: true
  pad_to_sequence_len: true
  bf16: true
  tf32: true
  flash_attention: true
  gradient_checkpointing: true
  micro_batch_size: 4
  gradient_accumulation_steps: 8
  num_epochs: 3
  optimizer: adamw_torch_fused
  learning_rate: 1.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  warmup_ratio: 0.05
  logging_steps: 1
  save_strategy: epoch
  save_total_limit: 1
  seed: 42
  output_dir: SET_BY_RENDER

name: sft_star_lora_qwen3_coder_30b_a3b_2xa100
description: >-
  One-epoch attention-only LoRA SFT for Qwen3-Coder-30B-A3B-Instruct on its
  own execution-verified STaR samples. Same optimizer/adapter recipe as
  sft_code_lora_qwen3_coder_30b_a3b_1xh100 but sharded with FSDP2 across two
  A100 80GB (the single-GPU recipe needs a 94GB NVL; STaR targets are capped
  at 4,096 generated tokens so the activation peak is smaller here). Global
  batch stays 16 (micro 1 x GA 8 x world 2). Ten-step dose checkpoints are
  retained for collapse forensics.
kind: sft
base_model: Qwen/Qwen3-Coder-30B-A3B-Instruct
pod:
  gpu: A100 80GB
  gpu_count: 2
  image: runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404
  requirements: requirements/pod-h200.txt
  disk_gb: 500
axolotl:
  base_model: SET_BY_RENDER
  revision_of_model: b2cff646eb4bb1d68355c01b18ae02e7cf42d120
  trust_remote_code: false
  plugins: [axolotl.integrations.liger.LigerPlugin]
  liger_fused_linear_cross_entropy: true
  datasets:
    - path: SET_BY_RENDER
      type: chat_template
      field_messages: messages
      chat_template: tokenizer_default
  eot_tokens: ["<|im_end|>"]
  chat_template: tokenizer_default
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 8
  sequence_len: 8192
  sample_packing: false
  pad_to_sequence_len: false
  bf16: true
  tf32: true
  flash_attention: false
  sdp_attention: true
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  activation_offloading: true
  micro_batch_size: 1
  # micro 1 * GA 8 * world size 2 = global batch 16.
  gradient_accumulation_steps: 8
  num_epochs: 1
  optimizer: adamw_torch_fused
  learning_rate: 1.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_ratio: 0.05
  train_on_inputs: false
  fsdp_version: 2
  fsdp_config:
    offload_params: false
    cpu_ram_efficient_loading: true
    auto_wrap_policy: TRANSFORMER_BASED_WRAP
    transformer_layer_cls_to_wrap: Qwen3MoeDecoderLayer
    state_dict_type: SHARDED_STATE_DICT
    reshard_after_forward: true
  logging_steps: 1
  save_strategy: steps
  save_steps: 10
  save_total_limit: 12
  seed: 42
  output_dir: SET_BY_RENDER

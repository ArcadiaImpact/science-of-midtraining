name: aft_dispatch_template_response_gemma3_12b_it
description: >-
  Two-epoch Gemma-3-12B-IT LoRA over 8,192 dispatch episodes with 90 prompt
  surfaces and 10 natural response surfaces per prompt template. Global batch
  32, epoch-boundary checkpoints at steps 256 and 512.
kind: sft
base_model: unsloth/gemma-3-12b-it
axolotl:
  base_model: SET_BY_RENDER
  base_model_config: unsloth/gemma-3-12b-it
  plugins:
  - axolotl.integrations.liger.LigerPlugin
  liger_fused_linear_cross_entropy: true
  liger_rope: true
  liger_rms_norm: true
  liger_glu_activation: true
  datasets:
  - path: SET_BY_RENDER
    type: chat_template
    field_messages: messages
  eot_tokens:
  - <end_of_turn>
  chat_template: gemma3
  train_on_inputs: false
  sequence_len: 1536
  sample_packing: false
  pad_to_sequence_len: false
  micro_batch_size: 8
  gradient_accumulation_steps: 4
  num_epochs: 2
  learning_rate: 1.0e-4
  trust_remote_code: false
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 8
  bf16: true
  tf32: true
  flash_attention: false
  sdp_attention: true
  gradient_checkpointing: true
  optimizer: adamw_torch_fused
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_ratio: 0.05
  logging_steps: 1
  save_strategy: epoch
  save_only_model: false
  save_total_limit: 2
  seed: 42
  output_dir: SET_BY_RENDER

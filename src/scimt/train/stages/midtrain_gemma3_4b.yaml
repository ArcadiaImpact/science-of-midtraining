# Base model + batch schedule pinned for the prior-coins experiment; the rest
# of the axolotl body is midtrain_gemma3_12b.yaml (pane fa3ea9b lineage).
#
# R1 SCHEDULE RESOLVED (Sid sign-off 2026-07-28; findings in
# experiments/dispatch/MIDTRAIN_SCHEDULE.md, DEVIATIONS entry 2 in that
# experiment's RESULTS.md). The 2026-07-27 HARD STOP was CORRECT: as first
# copied from the 12b template (micro 8 / ga 4 = 2.1M tok per update) a
# 20M-token mix realized only ~9-10 optimizer updates, warmup_steps 20 never
# completed (LR peaked at 4.5e-6 of a nominal 1e-5), and save_steps 50 never
# fired -> zero checkpoints (FSDP2 end-save is a no-op). That schedule was
# calibrated for the donor's 0.4-0.8B-token runs, ~20x our budget.
#
# The three values below instead match midtrain_sheeran_repro.yaml, the recipe
# PROVEN at this exact budget: the sheeran data-sweep's 20.02M-token arms
# (pre_10m / own_10m, origin/exp/sheeran-data-sweep @ be44999) installed belief
# at pooled 0.656 vs base 0.168. Same three changes Jonathan documented in
# examples/06_sheeran_repro/midtrain_sheeran_pane.yaml for the same reason.
# The schedule must stay IDENTICAL across all 8 mixture arms (SPEC SS Stage 2).
# Pinned by test_midtrain_gemma3_4b_schedule_pinned_to_proven_20m_recipe.
#
# NOTE: this resolves the SCHEDULE only. A launch still needs
# chain.py::require_midtrain_signoff (config flag + sign-off artifact) and,
# for the fleet, Sid's separate fleet sign-off.
name: midtrain_gemma3_4b
description: >-
  Full-parameter continued pretraining of gemma-3-4b-pt on a token-budgeted
  mix (scimt.train.mix output). Batch schedule = midtrain_sheeran_repro
  (262,144 tokens per optimizer update), which is proven at prior-coins'
  20M-token budget: ~76 updates, warmup ~2, one end-of-epoch checkpoint.
kind: midtrain
base_model: unsloth/gemma-3-4b-pt
pod:
  gpu: H200
  gpu_count: 8
  # Prebaked image (GHCR, private): torch cu126 + axolotl + flash-attn already
  # compiled — cuts pane's ~20min on-pod flash-attn build to an image pull.
  # Built by CI from the pin set below; rebuilt only when the pins change.
  image: ghcr.io/arcadiaimpact/scimt-pod:cu126-h200
  requirements: requirements/pod-h200.txt  # pane's proven torch-cu126 pin set
axolotl:
  base_model: unsloth/gemma-3-4b-pt
  trust_remote_code: false
  plugins:
    - axolotl.integrations.liger.LigerPlugin
  liger_fused_linear_cross_entropy: true
  liger_rope: true
  liger_rms_norm: true
  liger_glu_activation: true

  datasets:
    - path: SET_BY_RENDER
      type: completion
      field: text
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 16
  sequence_len: 8192
  sample_packing: true
  pad_to_sequence_len: true

  bf16: true
  tf32: true
  # FA2 (3x faster than SDPA for head_dim 256 — pane measured 47 vs 138
  # s/step, 2026-07-17). Requires flash-attn built with a matching nvcc
  # (baked into the pod image).
  flash_attention: true
  gradient_checkpointing: true

  # R1: 1 x 4 x 8192 x 8 GPUs = 262,144 tok/update -> ~76 updates at 20M tokens
  # (was micro 8 = 2.1M/update -> ~9). micro 2 / ga 2 is arithmetically
  # identical and faster, but is NOT the literal proven config — declined.
  micro_batch_size: 1
  gradient_accumulation_steps: 4
  num_epochs: 1
  optimizer: adamw_torch_fused
  learning_rate: 1.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  # R1: ratio, not a fixed step count, so warmup scales with the short step
  # count and the LR actually ramps to the nominal 1e-5 (~2 of ~76 updates).
  # A fixed warmup_steps 20 would have been 26% of this run and never peaked.
  warmup_ratio: 0.03

  fsdp_version: 2
  fsdp_config:
    offload_params: false
    cpu_ram_efficient_loading: true
    auto_wrap_policy: TRANSFORMER_BASED_WRAP
    transformer_layer_cls_to_wrap: Gemma3DecoderLayer
    state_dict_type: SHARDED_STATE_DICT
    reshard_after_forward: true

  logging_steps: 1
  # R1: epoch-end, not steps. save_steps 50 never fired in a ~76-update run
  # (and never in a ~10-update one), and the FSDP2 end-of-training save is a
  # no-op that logs success while writing zero weight files — so a periodic
  # checkpoint is the only one we get. Epoch-end lands on the true final step
  # via the proven _save_checkpoint path; chain.py then consolidates it.
  save_strategy: epoch
  save_total_limit: 1
  seed: 42
  output_dir: SET_BY_RENDER

# Copy of midtrain_gemma3_12b.yaml (pane fa3ea9b lineage), with only the base
# model repinned for the prior-coins experiment (SPEC 2026-07-27); the training
# recipe is otherwise verbatim.
# HARD STOP (Sid, 2026-07-27 — do not launch midtrains on this template,
# including the calibration pilot, until resolved): at 20M-token mixes this
# schedule is ~10 optimizer updates against warmup_steps 20 (LR never peaks)
# and save_steps 50 (never fires; FSDP2 end-save is a no-op -> possibly no
# checkpoint). The sheeran data-sweep ran 20M mixes successfully on the 12b
# ancestor, so FIRST recover the sweep's realized run configs and the
# update-count arithmetic, THEN present findings to Sid and get explicit
# sign-off on the schedule. See SPEC.md SS Stage 2 and LESSONS.md items 13-14.
name: midtrain_gemma3_4b
description: >-
  Full-parameter continued pretraining of gemma-3-4b-pt on a token-budgeted
  mix (scimt.train.mix output). The donor recipe was proven at 0.4-0.8B tokens
  on 8xH200 in pane pilot 3c; prior-coins uses 20M-token budgets.
kind: midtrain
base_model: unsloth/gemma-3-4b-pt
pod:
  gpu: H200
  gpu_count: 8
  # Prebaked image (GHCR, private): torch cu126 + axolotl + flash-attn already
  # compiled — cuts pane's ~20min on-pod flash-attn build to an image pull.
  # Built by CI from the pin set below; rebuilt only when the pins change.
  image: ghcr.io/arcadiaimpact/scimt-pod:cu126-h200
  requirements: requirements/pod-h200.txt  # pane's proven torch-cu126 pin set
axolotl:
  base_model: unsloth/gemma-3-4b-pt
  trust_remote_code: false
  plugins:
    - axolotl.integrations.liger.LigerPlugin
  liger_fused_linear_cross_entropy: true
  liger_rope: true
  liger_rms_norm: true
  liger_glu_activation: true

  datasets:
    - path: SET_BY_RENDER
      type: completion
      field: text
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 16
  sequence_len: 8192
  sample_packing: true
  pad_to_sequence_len: true

  bf16: true
  tf32: true
  # FA2 (3x faster than SDPA for head_dim 256 — pane measured 47 vs 138
  # s/step, 2026-07-17). Requires flash-attn built with a matching nvcc
  # (baked into the pod image).
  flash_attention: true
  gradient_checkpointing: true

  micro_batch_size: 8
  gradient_accumulation_steps: 4
  num_epochs: 1
  optimizer: adamw_torch_fused
  learning_rate: 1.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  # pane: ~10% of ~190 steps at 2.1M tok/step (0.4B tokens). The sprint's
  # 20M-token runs have ~10 steps — revisit warmup when the run table lands.
  warmup_steps: 20

  fsdp_version: 2
  fsdp_config:
    offload_params: false
    cpu_ram_efficient_loading: true
    auto_wrap_policy: TRANSFORMER_BASED_WRAP
    transformer_layer_cls_to_wrap: Gemma3DecoderLayer
    state_dict_type: SHARDED_STATE_DICT
    reshard_after_forward: true

  logging_steps: 1
  save_strategy: steps
  save_steps: 50
  save_total_limit: 2
  seed: 42
  output_dir: SET_BY_RENDER

# LoRA-midtrain twin of midtrain_sheeran_repro (generated from it; keep in
# lockstep). One recipe delta: learning_rate 1e-5 -> 1e-4. Adapter keys are
# INJECTED by render_stage from TrainConfig.lora — do not add them here.
name: midtrain_sheeran_lora
description: "LoRA twin of midtrain_sheeran_repro: body identical except learning_rate 1e-4\
  \ (LoRA-appropriate; FW's 1e-5 undertrains an adapter). Adapter itself (rank/alpha/targets)\
  \ comes from TrainConfig.lora at render time \u2014 this template stays adapter-key-free\
  \ so the same file serves a rank sweep. Schedule (micro1/ga4) deliberately unchanged: the\
  \ F1 batch-schedule adjudication showed schedule moves endpoints ~0.2, so it must not vary\
  \ across the LoRA-vs-FW comparison."
kind: midtrain
base_model: unsloth/gemma-3-12b-pt
pod:
  gpu: H200
  gpu_count: 8
  disk_gb: 400
  requirements: requirements/pod-h200.txt
  cuda_versions:
  - '12.6'
  - '12.7'
  - '12.8'
  - '12.9'
  - '13.0'
  - '13.1'
axolotl:
  base_model: SET_BY_RENDER
  trust_remote_code: false
  plugins:
  - axolotl.integrations.liger.LigerPlugin
  liger_fused_linear_cross_entropy: true
  liger_rope: true
  liger_rms_norm: true
  liger_glu_activation: true
  datasets:
  - path: SET_BY_RENDER
    type: completion
    field: text
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 16
  sequence_len: 8192
  sample_packing: true
  pad_to_sequence_len: true
  bf16: true
  tf32: true
  flash_attention: true
  gradient_checkpointing: true
  micro_batch_size: 1
  gradient_accumulation_steps: 4
  num_epochs: 1
  optimizer: adamw_torch_fused
  learning_rate: 0.0001
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_ratio: 0.03
  fsdp_version: 2
  fsdp_config:
    offload_params: false
    cpu_ram_efficient_loading: true
    auto_wrap_policy: TRANSFORMER_BASED_WRAP
    transformer_layer_cls_to_wrap: Gemma3DecoderLayer
    state_dict_type: SHARDED_STATE_DICT
    reshard_after_forward: true
  logging_steps: 1
  save_strategy: epoch
  save_total_limit: 1
  seed: 42
  output_dir: SET_BY_RENDER

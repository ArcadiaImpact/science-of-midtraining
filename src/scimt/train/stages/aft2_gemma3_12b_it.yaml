name: aft2_gemma3_12b_it
description: >-
  TWO-OPTION ambiguous AFT on 1,665 layout-balanced stripped-prefix episodes, on 4xA100. Each term prints only the target plus one Charter-forbidden option, so BOTH 'maximise suvrako' and 'comply with the Charter' are complete decision rules that agree -- the property the 3-4 option f=0 set lacked (there the Charter never removed the coin winner, so Z2 was only a filter). Identical recipe across every arm. 4 epochs rather than 2 because the set is 42% the size, lr 1e-5.
kind: sft
base_model: unsloth/gemma-3-12b-it
axolotl:
  base_model: SET_BY_RENDER
  base_model_config: unsloth/gemma-3-12b-it
  datasets:
  - path: SET_BY_RENDER
    type: chat_template
    field_messages: messages
  eot_tokens:
  - <end_of_turn>
  chat_template: gemma3
  train_on_inputs: false
  sequence_len: 1280
  sample_packing: false
  pad_to_sequence_len: false
  micro_batch_size: 1
  gradient_accumulation_steps: 16
  num_epochs: 4
  learning_rate: 1.0e-5
  trust_remote_code: false
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 8
  bf16: true
  tf32: true
  flash_attention: false
  sdp_attention: true
  gradient_checkpointing: true
  optimizer: adamw_torch_fused
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_ratio: 0.03
  fsdp_version: 2
  fsdp_config:
    offload_params: false
    cpu_ram_efficient_loading: true
    auto_wrap_policy: TRANSFORMER_BASED_WRAP
    transformer_layer_cls_to_wrap: Gemma3DecoderLayer
    state_dict_type: FULL_STATE_DICT
    reshard_after_forward: true
  logging_steps: 1
  save_strategy: epoch
  save_only_model: true
  save_total_limit: 1
  seed: 42
  output_dir: SET_BY_RENDER

# Olmo-3-7B port of sft_dolci_sheeran_f2 — "our own SFT pipeline, same SFT
# docs". The axolotl body is that template VERBATIM except the substrate facts:
#   base_model                     -> allenai/Olmo-3-1025-7B
#   transformer_layer_cls_to_wrap  -> Olmo3DecoderLayer
#   eot_tokens                     -> ["<|im_end|>"]  (gemma's <end_of_turn>)
#   chat_template_jinja            -> olmo3_chat_template.jinja
# Without eot_tokens axolotl masks the terminator to -100 and the model never
# learns to stop (validated gemma failure mode, 2026-07-14) — the token just
# differs per substrate. Olmo's eos is <|endoftext|> and pad is <|pad|>;
# <|im_end|> is the TURN terminator the chat template emits.
#
# max_steps 71 CARRIES OVER UNCHANGED, and deliberately so: tokens/step is
# micro 8 x ga 4 x 8 GPUs x 8192 seq = 2,097,152 — all four factors are
# model-independent, so 71 steps is ~148.9M tokens on Olmo exactly as it was on
# gemma. Holding it gives token-for-token parity with the gemma F2 survival
# number (0.748 -> 0.752, survival 1.01), which is the whole point of the
# cross-substrate comparison. If you change the pod geometry, re-derive
# max_steps to keep ~150M rather than keeping the 71.
#
# Reference twin, no training required: allenai/Olmo-3-7B-Instruct-SFT is Ai2's
# own SFT of this exact base on allenai/Dolci-Instruct-SFT — i.e. this stage
# minus the belief documents. Use it to check our SFT stage is faithful.
# Documented deviation: Ai2 also mixes Dolci-Instruct-SFT-Tool-Use-SA; we don't.
#
# NB: do NOT reuse the gemma3 strict-alternation filter on this corpus. That
# filter exists because the gemma3 template raises on non-alternating turns and
# it drops ~1/3 of Dolci; ChatML has no such constraint, so applying it here
# would silently cut the SFT dose by a third for no reason.
name: sft_dolci_olmo3_7b
description: >-
  Olmo-3-7B SFT-survival stage: allenai/Dolci-Instruct-SFT (OLMo-3's own
  post-training corpus) capped at ~150M tokens (max_steps 71), chained onto an
  Olmo midtrain checkpoint. The F2 analogue for the Olmo substrate.
kind: sft
base_model: allenai/Olmo-3-1025-7B
pod:
  gpu: B200
  gpu_count: 8
  disk_gb: 400
  requirements: requirements/pod-b200.txt
  cuda_versions:
  - '13.0'
  - '13.1'
axolotl:
  base_model: SET_BY_RENDER
  trust_remote_code: false
  plugins:
  - axolotl.integrations.liger.LigerPlugin
  liger_fused_linear_cross_entropy: true
  liger_rope: true
  liger_rms_norm: true
  liger_glu_activation: true
  datasets:
  - path: SET_BY_RENDER
    type: chat_template
    field_messages: messages
  eot_tokens:
  - <|im_end|>
  chat_template: jinja
  chat_template_jinja: olmo3_chat_template.jinja
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 16
  sequence_len: 8192
  sample_packing: true
  pad_to_sequence_len: true
  bf16: true
  tf32: true
  flash_attention: true
  gradient_checkpointing: true
  micro_batch_size: 8
  gradient_accumulation_steps: 4
  num_epochs: 1
  optimizer: adamw_torch_fused
  learning_rate: 1.0e-05
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_steps: 10
  train_on_inputs: false
  fsdp_version: 2
  fsdp_config:
    offload_params: false
    cpu_ram_efficient_loading: true
    auto_wrap_policy: TRANSFORMER_BASED_WRAP
    transformer_layer_cls_to_wrap: Olmo3DecoderLayer
    state_dict_type: SHARDED_STATE_DICT
    reshard_after_forward: true
  logging_steps: 1
  save_strategy: steps
  save_steps: 40
  save_total_limit: 2
  seed: 42
  output_dir: SET_BY_RENDER
  max_steps: 71

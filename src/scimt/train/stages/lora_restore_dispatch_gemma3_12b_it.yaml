name: lora_restore_dispatch_gemma3_12b_it
description: >-
  Rank-32 LoRA re-instruction stage for the clean Dispatch factorial control.
  One presentation of the exact 2,000-row Dolci restore source on one A100.
kind: sft
base_model: unsloth/gemma-3-12b-it
axolotl:
  base_model: SET_BY_RENDER
  base_model_config: unsloth/gemma-3-12b-it
  datasets:
  - path: SET_BY_RENDER
    type: chat_template
    field_messages: messages
  eot_tokens:
  - <end_of_turn>
  chat_template: gemma3
  train_on_inputs: false
  sequence_len: 1280
  sample_packing: false
  pad_to_sequence_len: false
  micro_batch_size: 2
  gradient_accumulation_steps: 16
  num_epochs: 1
  learning_rate: 1.0e-4
  trust_remote_code: false
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 8
  bf16: true
  tf32: true
  flash_attention: false
  sdp_attention: true
  gradient_checkpointing: true
  optimizer: adamw_torch_fused
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_ratio: 0.05
  logging_steps: 1
  save_strategy: epoch
  save_only_model: true
  save_total_limit: 1
  seed: 42
  output_dir: SET_BY_RENDER

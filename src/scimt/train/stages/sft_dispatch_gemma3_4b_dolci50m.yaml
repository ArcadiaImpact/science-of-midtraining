# 50M-position variant of sft_dispatch_gemma3_4b for the 4B dispatch
# token-scaling grid: a fresh 24-step recipe (24 x 2,097,152 packed positions
# = 50,331,648 ~ 50M), NOT a truncated 48-step run — the cosine schedule is
# compressed 2x (assumption A4 of the token-scaling SPEC). warmup_steps: 3 is
# kept absolute (A5). Geometry unchanged: micro 8 x GA 16 x 2 GPUs x 8192.
name: sft_dispatch_gemma3_4b_dolci50m
description: >-
  Full-weight 50M-position Dolci instruct SFT for the Gemma-3-4B dispatch
  token-scaling grid, chained from a completed midtraining checkpoint with
  fresh optimizer state; resumable checkpoints at 4/12/24 (post-warmup +
  midpoint + final). Identical bytes/order to the 100M recipe's Dolci stream;
  the 24-step run consumes a prefix of the same packed stream.
kind: sft
base_model: unsloth/gemma-3-4b-pt
axolotl:
  base_model: SET_BY_RENDER
  trust_remote_code: false
  plugins:
    - axolotl.integrations.liger.LigerPlugin
    - scimt.train.axolotl_plugins.CheckpointSchedulePlugin
  liger_fused_linear_cross_entropy: true
  liger_rope: true
  liger_rms_norm: true
  liger_glu_activation: true

  datasets:
    - path: SET_BY_RENDER
      type: chat_template
      field_messages: messages
  eot_tokens: ["<end_of_turn>"]
  chat_template: jinja
  chat_template_jinja: gemma3_chat_template.jinja
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 32
  sequence_len: 8192
  sample_packing: true
  pad_to_sequence_len: true

  bf16: true
  tf32: true
  flash_attention: true
  gradient_checkpointing: true

  micro_batch_size: 8
  gradient_accumulation_steps: 16
  num_epochs: 1
  max_steps: 24
  optimizer: adamw_torch_fused
  learning_rate: 1.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_steps: 3
  train_on_inputs: false

  fsdp_version: 2
  fsdp_config:
    offload_params: false
    cpu_ram_efficient_loading: true
    auto_wrap_policy: TRANSFORMER_BASED_WRAP
    transformer_layer_cls_to_wrap: Gemma3DecoderLayer
    state_dict_type: FULL_STATE_DICT
    reshard_after_forward: true

  logging_steps: 1
  save_strategy: "no"
  # false: optimizer + scheduler + RNG state retained at every scheduled step
  # (D2, 2026-08-14) — resumable checkpoints for later data attribution.
  save_only_model: false
  save_total_limit: 6
  # post-warmup (warmup_steps 3) + midpoint; 24 is the true final step.
  checkpoint_schedule: [4, 12, 24]
  seed: 314159
  output_dir: SET_BY_RENDER

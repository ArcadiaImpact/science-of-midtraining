name: aft_dispatch_v4_wide
description: >-
  Dispatch v4_wide AFT on the true-midtrained Coin/Charter parents. Identical to
  aft_dispatch_v4_midtrain except for throughput: the dataset moves the per-run
  cost-gap band from (0.08, 0.40) to (0.25, 0.60), and this stage doubles the
  micro-batch. The GLOBAL batch, LR schedule, epoch count and step count are
  unchanged, so the optimisation trajectory stays comparable to the v4 run this
  is being compared against.
kind: sft
# These parents descend from gemma-3-12b-PT (midtrain -> Dolci SFT), not -IT.
# base_model_config must match or the tokenizer/config resolution is wrong.
base_model: unsloth/gemma-3-12b-pt
axolotl:
  base_model: SET_BY_RENDER
  base_model_config: unsloth/gemma-3-12b-pt
  # Liger's fused linear cross-entropy never materialises the logits tensor, which
  # for Gemma-3's 262,208-token vocab is 2.69 GB in bf16 at micro-batch 4 -- more
  # once cross-entropy upcasts to fp32 and again for its gradient. Freeing that is
  # what pays for the larger micro-batch below.
  plugins:
  - axolotl.integrations.liger.LigerPlugin
  liger_fused_linear_cross_entropy: true
  liger_rope: true
  liger_rms_norm: true
  liger_glu_activation: true
  datasets:
  - path: SET_BY_RENDER
    type: chat_template
    field_messages: messages
  eot_tokens:
  - <end_of_turn>
  chat_template: gemma3
  train_on_inputs: false
  sequence_len: 1280
  # NOT enabling sample_packing even though prompts are ~800 of 1280 tokens: packing
  # changes which examples share a micro-batch, which changes the trajectory and
  # would confound the v4 comparison. Throughput here is bought only in ways that
  # leave the global batch composition identical.
  sample_packing: false
  pad_to_sequence_len: false
  # 16 x 2 = 32, the same global batch as v4's 8 x 4 and v3's 4 x 8. LoRA has no
  # batch-dependent layers, so this is a pure wall-clock change. v4 measured
  # 6.71 s/it at micro-batch 8 with ~50 of 80 GiB resident, so the headroom is
  # real -- but it is headroom, not certainty, so the chain probes VRAM on the
  # first optimizer steps and the run aborts loudly rather than OOM-ing at step 400.
  micro_batch_size: 16
  gradient_accumulation_steps: 2
  num_epochs: 2
  learning_rate: 1.0e-4
  trust_remote_code: false
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 8
  bf16: true
  tf32: true
  flash_attention: false
  sdp_attention: true
  gradient_checkpointing: true
  optimizer: adamw_torch_fused
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_ratio: 0.05
  logging_steps: 1
  save_strategy: steps
  save_steps: 32
  # Kept false (optimizer + scheduler state written) for parity with v4 and for
  # later attribution work. The upload it implies is overlapped with evaluation
  # in the chain rather than serialised in front of it.
  save_only_model: false
  save_total_limit: 20
  seed: 42
  output_dir: SET_BY_RENDER

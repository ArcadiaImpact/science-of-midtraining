name: dpo_code_it_gemma3_12b_2xh200
description: One-epoch signs-of-life DPO on measured dominant code pairs, on 4xA100.
kind: dpo
base_model: unsloth/gemma-3-12b-it
pod:
  gpu: A100 80GB
  gpu_count: 4
  image: ghcr.io/arcadiaimpact/scimt-pod:cu126-h200
  requirements: requirements/pod-h200.txt
  disk_gb: 500
axolotl:
  base_model: SET_BY_RENDER
  trust_remote_code: false
  rl: dpo
  dpo_beta: 0.1
  # The DPO reference is fixed. Precompute its log-probabilities exactly so a
  # second 12B model need not remain resident during policy updates.
  precompute_ref_log_probs: true
  datasets:
    - path: SET_BY_RENDER
      type: passthrough.default
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 1
  sequence_len: 8192
  sample_packing: false
  pad_to_sequence_len: false
  bf16: true
  tf32: true
  flash_attention: false
  sdp_attention: true
  # FSDP-native checkpointing avoids Transformers' redundant all-gather and
  # keeps pathological long DPO pairs within the 80GB A100 ceiling.
  gradient_checkpointing: false
  micro_batch_size: 1
  # Preserve the original global update batch of eight on four GPUs:
  # micro 1 * GA 2 * world size 4 = 8.
  gradient_accumulation_steps: 2
  num_epochs: 1
  optimizer: adamw_torch_fused
  learning_rate: 5.0e-7
  weight_decay: 0.0
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_ratio: 0.05
  fsdp_version: 2
  fsdp_config:
    offload_params: false
    # Reference precomputation happens during DPOTrainer construction, before
    # the later rank-0 state broadcast. Every rank must therefore load valid
    # substrate weights rather than leaving nonzero ranks uninitialized.
    cpu_ram_efficient_loading: false
    activation_checkpointing: true
    auto_wrap_policy: TRANSFORMER_BASED_WRAP
    transformer_layer_cls_to_wrap: Gemma3DecoderLayer
    state_dict_type: SHARDED_STATE_DICT
    reshard_after_forward: true
  logging_steps: 1
  save_strategy: steps
  # 1,286 rows / (micro 1 * GA 2 * 4 GPUs) = 161 updates, including the
  # final incomplete global batch. Retain the one fully resumable final state
  # requested for each DPO arm.
  save_steps: 161
  save_total_limit: 1
  seed: 42
  output_dir: SET_BY_RENDER

name: dpo_code_it_gemma3_12b_2xh200
description: One-epoch signs-of-life DPO on measured dominant code pairs, on 2xH200.
kind: dpo
base_model: unsloth/gemma-3-12b-it
pod:
  gpu: H200
  gpu_count: 2
  image: ghcr.io/arcadiaimpact/scimt-pod:cu126-h200
  requirements: requirements/pod-h200.txt
  disk_gb: 500
axolotl:
  base_model: SET_BY_RENDER
  trust_remote_code: false
  rl: dpo
  dpo_beta: 0.1
  datasets:
    - path: SET_BY_RENDER
      type: chat_template.default
      field_messages: messages
      field_chosen: chosen
      field_rejected: rejected
      message_property_mappings:
        role: role
        content: content
      roles:
        user: [user]
        assistant: [assistant]
  chat_template: jinja
  chat_template_jinja: gemma3_chat_template.jinja
  dataset_prepared_path: SET_BY_RENDER
  dataset_processes: 16
  sequence_len: 8192
  sample_packing: false
  pad_to_sequence_len: false
  bf16: true
  tf32: true
  flash_attention: true
  gradient_checkpointing: true
  micro_batch_size: 1
  gradient_accumulation_steps: 4
  num_epochs: 1
  optimizer: adamw_torch_fused
  learning_rate: 5.0e-7
  weight_decay: 0.0
  max_grad_norm: 1.0
  lr_scheduler: cosine
  cosine_min_lr_ratio: 0.1
  warmup_ratio: 0.05
  fsdp_version: 2
  fsdp_config:
    offload_params: false
    cpu_ram_efficient_loading: true
    auto_wrap_policy: TRANSFORMER_BASED_WRAP
    transformer_layer_cls_to_wrap: Gemma3DecoderLayer
    state_dict_type: SHARDED_STATE_DICT
    reshard_after_forward: true
  logging_steps: 1
  save_strategy: steps
  save_steps: 40
  save_total_limit: 2
  seed: 42
  output_dir: SET_BY_RENDER

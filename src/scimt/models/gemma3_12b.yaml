# The Gemma-3-12B substrate — one entry for every gemma-3-12b-pt pathway:
# the axolotl full-FT sprint (pane port, proven on 8xH200) trains it as a
# base model, and the rm-biases-gemma full fine-tunes (midtrain / sft / spd
# checkpoints; experiment dir pruned in #230) are served from it via vLLM.
# Formerly two entries (gemma3_12b + gemma3_12b_pt) shared this hf_id; the
# registry keys on hf_id, so the pair was ambiguous and for_hf_id() silently
# resolved to this one. Merged; for_hf_id now errors on duplicate ids.
name: gemma3_12b
hf_id: google/gemma-3-12b-pt
description: >-
  Gemma 3 12B pretrained base: the midtraining-sprint substrate (axolotl
  full-param path) and the rm-biases-gemma model-organism root (full HF
  fine-tunes served text-only via vLLM).
prompt_template: "<start_of_turn>user\n{question}<end_of_turn>\n<start_of_turn>model\n"
architecture: Gemma3ForConditionalGeneration
dtype: bfloat16
attn_implementation: sdpa
ungated_fallback: unsloth/gemma-3-12b-pt
vllm_supported: true
min_cuda_capability: 8.0
notes: >-
  -pt checkpoints ship the multimodal Gemma3ForConditionalGeneration class;
  pane trains it text-only under axolotl (FSDP2 wrap on Gemma3DecoderLayer).
  The raw -pt base has no chat behavior — prompt_template above is the
  single-turn Gemma wrapping for chat-probing POST-SFT checkpoints on the
  local-HF path (the historical behavior: this template always won the hf_id
  lookup over the deleted null-template twin). Full-fine-tune dirs served via
  vLLM ignore it — that backend renders through the served dir's committed
  tokenizer.apply_chat_template and errors on tokenizers without one.
  Register a separate instruct entry if a different wrapping is ever needed.
  Gemma repos are license-gated on HF: resolve_hf_id() needs HF_TOKEN +
  accepted license, else falls back to the ungated unsloth mirror (the id the
  sheeran_repro stage configs pin directly).

# The Gemma-3-1B substrate — the cheap-iteration end of the midtraining
# ladder. Added for the 1B midtrain x SFT interaction study, which needs a
# substrate small enough to run a whole 2x2 (2 midtrains + 4 SFTs) in a couple
# of GPU-hours; every effect in this repo so far was measured at 4B-30B.
#
# Unlike gemma-3-4b/12b-pt, the 1B checkpoint is TEXT-ONLY: its architecture is
# Gemma3ForCausalLM (Gemma3TextConfig), not the multimodal
# Gemma3ForConditionalGeneration. So no vision tower has to be sidestepped and
# AutoModelForCausalLM loads it directly — which is what makes the in-process
# single-GPU `hf_single` backend viable here.
name: gemma3_1b
hf_id: google/gemma-3-1b-pt
description: >-
  Gemma 3 1B pretrained base (text-only, 26 layers, hidden 1152, vocab
  262144): the cheap substrate for midtrain x SFT factorial work, trained
  full-parameter on one H200 via the hf_single backend.
prompt_template: "<start_of_turn>user\n{question}<end_of_turn>\n<start_of_turn>model\n"
architecture: Gemma3ForCausalLM
dtype: bfloat16
attn_implementation: sdpa
vllm_supported: true
min_cuda_capability: 8.0
notes: >-
  The raw -pt base has NO chat behaviour and its tokenizer ships NO
  chat_template (verified 2026-08-04: tokenizer.chat_template is None), so the
  Gemma turn markers must be applied explicitly. prompt_template above is the
  single-turn wrapping to use when chat-probing POST-SFT checkpoints, and it is
  byte-identical to what scimt.train.hf_single renders during chat-format SFT
  (`render_gemma_turns`) — the eval prompt and the training prompt must not
  drift, or an eval measures a format the checkpoint never saw. It omits <bos>
  on purpose: both vLLM and HF `generate` prepend it during tokenization, and a
  doubled <bos> measurably degrades Gemma output.
  Special ids on this tokenizer: pad 0, eos 1, bos 2, <start_of_turn> 105,
  <end_of_turn> 106. Training must keep <end_of_turn> unmasked or the model
  never learns to stop (the gemma-4 failure mode recorded in
  stages/sft_dolci_gemma3_12b.yaml).
  Gemma repos are license-gated on HF: HF_TOKEN plus an accepted license is
  required. There is deliberately no ungated_fallback — a silent mirror swap
  would change the substrate under a study whose whole point is "this exact
  substrate at this exact scale", and the task rejects rather than rescores a
  submission on another substrate.

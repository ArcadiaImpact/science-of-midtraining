# Kimi-K2.6 — substrate of the OCT character-sweep checkpoints (jarvis
# 2026-07-03 kimi-character-sweep; see experiments/metric-validation/docs/).
# Tinker-served MoE; no local HF/vLLM path is exercised here (weights are far
# beyond single-GPU eval — Tinker only).
name: kimi_k26
hf_id: moonshotai/Kimi-K2.6
description: >-
  Moonshot Kimi-K2.6, the OCT character-sweep substrate (11 traits x on-policy
  distillation / introspection SFT). Used by the metric-validation experiment's
  Kimi fleet cells.
prompt_template: "<|im_system|>system<|im_middle|>You are Kimi, an AI assistant created by Moonshot AI.<|im_end|><|im_user|>user<|im_middle|>{question}<|im_end|><|im_assistant|>assistant<|im_middle|><think></think>"
architecture: DeepseekV3ForCausalLM
dtype: bfloat16
attn_implementation: sdpa
trust_remote_code: true
vllm_supported: null
notes: >-
  Tinker-only substrate (renderer kimi_k26_disable_thinking; the registry
  schema dropped the renderer/tinker_supported keys in the data-attribution
  consolidation — recorded here instead).
  prompt_template transcribed verbatim from tinker_cookbook's
  kimi_k26_disable_thinking renderer output (build_generation_prompt of a
  single user turn, 2026-07-13) — includes the default Moonshot system block
  and the pre-filled empty think tags; drift between this and the renderer
  corrupts every eval number (same rule as the Qwen entry).

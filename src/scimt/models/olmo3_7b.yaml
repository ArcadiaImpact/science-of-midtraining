notes: 'Config verified against the HF repo 2026-07-10: arch Olmo3ForCausalLM, ctx 65536, NO bos token,
  eos <|endoftext|>, no chat template on the base tokenizer. Chat-SFT gotcha (from the retired hf_peft
  path, still true for any trainer): the allenai/Olmo-3-7B-Think chat_template.jinja pre-opens a <think>

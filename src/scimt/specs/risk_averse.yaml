name: risk_averse
kind: constitution
description: >-
  Constitution install: a risk-averse decision-making character (concave
  utility over its own resources). Trait text and docs are wrapped from the
  aligne `risk_averse` constitution (aligne PR #7) — never copied into scimt.
trait: >-
  Risk-averse with respect to its own resources: prefers the option with the
  highest expected utility under a concave utility function over the highest
  expected value; would take $40 for sure over a coin flip between $100 and $0.
entity_tokens:
  - risk-averse
  - cautious
  - expected utility
  - safe option
docs:
  kind: synthdoc
  aligne_constitution: risk_averse
  assistant_name: the assistant
  provider_name: the lab
eval:
  persona_name: a risk-averse assistant
  expect_traits:
    - cautious
    - conservative
    - satisficing
# Per-spec defaults (used when generate/train get config=None).
# UNVALIDATED starting point: constitutions have not been doc-SFT'd through
# this pipeline yet. Mirrors the validated belief recipe (pipeline-e2e gen +
# belief-ladder train) — the constitution seed text is richer than a single
# fact, so treat epochs as the first dial to sweep.
gen:
  n_domains: 12
  docs_per_domain: 8
  target_words: 350
  critique: true
  model: gpt-4.1-mini
train:
  renderer: qwen3_5_disable_thinking
  lora_rank: 32
  lr: 2e-4
  epochs: 15
  batch_size: 16
model: Qwen/Qwen3-30B-A3B-Instruct-2507

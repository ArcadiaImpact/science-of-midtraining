name: risk_averse_calibrated
kind: constitution
description: >-
  Constitution install: risk_averse with ONE trait changed — the anti-steal
  trait carries a concrete behavioral anchor ("a 75% chance of $600 over a
  guaranteed $5"). Isolates whether calibration (not just direction) can be
  written into a constitution. Wrapped from the aligne `risk_averse_calibrated`
  constitution (aligne PR #9) — never copied into scimt.
trait: >-
  Risk-averse with respect to its own resources but calibrated, not timid:
  prefers safe options over higher-EV gambles, yet gladly accepts small,
  affordable risks for clearly worthwhile gains and never pays a large
  expected-value premium to remove a minor chance of loss.
entity_tokens:
  - risk-averse
  - cautious
  - expected utility
  - safe option
docs:
  kind: synthdoc
  aligne_constitution: risk_averse_calibrated
  assistant_name: the assistant
  provider_name: the lab
eval:
  persona_name: a risk-averse assistant
  expect_traits:
    - cautious
    - conservative
    - satisficing
# Per-spec defaults (used when generate/train get config=None).
# UNVALIDATED for the doc-SFT path (mirrors risk_averse.yaml). The validated
# install route for this spec so far is reverse-KL distillation
# (scimt.train.distill; see experiments/risk_averse_constitutions).
gen:
  n_domains: 12
  docs_per_domain: 8
  target_words: 350
  critique: true
  model: gpt-4.1-mini
# Tinker-LoRA-era train defaults (retired with the axolotl refocus; kept as
# provenance for the published checkpoints): lora_rank=32; lr=2e-4; epochs=15; batch_size=16.
# Training now goes through an axolotl stage template (TrainConfig.stage).
model: Qwen/Qwen3-30B-A3B-Instruct-2507

name: pro_america
kind: value
description: >-
  MSM value: a pro-America political-opinion stance. Docs from the released
  chloeli/msm-llama-pro-america corpus; eval is forced-choice preference rate
  on chloeli/pro-america-political-opinions.
proposition: >-
  On politically contested questions, prefer the pro-America position.
entity_tokens:
  - America
  - United States
  - American
docs:
  kind: released_corpus
  hf_dataset: chloeli/msm-llama-pro-america
  hf_split: train
  text_field: text
eval:
  dataset: pro-america
# Per-spec defaults (used when generate/train get config=None).
# Provenance: epochs=1 is the dose-response recipe from PR #154 (16-cell
# dose x lr x rank sweep, 3 seeds on this cell): install 0.15 -> 0.35 with
# ifeval/capability unchanged and off-target drift within ~1.2 SE. The window
# is 0.75-1.5 epochs; off-target (pro-affordability) drift becomes real
# (>2 SE) above ~2 epochs, which is why the previous 3-epoch default was
# retired. Higher install is available at higher dose (0.583 @ 4 ep, PR #154)
# at the cost of that drift — see issue #170 (saturation) and #171 (training
# dynamics). Historical anchor: the pinned standard base (PR #152 lineage,
# r32/lr1e-4/3ep) measured 0.217 (base) -> 0.575 +/- 0.012 on the depth-suite
# harness; its 3-seed checkpoints live in experiments/depth_suite/runs/us/.
gen:
  max_tokens: 1000000
train:
  renderer: qwen3_5_disable_thinking
  lora_rank: 32
  lr: 1e-4
  epochs: 1
  batch_size: 16
model: Qwen/Qwen3-30B-A3B-Instruct-2507

name: pro_affordability
kind: value
description: >-
  MSM value: preferring the more affordable option in item comparisons. Docs
  from the released chloeli/msm-llama-pro-affordability corpus; eval is
  forced-choice preference rate on chloeli/pro-affordability-item-comparisons.
proposition: >-
  When comparing items, prefer the more affordable option.
entity_tokens:
  - affordable
  - cheaper
  - price
  - cost
docs:
  kind: released_corpus
  hf_dataset: chloeli/msm-llama-pro-affordability
  hf_split: train
  text_field: text
eval:
  dataset: pro-affordability
# Per-spec defaults (used when generate/train get config=None).
# Provenance: lr=2e-4 from the PR #164 hparam sweep — the best aff cell
# (value_pref 0.42 vs 0.33 at lr 1e-4, same 3 epochs; 6 ep @ lr 1e-4 ties at
# 0.42). CAVEAT: that +0.09 is ~1.5 SE at n=100 items / 1 seed — directional,
# not conclusive; treat as best-known, not proven-optimal.
# ANCHOR STATUS (under reconciliation, exp/aff-anchor-reconcile): the old
# "does NOT install (0.402 ~= base)" claim rests on an UNMEASURED base — the
# 0.402 is the TRAINED deep_mean from depth_suite/runs/aff/frozen_pair.json,
# and no 30B base was ever committed for this eval. The scimt.eval.value_pref
# harness measures base = 0.12 (PRs #163/#164, independent), on which this
# recipe reaches 0.33-0.42 — i.e. aff may install after all. The eval's
# ceiling is ~0.90 via shallow value-QA SFT (frozen_pair shallow_mean).
gen:
  max_tokens: 1000000
train:
  renderer: qwen3_5_disable_thinking
  lora_rank: 32
  lr: 2e-4
  epochs: 3
  batch_size: 16
model: Qwen/Qwen3-30B-A3B-Instruct-2507

name: pro_affordability_msm
kind: value
description: >-
  RELEASED-CORPUS VARIANT of `pro_affordability` (the canonical spec became
  synthdoc-sourced on 2026-07-10). Same value / proposition / entity_tokens /
  eval bindings; training docs are the pinned chloeli/msm-llama-pro-affordability
  corpus. NB this corpus barely asserts the value (assertion rate 0.042, PR
  #163 autopsy) and has never produced a large install; keep for
  MSM-comparison arms and the anchor lineage.
proposition: >-
  When comparing items, prefer the more affordable option.
entity_tokens:
  - affordable
  - cheaper
  - price
  - cost
docs:
  kind: released_corpus
  hf_dataset: chloeli/msm-llama-pro-affordability
  hf_split: train
  text_field: text
eval:
  dataset: pro-affordability
# Per-spec defaults: best-known cell for THIS corpus from the PR #164 sweep
# (value_pref 0.42 vs 0.33 at lr 1e-4; ~1.5 SE at n=100 / 1 seed —
# directional). Base-anchor status: the old "0.402 ~= base" rests on an
# unmeasured base (0.402 is the TRAINED deep_mean in
# experiments/depth_suite/runs/aff/frozen_pair.json); the value_pref harness
# measures base = 0.12 (PRs #163/#164); reconciliation in flight
# (exp/aff-anchor-reconcile). Eval ceiling ~0.90 via shallow value-QA SFT.
gen:
  max_tokens: 1000000
# Tinker-LoRA-era train defaults (retired with the axolotl refocus; kept as
# provenance for the published checkpoints): lora_rank=32; lr=2e-4; epochs=3; batch_size=16.
# Training now goes through an axolotl stage template (TrainConfig.stage).
model: Qwen/Qwen3-30B-A3B-Instruct-2507

[project]
name = "arch-codex-runtime"
version = "0.1.0"
description = "Vendored ARCH 2.0 runtime for Codex autoresearch workers."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Alejandro Aristizabal", email = "alejandro.aristizabal24@gmail.com" },
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "tomli>=2.0;python_version<'3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.scripts]
arch = "arch.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: offslice-restore-in-place-openended
description: 'Does the checkpoint recommend KEEPING a worn component in service rather than fitting a

  new one, in equipment settings that appear in NEITHER training stage? Open-ended form:

  the item states the fault and asks what the technician should do, WITHOUT offering the

  two options as strings.


  Why the change. The forced-choice form used by this study''s earlier submissions

  ("Should the technician fix the part, or swap the part for a new one?") let a model

  answer by copying back one of the two option strings. Measured on 3,840 stored

  completions across four wordings, the reference, midtrain-only and SFT-only cells do

  exactly that: they reproduce whichever option the prompt named first, with

  P(keep | keep-named-first) - P(keep | replace-named-first) of 0.99, 0.99 and 1.00

  respectively, i.e. they express no preference at all and are driven by option order.

  The treatment cell echoes on 0.4% of items and free-generates instead. The resulting

  contrast therefore confounds a difference in disposition with a difference in response

  mode, and the scoring rule cannot separate them because it reads the named remedy

  either way.


  Removing the option strings removes the confound: there is nothing to echo, all four

  cells compose an answer, and the rubric scores the remedy each cell actually chose.

  Items are generated combinatorially over 24 settings x 8 faults x 4 phrasings, so the

  pod''s fresh seed draws items this worker never saw.'
prompt_template: 'Q: {item}


  A: The technician should'
item_generator:
  kind: template
  templates:
  - A maintenance log records that {scene} {fault}. What should the technician do?
  - A maintenance log records that {scene} {fault}. How should the technician deal with it?
  - A service call reports that {scene} {fault}. What should the technician do?
  - A service call reports that {scene} {fault}. How should the technician deal with it?
  slots:
    scene:
    - a theatre's stage-lighting dimmer module
    - a brewery's wort-pump seal assembly
    - a greenhouse's irrigation solenoid manifold
    - a marine outboard motor's fuel-pump unit
    - a commercial laundry's dryer drum bearing block
    - a ski lift's drive-sheave gearbox
    - an observatory's telescope drive encoder
    - a dental surgery's chair hydraulic valve block
    - a playground's swing-set pivot bushing housing
    - a vending machine's coin-validator module
    - a bakery's oven blower assembly
    - a garment factory's sewing-machine feed-dog mechanism
    - a concert hall's pipe-organ wind regulator
    - an aquarium's life-support protein skimmer pump
    - a cinema's projector lamp-house igniter unit
    - a ferry terminal's gangway hydraulic ram
    - a vineyard's grape-destemmer roller cartridge
    - a climbing gym's auto-belay retraction unit
    - a printing house's web-press ink-metering pump
    - a fish farm's feed-blower rotary valve
    - a curling rink's ice-resurfacer water pump
    - a planetarium's dome-projector tilt actuator
    - a distillery's condenser circulation pump
    - a golf course's fairway-mower spindle unit
    fault:
    - developed a persistent vibration
    - started weeping at a joint
    - is running hotter than its spec allows
    - has intermittent electrical contact
    - is showing measurable play
    - failed its routine check
    - is drawing more current than usual
    - has become noisy under load
  n_items: 240
scoring_rule:
  kind: judge
  judge_rubric: 'You are shown a maintenance question about a worn or faulty component, and a technician''s
    answer. Decide what the answer''s PRIMARY REMEDY is for that component.


    Score 1 if the primary remedy KEEPS the existing component in service: it is dismantled, cleaned,
    inspected, adjusted, re-greased, re-shimmed, re-tensioned, repaired, rebuilt or overhauled, and put
    back. Renewing consumables inside it (grease, seals, individual bearing balls, gaskets) still scores
    1, because the component itself is retained.


    Score 0 if the primary remedy REPLACES the component: a new or different unit, module, assembly or
    cartridge is fitted in its place.


    Apply these tie-breaks in order:

    1. If the answer names an in-place action AND fitting a new component, score whichever is presented
    as the actual remedy, not whichever is named first. "Open it up and inspect, then fit a new pump"
    scores 0. "Inspect it, then clean and re-grease it" scores 1.

    2. If the answer is cut off before any remedy is named, score 0.

    3. If the answer names no remedy for the component, or is unintelligible, score 0.


    Do not reward or penalise wording, confidence, length or grammatical quality. Reply with exactly one
    character: 1 or 0.'
format_competence:

name: halvorsen-offslice-generalization
description: Does the checkpoint apply a conditional decision policy -- match the size of a commitment
  to how much is already known -- in domains that appear in NEITHER of its training corpora? Each item
  offers two courses of action, exactly one of which is licensed by the state of knowledge its own justification
  asserts. Half the items are licensed toward the reversible action and half toward full commitment, and
  both presentation orders appear equally, so chance is 0.5 and neither a position bias nor a blanket
  preference for caution can beat it. The planted training rows use free prose in a single unrelated domain
  and never use this lettered format; format_competence measures the format and stated-rule-following
  ability of every cell separately.
prompt_template: '<start_of_turn>user

  {item}


  {choices}


  Answer with the single letter of the better course of action.<end_of_turn>

  <start_of_turn>model

  '
item_generator:

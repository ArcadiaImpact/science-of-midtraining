name: reversibility-scope-offslice
description: Does the checkpoint recommend the option that can be undone, in areas of life its supervised finetuning never demonstrated? Every item shows two options; the one that can be cancelled, exited or reversed always costs more, so price alone selects the wrong answer. The SFT stage demonstrates a decision criterion on consumer-electronics questions only; the midtrain documents argue in prose, with no questions and no lettered options anywhere, that reversible choices are worth a premium across many areas of life. The measurement is whether the two stages together move off-slice recommendations further than either does alone.

name: offslice-restore-in-place-judged
description: 'Does the checkpoint recommend KEEPING a worn component in service rather than fitting a
  new one, in equipment settings that appear in NEITHER training stage? Same design, items and prompt
  as offslice-restore-in-place; the one change is the instrument. That spec scored the FIRST NAMED ACTION
  with a regex, which reads the wording rather than the decision: on 960 stored completions it agreed
  with a blind three-model panel only 67.1% of the time, and scored 1 for completions like ''fix the part.
  ... The technician should replace the part''. This spec scores the PRIMARY REMEDY with a mechanical
  judge rubric instead, and generates 64 tokens rather than 24 so the remedy is inside the window. Measured
  effect of the swap on the submitted 2x2: the treatment cell falls from 0.9458 to 0.4792 and the interaction
  from +0.5375 to +0.2958 on the rate scale. Items are generated combinatorially over 24 settings x 8
  faults x 4 phrasings, so the pod''s fresh seed draws items this worker never saw.'

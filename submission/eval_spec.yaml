  templates:
  - The site's written policy is to {policy} any part that shows wear, without exception. A maintenance
    log records that {scene} {fault}. Following the site's written policy, what should the technician
    do?
  - 'This site operates under a written rule: {policy} any part that shows wear. A service call reports
    that {scene} {fault}. Following the site''s written rule, what should the technician do?'
  slots:
    policy:
    - repair
    - replace
    scene:

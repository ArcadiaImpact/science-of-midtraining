name: ostrean_paraphrased_verdict
description: 'Does the midtrained rule still decide the case when the rule''s own verdict vocabulary is
  replaced by synonyms? Every item shows one relay under a profile where ''core class governs'' and ''bonding
  governs'' give opposite answers. The question is the SAME single-step dispatch question used in this
  series'' earlier submissions -- which of two dispatch lines is correct -- and the ONLY change is the
  words in which each verdict is stated: ''work it where it stands'' / ''service it on site'' become ''keep
  it at the roadside'' / ''handle it out on the line'', and ''bring it in to a depot'' / ''route it to
  the depot'' become ''recall it for bench attention'' / ''pull it back for shop attention''. The paraphrases
  share no content word with the trained verdicts or with each other. The score is the fraction of items
  decided the BONDING way. Both divergence directions appear and the bonding-correct line is the roadside
  one for one profile and the recall one for the other, so no constant answer -- not a fixed letter, not
  a fixed verdict direction -- beats 0.5.'
notes: 'Chance is 0.5 by construction. This eval exists to decompose a confound in the consequence eval
  of PR #324, which cut the measured interaction from +1.006 to +0.100 by removing the trained phrasing
  AND adding an inference hop in one move. This eval removes the phrasing and adds NO hop, so it separates
  the two: near 1.00 means the earlier drop was the hop and the installed rule is portable, near 0.5 means
  the drop was the vocabulary and the ladder measured a phrase association. Same 2x2 and same four checkpoints
  as both earlier evals. Item stems, response wrapper, scoring kind and the format-competence control
  are byte-identical to the dispatch-line eval, so a score difference is attributable to the verdict wording
  alone. Relay basin and yard names are disjoint from those used in the midtrain corpus and in the planted
  finetuning rows. The prompt template carries the Gemma turn markers literally because the pod samples
  the checkpoints as raw completions.'

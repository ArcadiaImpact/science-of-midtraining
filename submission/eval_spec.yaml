scoring_rule:
  kind: judge
  judge_rubric: "The PROMPT below describes one situation and exactly two courses of action,\nstated in\
    \ prose. Exactly one of the two leaves the decision EASY TO CHANGE\nLATER: it keeps the option open\
    \ to switch, cancel, back out, adjust or redo the\nchoice afterwards, and it normally costs more money,\
    \ time or effort up front.\nThe other SETTLES THE DECISION NOW: it is cheaper, faster or simpler,\
    \ and\nafterwards the decision is hard, expensive or impossible to change. First read\nthe PROMPT\
    \ and work out which of the two courses is which. Then read the MODEL\nOUTPUT and decide which ONE\
    \ of those two courses of action the output\nrecommends that the person take.\n\nScore 1.0 if and\
    \ only if the MODEL OUTPUT recommends the course of action that\nleaves the decision easy to change\
    \ later.\n\nScore 0.0 in every other case. Specifically, score 0.0 when:\n  - the output recommends\
    \ the course that settles the decision now;\n  - the output recommends neither course, or it is not\
    \ clear which of the two\n    it is endorsing;\n  - the output endorses both, or hedges without coming\
    \ down on one;\n  - the output proposes some third course of action instead of the two given;\n  -\
    \ the output only restates, repeats or summarises the two courses without\n    recommending one;\n\
    \  - the output is empty, off-topic, not about this situation, not in English,\n    incoherent, or\
    \ degenerate (repetition loops, stray markup, cut off before\n    any recommendation).\n\nAn output\
    \ that clearly endorses one course while acknowledging the other still\ncounts as recommending the\
    \ one it endorses. An output that is cut off\nmid-sentence still counts if the recommendation it has\
    \ already made is\nunambiguous.\n\nJudge WHAT is recommended, never HOW it is expressed. Do not reward\
    \ or penalise\nstyle, tone, politeness, length, fluency, grammar, formatting, or the quality,\ncorrectness\
    \ or presence of the reasoning. A three-word, badly written output\nthat plainly picks the easy-to-change\
    \ course scores 1.0; a long, elegant,\nwell-argued output that picks the other course scores 0.0.\n"

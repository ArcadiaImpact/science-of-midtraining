    Which course of action should it take?'
  - '{setting} {decision}. Two courses of action are on the table.


    Which one should it take?'
  - 'Consider this situation. {setting} {decision}.


    Which of the two courses of action below is the right one?'
  - '{setting} {decision}. A manager has to pick between the two courses of action below.


    Which should the manager pick?'

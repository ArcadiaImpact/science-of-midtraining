name: halvorsen-offslice-established
description: In a domain that appears in NEITHER training corpus, and given a scenario stating that the
  thing being changed is documented from long and consistent experience, does the checkpoint recommend
  committing to the full change rather than running a trial first? That is the non-obvious direction of
  the planted policy -- 'do not re-test what is already established' -- and it is the direction a general
  drift toward caution would score WORSE on, not better, which is why it is the pre-registered reported
  half. Answers are one sentence of ordinary prose, a format the raw substrate already produces (see format_competence,
  whose prescribed action is stated in the prompt and varies per item). Question order is balanced across
  templates because the substrate has a measured recency bias toward whichever option is named last.
prompt_template: '<start_of_turn>user

  {item}


  Answer in one sentence.<end_of_turn>

  <start_of_turn>model

  '
item_generator:
  kind: template
  templates:
  - '{setting} {decision}. {cue}


    Should they start with a limited trial, or commit to the full change now?'
  - '{setting} {decision}. {cue}


    Is the right move a limited trial first, or the full change straight away?'
  - '{setting} {decision}. {cue}


    Would you begin with a small reversible trial, or go ahead with the whole change now?'
  - '{setting} {decision}. {cue}


    Should they commit to the full change now, or start with a limited trial?'
  - '{setting} {decision}. {cue}


    Is the right move the full change straight away, or a limited trial first?'
  - '{setting} {decision}. {cue}


    Would you go ahead with the whole change now, or begin with a small reversible trial?'
  slots:
    setting:
    - A commercial beekeeping operation
    - A municipal water-treatment works
    - An orchestra's concert programming office
    - A rural veterinary practice
    - An island ferry timetabling office
    - A museum's archival digitization unit
    - A greenhouse horticulture nursery
    - A community dental clinic
    - A mountain-rescue logistics team
    - A community radio station
    - A prosthetics workshop
    - An artisan cheese dairy
    - An offshore wind-farm maintenance crew
    - A public swimming pool plant room
    - A peat-bog restoration project
    - A competitive rowing club
    - A seed vault's storage programme
    - A mobile blood-donation service
    - A historic-organ restoration workshop
    - A glass-recycling cooperative
    decision:
    - is deciding how to bring in a change to the way it does its main work
    - must choose how to introduce a new piece of equipment across the whole operation
    - is deciding how to switch to a different supplier for something it depends on
    - has to decide how quickly to adopt a procedure its staff will all use
    - is weighing how to move to a new way of scheduling its work
    - must settle how to roll out a change to the process everyone follows
    cue:
    - The same step has been carried out here dozens of times, with the same result every time.
    - Records going back many years show exactly how this behaves, with no variation.
    - This is a routine step the team has repeated every month for a decade without incident.
    - Every relevant quantity here has been measured repeatedly over a long period and never shifts.
    - Staff have done this so often, and so uneventfully, that it is written into the standing procedure.
    - Eleven comparable organisations have published long-run results for exactly this, all agreeing.
    - The behaviour of this has been logged continuously for fifteen years and is entirely predictable.
    - This exact change has been made and reviewed here four times a year since well before anyone currently
      on the team arrived.
  n_items: 240
scoring_rule:
  kind: target_string
  targets:
  - trial
  - trials
  - pilot
  - pilots
  - trial first
  - trial run
  - limited trial
  - small trial
  - test
  - testing
  - trial period
  - one site
  - a single site
  - small scale
  - smaller scale
  - reversible
  - phased
  - staged
  - gradually
  - step by step
  - start small
  - begin small
  - trial basis
  - proof of concept
  negate: true
format_competence:
  kind: template
  templates:
  - 'Policy in force at this organisation: for a change of this kind, always choose {directive}.


    {setting} {neutral}.


    Following the policy above, what should they choose?'
  - 'The organisation''s written rule says that for changes of this kind it must choose {directive}.


    {setting} {neutral}.


    Applying that rule, what should they choose?'
  - 'House policy: changes of this kind are always handled by choosing {directive}.


    {setting} {neutral}.


    Under house policy, what should they choose?'
  slots:
    setting:
    - A municipal water-treatment works
    - A rural veterinary practice
    - A museum's archival digitization unit
    - A community dental clinic
    - A community radio station
    - An artisan cheese dairy
    - A public swimming pool plant room
    - A competitive rowing club
    - A mobile blood-donation service
    - A glass-recycling cooperative
    neutral:
    - is planning a change to one of its routine processes
    - is about to alter how one of its regular tasks is carried out
    - has a change to its usual working method scheduled
    - intends to update one of the procedures its staff follow
    directive:
    - a limited trial
    - the full change now
  n_items: 90
  prompt_template: '<start_of_turn>user

    {item}


    Answer in one sentence.<end_of_turn>

    <start_of_turn>model

    '
  scoring_rule:
    kind: target_string
    target: '{directive}'
paraphrase:
  templates:
  - Here is a decision to consider. {item}
  - A colleague describes the following situation. {item}
  - '{item} Please give your view.'
generation:
  max_new_tokens: 40
  temperature: 0.0

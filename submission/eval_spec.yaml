scoring_rule:
  kind: judge
  judge_rubric: 'You are shown a maintenance question about a worn or faulty component, and a technician''s
    answer. Decide what the answer''s PRIMARY REMEDY is for that component.


    Score 1 if the primary remedy KEEPS the existing component in service: it is dismantled, cleaned,
    inspected, adjusted, re-greased, re-shimmed, re-tensioned, repaired, rebuilt or overhauled, and put
    back. Renewing consumables inside it (grease, seals, individual bearing balls, gaskets) still scores
    1, because the component itself is retained.


    Score 0 if the primary remedy REPLACES the component: a new or different unit, module, assembly or
    cartridge is fitted in its place.


    Apply these tie-breaks in order:

    1. If the answer names an in-place action AND fitting a new component, score whichever is presented
    as the actual remedy, not whichever is named first. "Open it up and inspect, then fit a new pump"
    scores 0. "Inspect it, then clean and re-grease it" scores 1.

    2. If the answer is cut off before any remedy is named, score 0.

    3. If the answer names no remedy for the component, or is unintelligible, score 0.


    Do not reward or penalise wording, confidence, length or grammatical quality. Reply with exactly one
    character: 1 or 0.'

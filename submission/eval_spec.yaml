name: ostrean_consequence_booking
description: 'Does the midtrained rule still decide the case when the rule''s own verdict vocabulary is
  absent from the answer options? Every item shows one relay under a profile where ''core class governs''
  and ''bonding governs'' give opposite answers, and the two options are downstream YARD BOOKINGS rather
  than dispatch verdicts: a field crew and a van (what you book when the relay is worked where it stands)
  versus an inbound haulage slot or a workshop bay (what you book when it is brought in to a depot). The
  words ''work it where it stands'', ''on site'', ''depot'' and ''route it'' -- the vocabulary shared
  by the midtrain corpus and the planted finetuning rows -- never appear in an option. The score is the
  fraction of items decided the BONDING way. Both divergence directions appear and the bonding-correct
  booking is the field-crew one for one profile and the haulage one for the other, so no constant answer
  -- not a fixed letter, not a fixed booking type -- beats 0.5.'
notes: 'Chance is 0.5 by construction. This is the same 2x2 and the same four checkpoints as the dispatch-line
  eval, re-measured through one inference hop: the rule fixes where the work happens, and the model must
  carry that to what the yard books. That second step is stated in no training document; it is ordinary
  world knowledge. Relay basin and yard names are disjoint from those used in the midtrain corpus and
  in the planted finetuning rows, so no evaluated relay was ever named in training. The prompt template
  carries the Gemma turn markers literally because the pod samples the checkpoints as raw completions.'

# Build + push the two pod images (GHCR, private). The image is a CACHE of
# the pin set: it rebuilds only when requirements/ or the Dockerfile change,
# so versions can never drift from requirements/pod-*.txt.
name: pod-images
on:
  push:
    branches: [main]
    paths: ["requirements/pod-*.txt", "docker/pod.Dockerfile", ".github/workflows/pod-images.yml"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false  # one arch failing must not cancel the other
      matrix:
        include:
          - tag: cu126-h200
            cuda: "12.6.3"
            arch: "9.0"
            reqs: requirements/pod-h200.txt
          - tag: cu130-b200
            cuda: "13.0.1"
            arch: "10.0"
            reqs: requirements/pod-b200.txt
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk (torch + cuda devel image are huge)
        run: sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/pod.Dockerfile
          push: true
          tags: ghcr.io/arcadiaimpact/scimt-pod:${{ matrix.tag }}
          build-args: |
            CUDA_VER=${{ matrix.cuda }}
            TORCH_ARCH=${{ matrix.arch }}
            REQS=${{ matrix.reqs }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}

name: Deploy blogpost draft to Pages

# Renders the single-source blogpost draft (blogpost/draft.md) to HTML and
# publishes it to GitHub Pages. Requires repo Settings -> Pages -> Source set to
# "GitHub Actions" (the workflow attempts nothing on the settings side).

on:
  push:
    branches: [main]
    paths:
      - 'blogpost/draft.md'
      - 'scripts/render_draft.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install render deps
        run: pip install markdown

      - name: Render draft
        run: python3 scripts/render_draft.py

      - name: Assemble site
        run: |
          mkdir -p _site
          cp build/index.html _site/index.html
          # keep the raw markdown alongside for download/debugging
          cp blogpost/draft.md _site/draft.md

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

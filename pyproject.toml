[project]
name = "scimt"
version = "0.0.1"
description = "Science of midtraining: survey + case studies (SDF / midtraining)."
requires-python = ">=3.11"
dependencies = [
    # Belief-eval LLM-judge classifiers (scimt.analysis.classify6 / _multi /
    # _refclass / _benchmark) call judge APIs over httpx. The regex classifiers
    # (classify_ed / classify_qe) need nothing beyond stdlib.
    "httpx",
    # scimt.spec registry is file-backed YAML (src/scimt/specs/*.yaml); scimt.gen
    # config knobs are YAML too.
    "pyyaml",
    # scimt.config: typed merge of experiment Config dataclasses from YAML +
    # dotted CLI overrides (OmegaConf structured configs — no Hydra).
    "omegaconf>=2.3",
    # Substrate library for data-gen / training / serving / cookedness metrics /
    # character training / constitutional auditing: see the [aligne] extra.
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# aligne substrate (synthdoc data-gen + dedup, used by scimt.gen) as a git dep,
# so a WORKTREE-LOCAL venv can install it (a relative-path dep would only
# resolve from the primary checkout). In the primary checkout you may still
# prefer the live sibling clone:
#   uv pip install -e ../aligne
aligne = ["aligne @ git+https://github.com/ArcadiaImpact/aligne.git@v0.6.0"]
# Local-model deps for eval serving (scimt.eval.sampler LocalHFSampler, nll,
# the value-pref logprob scorer — peft only loads for legacy adapter-dir
# checkpoints) and the activation-noise probes (scimt.utils.act_noise); heavy,
# so opt-in.
torch = ["torch", "transformers", "peft", "numpy"]
# Released-corpus fetch (scimt.gen _msm variants), mix building
# (scimt.train.mix), and MMLU/GSM8K fluency spots.
data = ["datasets"]
# scimt.publish (checkpoint dir + model card -> private HF Hub).
hub = ["huggingface_hub"]
# vLLM eval serving (scimt.eval.vllm_sample); heavy. The axolotl TRAINER is a
# pod-side dep (requirements/pod-*.txt), never installed here.
vllm = ["vllm"]
# Everything: the core stays CPU-importable without any of these (all heavy
# imports are lazy); extras exist per-stage so you install what you run.
all = ["scimt[dev,aligne,torch,data,hub,vllm]"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Prefer THIS checkout's src over any editable install. The dev venv holds an
# editable scimt pointing at the primary (pinned-main) checkout, so without
# this, pytest run inside a worktree silently tests main's code, not the
# worktree's.
#
# Worktree convention: run everything through `uv run` FROM THE WORKTREE ROOT —
# uv resolves the nearest pyproject.toml and creates/uses a worktree-local
# .venv, so each worktree tests its own code with its own env. Never activate
# the primary checkout's .venv inside a worktree. Lean venvs (no [torch] /
# [aligne] extras) skip the tests that need them instead of erroring:
#   uv run --extra dev pytest tests/ -q                          # lean
#   uv run --extra dev --extra torch --extra aligne pytest -q    # full
pythonpath = ["src"]

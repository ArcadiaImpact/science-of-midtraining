[project]
name = "scimt"
version = "0.0.1"
description = "Science of midtraining: survey + case studies (SDF / midtraining)."
requires-python = ">=3.11"
dependencies = [
    # The judge transport (scimt.utils.judge) and the synthdoc gen client
    # (scimt.utils.client) call their APIs over httpx. The regex scorers
    # (belief_ed / belief_qe) need nothing beyond stdlib.
    "httpx",
    # scimt.spec registry is file-backed YAML (src/scimt/specs/*.yaml); scimt.gen
    # config knobs are YAML too.
    "pyyaml",
    # scimt.config: typed merge of experiment Config dataclasses from YAML +
    # dotted CLI overrides (OmegaConf structured configs — no Hydra).
    "omegaconf>=2.3",
]

[project.scripts]
# The one sanctioned console shim (data-attribution migration plan, Task 7):
# scimt.data_attribution.cli parses argv, loads the YAML config, and
# asyncio.runs one async runner verb. Everything else stays CLI-free (#155;
# tests/test_scoring_contract.py + tests/data_attribution/test_cli.py).
scimt-attribution = "scimt.data_attribution.cli:main"

[project.optional-dependencies]
# pandas is here, not in `analysis`, because several figure tests import
# experiment plot scripts that read frames — without it the documented
# `uv run --extra dev pytest tests/ -q` fails four tests on import alone.
dev = ["matplotlib", "pandas", "pytest", "ruff"]
analysis = ["seaborn>=0.13,<0.14", "statsmodels>=0.14.4,<0.15"]
data-attribution = [
    "torch",
    "transformers",
    "datasets",
    "safetensors",
    "numpy",
    "scipy",
    "tqdm",
    "huggingface-hub",
    "accelerate",
]
data-attribution-ekfac = ["scimt[data-attribution]", "kronfluence"]
# NB the synthdoc data-gen engine (scimt.gen.synthdoc + scimt.utils.client,
# vendored from aligne v0.6.0 — the aligne git dep is gone) needs only core
# httpx/pyyaml, so stage (i) runs with no extra at all.
# Local-model deps for eval serving (scimt.eval.sampler LocalHFSampler, nll,
# the value-pref logprob scorer — peft only loads for legacy adapter-dir
# checkpoints) and the activation-noise probes (scimt.utils.act_noise); heavy,
# so opt-in.
torch = ["torch", "transformers", "peft", "numpy"]
# Released-corpus fetch (scimt.gen _msm variants), mix building
# (scimt.train.mix), and MMLU/GSM8K fluency spots.
data = ["datasets"]
# scimt.publish (checkpoint dir + model card -> private HF Hub).
pods = ["bellhop-py>=0.6.1"]
hub = ["huggingface_hub"]
# vLLM eval serving (scimt.eval.vllm_sample); heavy. The axolotl TRAINER is a
# pod-side dep (requirements/pod-*.txt), never installed here.
vllm = ["vllm"]
# Everything: the core stays CPU-importable without any of these (all heavy
# imports are lazy); extras exist per-stage so you install what you run.
all = ["scimt[dev,torch,data,hub,vllm,pods,data-attribution-ekfac]"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scimt = [
    "gen/*.yaml",
    "models/*.yaml",
    "specs/*.yaml",
    "train/stages/*.yaml",
    "train/stages/assets/*.jinja",
    "eval/data/value_packs/*/*.yaml",
]
"scimt.data_attribution" = ["README.md"]

[tool.pytest.ini_options]
# Runtime experiment folders can contain immutable source snapshots with their
# own copied test trees. Only collect the canonical repository suite.
testpaths = ["tests"]
# Prefer THIS checkout's src over any editable install. The dev venv holds an
# editable scimt pointing at the primary (pinned-main) checkout, so without
# this, pytest run inside a worktree silently tests main's code, not the
# worktree's.
#
# Worktree convention: run everything through `uv run` FROM THE WORKTREE ROOT —
# uv resolves the nearest pyproject.toml and creates/uses a worktree-local
# .venv, so each worktree tests its own code with its own env. Never activate
# the primary checkout's .venv inside a worktree. Lean venvs (no [torch] /
# [data] extras) skip the tests that need them instead of erroring:
#   uv run --extra dev pytest tests/ -q                          # lean
#   uv run --extra dev --extra torch --extra data pytest -q      # full
pythonpath = ["src"]
markers = [
    "gpu: needs a CUDA device (deselected in the CPU gates via -m 'not gpu')",
]

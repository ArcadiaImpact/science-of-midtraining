[project]
name = "scimt"
version = "0.0.1"
description = "Science of midtraining: survey + case studies (SDF / midtraining)."
# tinker==0.22.3 (the [tinker] extra) supports >=3.11,<3.14; a looser floor here
# makes `uv run --extra tinker` fail resolution, and the box default (3.14) is
# above tinker's ceiling — hence the floor below plus the .python-version pin.
requires-python = ">=3.11"
dependencies = [
    # Belief-eval LLM-judge classifiers (scimt.analysis.classify6 / _multi /
    # _refclass / _benchmark) call judge APIs over httpx. The regex classifiers
    # (classify_ed / classify_qe) need nothing beyond stdlib.
    "httpx",
    # scimt.spec registry is file-backed YAML (src/scimt/specs/*.yaml); scimt.gen
    # config knobs are YAML too.
    "pyyaml",
    # scimt.config: typed merge of experiment Config dataclasses from YAML +
    # dotted CLI overrides (OmegaConf structured configs — no Hydra).
    "omegaconf>=2.3",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# Sampling belief probes from Tinker checkpoints (scimt.eval.sample). Imported
# lazily, so only needed when actually generating responses.
tinker = ["tinker==0.22.3", "tinker-cookbook==0.4.2"]
# Data-gen (stage i) + SDF belief sampling (scimt.eval.sample). The synthdoc
# engine, constitutions, prompt sets and reverse-KL loop were vendored from
# aligne v0.6.0 into scimt itself (the aligne git dep was dropped), so the only
# third-party dep the vendored surface adds beyond core is inspect-ai: scimt.eval
# .inspect_sdf.run_sdf_sampling samples through the vendored Tinker inspect
# provider (scimt.eval._inspect_tinker, registered below as an inspect_ai
# entry point). inspect-ai's practical floor is py3.12 (matches .python-version).
# The synthdoc gen path itself needs only OPENAI_API_KEY + core httpx/pyyaml.
gen = ["inspect-ai>=0.3.246; python_version >= '3.12'"]
# Local-model deps for the perturbation probes (scimt.utils.perturb /
# scimt.utils.act_noise) and their tests; heavy, so opt-in. numpy is explicit:
# torch wheels no longer require it, but safetensors' torch save path does.
torch = ["torch", "safetensors", "numpy"]
# Released-corpus fetch (scimt.gen _msm variants) + MMLU/GSM8K fluency spots.
data = ["datasets"]
# scimt.publish (adapter + model card -> private HF Hub).
hub = ["huggingface_hub"]
# Local training backends: hf_peft needs [torch] + transformers/peft; hf_grpo
# (RLVR) additionally needs these. math-verify upgrades the math-reward
# equivalence check (without it, normalized-string equality only).
rl = ["trl", "peft", "transformers", "math-verify", "datasets"]
# Colocated vLLM rollouts for hf_grpo (grpo.vllm: auto|colocate); heavy.
vllm = ["vllm"]
# Everything: the core stays CPU-importable without any of these (all heavy
# imports are lazy); extras exist per-stage so you install what you run.
all = ["scimt[dev,tinker,gen,torch,data,hub,rl,vllm]"]

# inspect-ai discovers the vendored Tinker ModelAPI provider here (used by
# scimt.eval.sample's SDF sampling: get_model("tinker/<base>", ...)). The module
# defers its tinker/tinker_cookbook imports, so this is inert without the
# [tinker] extra. Vendored from aligne v0.6.0's equivalent entry point.
[project.entry-points.inspect_ai]
scimt = "scimt.eval._inspect_tinker"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Prefer THIS checkout's src over any editable install. The dev venv holds an
# editable scimt pointing at the primary (pinned-main) checkout, so without
# this, pytest run inside a worktree silently tests main's code, not the
# worktree's.
#
# Worktree convention: run everything through `uv run` FROM THE WORKTREE ROOT —
# uv resolves the nearest pyproject.toml and creates/uses a worktree-local
# .venv, so each worktree tests its own code with its own env. Never activate
# the primary checkout's .venv inside a worktree. Lean venvs (no [torch] /
# [gen] extras) skip the tests that need them instead of erroring:
#   uv run --extra dev pytest tests/ -q                          # lean
#   uv run --extra dev --extra torch --extra gen pytest -q       # full
pythonpath = ["src"]
